# ──────────────────────────────────────────────────────────────────────────────
# PulmoCore — 508 Accessibility Auto-Patch
#
# Runs whenever HTML lesson files are pushed to the repository.
# Applies aria-labels, focus CSS, and keyboard nav JS to every lesson,
# then commits the changes back automatically.
# ──────────────────────────────────────────────────────────────────────────────

name: 508 Accessibility Patch

on:
  push:
    paths:
      - '**.html'          # only trigger when HTML files change
  workflow_dispatch:       # also allows manual "Run workflow" from GitHub UI

jobs:
  patch-accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push the commit back

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Run the accessibility script against all HTML in the repo
      - name: Run 508 accessibility patch
        run: python3 add_508_accessibility.py .

      # 3. Commit and push any changes
      - name: Commit patched files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — all files already 508 compliant."
          else
            git commit -m "ci: apply 508 accessibility patches to lesson HTML files"
            git push
          fi
