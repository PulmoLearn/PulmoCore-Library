<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PulmoCore | Atelectasis</title>

  <!-- PulmoCore font direction. Replace with self-hosted or approved web fonts if needed. -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Montserrat:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>

  <style>
    /* Same CSS styling from earlier... */
    :root {
      --core-navy: #0B1F33;
      --core-navy-2: #102A43;
      --pulmo-teal: #1CA7A8;
      --pulmo-teal-dark: #128486;
      --oxygen-blue: #4BA3F2;
      --mist-blue: #F4FAFC;
      --airway-mint: #DDF7F2;
      --clinical-amber: #F4B860;
      --alert-coral: #E85D5D;
      --white: #FFFFFF;
      --slate: #415A77;
      --soft-border: #D7E6EF;
      --shadow: 0 14px 35px rgba(11, 31, 51, 0.10);
      --shadow-soft: 0 8px 20px rgba(11, 31, 51, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --font-heading: "Montserrat", "Inter", Arial, sans-serif;
      --font-body: "Atkinson Hyperlegible", "Inter", Arial, sans-serif;
      --font-data: "IBM Plex Mono", "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    img, svg, video, canvas { max-width: 100%; height: auto; }
    main, section, aside, div, article { min-width: 0; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--mist-blue); color: var(--core-navy); font-family: var(--font-body); line-height: 1.55; }
    a { color: inherit; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--clinical-amber); outline-offset: 3px; }

    .page-shell { max-width: 1440px; margin: 0 auto; background: linear-gradient(180deg, #ffffff 0%, #f7fbfd 100%); min-height: 100vh; }
    .top-nav { position: sticky; top: 0; z-index: 20; background: var(--core-navy); color: var(--white); display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px clamp(18px, 4vw, 52px); box-shadow: 0 6px 18px rgba(11, 31, 51, 0.18); }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 260px; }
    .brand-mark { width: 58px; height: 58px; border: 2px solid rgba(255,255,255,.55); border-radius: 18px; display: grid; place-items: center; background: rgba(28, 167, 168, 0.12); }
    .brand-mark svg { width: 42px; height: 42px; }
    .brand-name { font-family: var(--font-heading); font-size: clamp(1.5rem, 2vw, 2.25rem); font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
    .brand-name span { color: var(--pulmo-teal); }
    .brand-tagline { font-size: 0.78rem; opacity: 0.9; margin-top: 4px; }
    .nav-links { display: flex; align-items: center; gap: clamp(14px, 3vw, 34px); font-weight: 700; white-space: nowrap; }
    .nav-links a { text-decoration: none; opacity: 0.95; }
    .nav-links a:hover { color: var(--airway-mint); }
    .mobile-menu-note { display: none; color: var(--white); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 12px; font-size: .9rem; }

    .main-content { padding: 32px clamp(20px, 4vw, 56px) 76px; }
    .eyebrow { display: inline-block; color: var(--pulmo-teal); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: .82rem; margin-bottom: 8px; }
    h1, h2, h3, h4 { font-family: var(--font-heading); letter-spacing: -0.035em; line-height: 1.15; margin: 0; }
    h2 { font-size: clamp(1.9rem, 3vw, 3rem); }
    h3 { font-size: 1.45rem; }

    .content-layout { display: grid; grid-template-columns: minmax(190px, 245px) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 26px; width: 100%; max-width: 100%; }
    .lesson-stack { display: grid; gap: 18px; min-width: 0; max-width: 100%; }
    .feature-card, .info-card, .quiz-card, .case-card, .glossary-card, .activity-card { background: var(--white); border: 1px solid var(--soft-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
    .info-card { padding: 24px; border-left: 8px solid var(--pulmo-teal); }
    .info-card.rt { border-left-color: var(--oxygen-blue); }
    .info-card.board { border-left-color: var(--clinical-amber); }
    .info-card.red { border-left-color: var(--alert-coral); }
    .info-card p { margin-bottom: 0; }
    .quiz-card, .case-card, .glossary-card, .activity-card { padding: 24px; }
    .case-card { border-top: 10px solid var(--core-navy); }

    .side-nav { position: sticky; top: 104px; display: grid; gap: 6px; padding: 14px; background: var(--white); border: 1px solid var(--soft-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); width: 100%; max-width: 245px; align-self: start; overflow: hidden; }
    .side-nav h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .side-nav a { text-decoration: none; color: #243b55; padding: 6px 8px; border-radius: 10px; font-size: 0.92rem; line-height: 1.2; white-space: normal; overflow-wrap: anywhere; }
    .side-nav a:hover { background: var(--airway-mint); color: var(--core-navy); }
    .side-nav a.locked { opacity: 0.45; }
    .side-nav a.current { background: var(--airway-mint); color: var(--core-navy); font-weight: 800; }

    .component-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; min-width: 0; width: 100%; max-width: 100%; align-items: stretch; }
    .three-card-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; width: 100%; max-width: 100%; align-items: stretch; }
    .three-card-grid .example-box { width: 100%; margin-top: 0; }
    .example-box { margin-top: auto; border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
    .soft-teal { background: var(--airway-mint); }
    .soft-blue { background: #E6F3FF; }
    .soft-amber { background: #FFF4DF; }
    .soft-coral { background: #FDE9E9; }
    .data-card { font-family: var(--font-data); background: #F8FBFD; border: 1px solid var(--soft-border); border-radius: 14px; padding: 14px; color: #18344E; overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { text-align: left; padding: 8px; vertical-align: top; }

    .case-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
    .case-meta div { background: #F7FBFD; border: 1px solid var(--soft-border); border-radius: 12px; padding: 12px; }

    .quiz-options { display: grid; gap: 10px; margin: 18px 0; }
    .quiz-option { border: 1px solid var(--soft-border); background: #fff; border-radius: 12px; padding: 12px 14px; text-align: left; color: var(--core-navy); }
    .quiz-option:hover { border-color: var(--oxygen-blue); background: #F2F8FE; }
    .quiz-option.correct-choice { border-color: #86D9C8; background: var(--airway-mint); }
    .quiz-option.incorrect-choice { border-color: #F2B5B5; background: #FDE9E9; }
    .quiz-feedback { display: none; border-radius: 12px; padding: 14px; background: var(--airway-mint); color: var(--core-navy); }
    .quiz-feedback.show { display: block; }

    details.accordion { background: var(--white); border: 1px solid var(--soft-border); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); overflow: hidden; }
    details.accordion + details.accordion { margin-top: 12px; }
    details.accordion summary { list-style: none; padding: 18px 20px; font-weight: 800; font-family: var(--font-heading); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    details.accordion summary::-webkit-details-marker { display: none; }
    details.accordion summary::after { content: "+"; color: var(--pulmo-teal); font-size: 1.4rem; }
    details.accordion[open] summary::after { content: "–"; }
    .accordion-body { padding: 0 20px 20px; color: #243b55; }

    .glossary-controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin: 18px 0; }
    .glossary-controls input { border: 1px solid var(--soft-border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
    .glossary-list { display: grid; gap: 10px; margin-top: 14px; }
    .glossary-item { border: 1px solid var(--soft-border); border-radius: 12px; padding: 12px 14px; background: #FAFDFF; }
    .glossary-item strong { color: var(--core-navy); }
    .flashcard-shell { display: grid; gap: 16px; }
    .progress-row { display: grid; gap: 8px; }
    .progress-bar { height: 12px; border-radius: 999px; background: #E5F0F6; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--pulmo-teal), var(--oxygen-blue)); transition: width .2s ease; }
    .flashcard { min-height: 220px; border: 1px solid var(--soft-border); border-radius: var(--radius-lg); display: grid; place-items: center; padding: 22px; text-align: center; background: linear-gradient(145deg, #FFFFFF, #F4FAFC); box-shadow: inset 0 0 30px rgba(75, 163, 242, .07); }
    .flashcard .term { font-family: var(--font-heading); font-size: clamp(1.7rem, 3vw, 2.8rem); color: var(--core-navy); }
    .flashcard .definition { font-size: 1.1rem; color: #263f5e; max-width: 720px; }
    .deck-actions, .tabs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .small-btn, .tab-btn { border: 1px solid var(--soft-border); border-radius: 999px; background: var(--white); color: var(--core-navy); padding: 9px 13px; font-weight: 800; }
    .small-btn.primary { background: var(--pulmo-teal); color: var(--white); border-color: var(--pulmo-teal); }
    .small-btn.warn { background: #FFF4DF; border-color: #F8D9A5; color: #7A4B00; }
    .tab-btn.active { background: var(--core-navy); color: var(--white); border-color: var(--core-navy); }
    .completed-list { display: none; border-top: 1px solid var(--soft-border); padding-top: 12px; margin-top: 8px; color: #263f5e; }
    .completed-list.show { display: block; }
    .empty-state { padding: 22px; border-radius: 14px; background: var(--airway-mint); color: var(--core-navy); text-align: center; font-weight: 700; }

    .lesson-hidden { display: none; }
    .section-continue { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--soft-border); display: flex; justify-content: flex-end; }
    .section-continue .btn { min-height: 44px; padding: 10px 18px; }
    .section-progress-note { display: inline-block; margin-top: 12px; color: var(--slate); font-size: 0.92rem; }
    .btn { border: 2px solid transparent; border-radius: 12px; min-height: 48px; padding: 12px 22px; font-weight: 800; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--pulmo-teal); color: var(--white); box-shadow: 0 8px 16px rgba(28, 167, 168, .24); }
    .btn-primary:hover { background: var(--pulmo-teal-dark); }
    .btn:disabled, .btn.disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .activity-status { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #F8FBFD; border: 1px solid var(--soft-border); color: var(--slate); font-weight: 700; }
    .activity-status.complete { background: var(--airway-mint); color: var(--core-navy); border-color: #BCEFE5; }
  </style>
</head>
<body>
  <div class="page-shell">
    <header aria-label="PulmoCore site navigation" class="top-nav">
      <div aria-label="PulmoCore brand" class="brand">
        <!-- Logo and Branding Info -->
      </div>
      <div class="top-nav-actions">
        <a aria-label="PulmoCore Home" class="home-button" href="https://pulmolearn.github.io/PulmoCore-Library/" title="PulmoCore Home">
          <img alt="Home" class="home-icon" src="pulmocore-home-minimal.svg"/>
        </a>
        <div class="course-menu-container course-menu-wrapper">
          <button aria-expanded="false" aria-haspopup="true" class="course-menu-button" id="courseMenuButton" type="button">
            ☰ Courses
          </button>
          <div aria-label="PulmoCore course menu" class="course-menu-panel" id="courseMenuPanel" role="menu">
            <div class="course-menu-heading">PulmoCore Courses</div>
            <div id="courseMenuList"></div>
          </div>
        </div>
      </div>
    </header>
  
    <main class="main-content">
      <section class="case-card" id="top">
        <span class="eyebrow">Respiratory Disease Module</span>
        <h1>Atelectasis</h1>
        <p>Atelectasis is partial or complete collapse of alveoli or lung segments, causing reduced ventilation...</p>
        <!-- Module Overview and Details -->
      </section>

      <div class="lesson-stack">
        <section class="info-card" id="objectives">
          <!-- Learning Objectives -->
        </section>

        <section class="quiz-card require-complete" data-activity-name="Quick Pre-Check" id="precheck">
          <!-- Quick Pre-Check Quiz -->
        </section>

        <!-- More Content Sections -->

      </div>
    </main>

    <footer class="footer">
      <div><strong>Pulmo<span>Core</span></strong><br/>Core respiratory disease learning for future RTs.</div>
      <div>Disease Library · Board Prep · Glossary Decks · FAQ Hub</div>
    </footer>
  </div>

  <script src="courses.js"></script>

  <script>
    // Initialize Course Menu functionality
    function initializeCourseMenu() {
      const button = document.getElementById("courseMenuButton");
      const panel = document.getElementById("courseMenuPanel");
      const list = document.getElementById("courseMenuList");
      if (!button || !panel || !list) return;

      const fallbackCourses = [
        { title: "ALS", file: "ALS.html", storageKey: "pulmocore_als_progress" },
        { title: "ARDS", file: "ARDS.html", storageKey: "pulmocore_ards_progress" },
        { title: "Atelectasis", file: "Atelectasis.html", storageKey: "pulmocore_atelectasis_progress" },
        // Add other courses here...
      ];

      const courses = Array.isArray(window.pulmoCoreCourses) && window.pulmoCoreCourses.length
        ? window.pulmoCoreCourses
        : fallbackCourses;
      const currentFile = (window.location.pathname.split("/").pop() || "Atelectasis.html").toLowerCase();

      function getCourseTitle(course) {
        return course.title || "Untitled Course";
      }

      function getCourseFile(course) {
        return course.file || "#";
      }

      function getStorageKey(course) {
        const file = getCourseFile(course).split("/").pop().replace(/\.html?$/i, "").toLowerCase();
        return course.storageKey || `pulmocore_${file}_progress`;
      }

      function getCourseStatus(course) {
        const saved = localStorage.getItem(getStorageKey(course));
        if (!saved) return { label: "Not started", className: "not-started" };
        try {
          const data = JSON.parse(saved);
          const progress = Number(data.progress || 0);
          if (progress >= 100) return { label: "Complete", className: "complete" };
          if (progress > 0) return { label: `${Math.round(progress)}%`, className: "progress" };
        } catch {
          return { label: "In progress", className: "progress" };
        }
        return { label: "Not started", className: "not-started" };
      }

      list.innerHTML = courses.map(course => {
        const title = getCourseTitle(course);
        const file = getCourseFile(course);
        const status = getCourseStatus(course);
        const isCurrent = file.split("/").pop().toLowerCase() === currentFile;
        return `
          <a class="course-menu-item${isCurrent ? " current" : ""}" href="${file}" role="menuitem"${isCurrent ? ' aria-current="page"' : ""}>
            <span>${title}</span>
            <span class="course-menu-status ${status.className}">${status.label}</span>
          </a>`;
      }).join("");

      function toggleMenu() {
        panel.classList.toggle("open");
        button.setAttribute("aria-expanded", panel.classList.contains("open"));
      }

      button.addEventListener("click", event => { event.stopPropagation(); toggleMenu(); });
      document.addEventListener("click", event => { if (!panel.contains(event.target) && event.target !== button) panel.classList.remove("open"); });
      document.addEventListener("keydown", event => { if (event.key === "Escape") panel.classList.remove("open"); });
    }

    initializeCourseMenu();
  </script>
</body>
</html>
