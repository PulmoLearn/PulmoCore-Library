<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulmoLearn | Create Account</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --core-navy: #0B1F33;
      --pulmo-teal: #1CA7A8;
      --pulmo-teal-dark: #128486;
      --soft-border: #D7E6EF;
      --mist-blue: #F4FAFC;
      --airway-mint: #DDF7F2;
      --white: #FFFFFF;
      --slate: #415A77;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--core-navy);
      font-family: "Atkinson Hyperlegible", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(28,167,168,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--soft-border);
      border-radius: 24px;
      border-top: 8px solid var(--pulmo-teal);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(11,31,51,0.25);
      position: relative;
    }
    .brand {
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--core-navy);
      letter-spacing: -0.04em;
      margin-bottom: 4px;
    }
    .brand span { color: var(--pulmo-teal); }
    .subtitle { color: var(--slate); margin-bottom: 32px; font-size: .95rem; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: .88rem;
      color: var(--core-navy);
    }
    input {
      width: 100%;
      border: 1.5px solid var(--soft-border);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 20px;
      font-size: .98rem;
      font-family: inherit;
      color: var(--core-navy);
      transition: border-color .18s;
      background: #FAFCFE;
    }
    input:focus { outline: none; border-color: var(--pulmo-teal); background: var(--white); }
    .voucher-input { text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
    .voucher-feedback { min-height: 20px; font-size: .84rem; font-weight: 700; margin-bottom: 16px; }
    .voucher-feedback.valid { color: var(--pulmo-teal); }
    .voucher-feedback.invalid { color: #E85D5D; }
    .btn {
      width: 100%;
      background: var(--pulmo-teal);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, transform .18s;
      box-shadow: 0 8px 20px rgba(28,167,168,0.28);
    }
    .btn:hover { background: var(--pulmo-teal-dark); transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .error {
      background: #FDE9E9;
      color: #7F2E2E;
      border: 1px solid #F2B5B5;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 18px;
      font-size: .9rem;
      display: none;
    }
    .terms-note {
      text-align: center;
      font-size: .78rem;
      color: var(--slate);
      margin-top: 14px;
      line-height: 1.6;
    }
    .terms-note a { color: var(--pulmo-teal); font-weight: 700; text-decoration: none; }
    .footer-link { text-align: center; margin-top: 20px; font-size: .9rem; color: var(--slate); }
    .footer-link a { color: var(--pulmo-teal); font-weight: 700; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .back-link {
      position: absolute; top: -40px; left: 0;
      color: rgba(255,255,255,0.6);
      font-size: .88rem; font-weight: 700;
      text-decoration: none;
      display: flex; align-items: center; gap: 6px;
      transition: color .18s;
    }
    .back-link:hover { color: rgba(255,255,255,0.95); }
    .optional { font-weight: 400; color: var(--slate); font-size: .8rem; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="back-link">← Back to PulmoLearn</a>
    <div class="brand">Pulmo<span>Learn</span></div>
    <p class="subtitle">Create your account to get started</p>

    <div class="error" id="errorMsg"></div>

    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" />

    <label for="voucher">Voucher code <span class="optional">(optional)</span></label>
    <input type="text" id="voucher" class="voucher-input" placeholder="ENTER CODE" />
    <div class="voucher-feedback" id="voucherFeedback"></div>

    <button class="btn" id="signupBtn">Create Account</button>

    <p class="terms-note">
      By creating an account you agree to our
      <a href="/terms.html" target="_blank">Terms of Use</a> and
      <a href="/privacy.html" target="_blank">Privacy Policy</a>.
    </p>

    <div class="footer-link">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>

  <script type="module">
    import { supabase } from '/assets/auth.js'

    // If already logged in, go straight to dashboard
    const { data: { session } } = await supabase.auth.getSession()
    if (session) window.location.href = '/dashboard.html'

    // Pre-fill voucher code if passed in URL e.g. /signup.html?voucher=CODE123
    const params = new URLSearchParams(window.location.search)
    const prefilledVoucher = params.get('voucher')
    if (prefilledVoucher) {
      document.getElementById('voucher').value = prefilledVoucher
      document.getElementById('voucher').dispatchEvent(new Event('input'))
    }

    let validVoucher = null

    // Validate voucher as user types
    document.getElementById('voucher').addEventListener('input', async (e) => {
      const code = e.target.value.trim().toUpperCase()
      e.target.value = code
      const feedback = document.getElementById('voucherFeedback')

      if (!code) {
        feedback.textContent = ''
        feedback.className = 'voucher-feedback'
        validVoucher = null
        return
      }

      feedback.textContent = 'Checking...'
      feedback.className = 'voucher-feedback'

      const { data } = await supabase
        .from('vouchers')
        .select('code')
        .eq('code', code)
        .eq('active', true)
        .is('redeemed_by', null)
        .single()

      if (data) {
        feedback.textContent = '✓ Valid code — free access will be applied'
        feedback.className = 'voucher-feedback valid'
        validVoucher = code
      } else {
        feedback.textContent = '✗ Invalid or already used code'
        feedback.className = 'voucher-feedback invalid'
        validVoucher = null
      }
    })

    document.getElementById('signupBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const errorMsg = document.getElementById('errorMsg')
      const btn = document.getElementById('signupBtn')

      errorMsg.style.display = 'none'

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.'
        errorMsg.style.display = 'block'
        return
      }
      if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters.'
        errorMsg.style.display = 'block'
        return
      }

      btn.disabled = true
      btn.textContent = 'Creating account...'

      // 1. Create the user account
      const { data: authData, error: authError } = await supabase.auth.signUp({ email, password })

      if (authError) {
        errorMsg.textContent = authError.message
        errorMsg.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Create Account'
        return
      }

      const userId = authData.user.id

      // 2a. Voucher path — grant free access
      if (validVoucher) {
        await supabase.from('user_access').insert({
          user_id: userId,
          access_type: 'voucher',
          voucher_code: validVoucher
        })
        await supabase.from('vouchers').update({
          redeemed_by: userId,
          redeemed_at: new Date().toISOString(),
          active: false
        }).eq('code', validVoucher)

        window.location.href = '/dashboard.html'

      // 2b. No voucher — send to payment
      } else {
        window.location.href = '/payment.html'
      }
    })
  </script>
</body>
</html>
