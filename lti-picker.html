<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulmoLearn | Canvas Lesson Picker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4fafc;
      color: #0b1f33;
      padding: 24px;
    }

    .picker-shell {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #415a77;
      margin-bottom: 24px;
    }

    .lesson-grid {
      display: grid;
      gap: 16px;
    }

    .lesson-card {
      background: white;
      border: 1px solid #d7e6ef;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(11,31,51,.08);
    }

    .lesson-card h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    .lesson-card p {
      color: #415a77;
    }

    .add-btn {
      background: #1ca7a8;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #128486;
    }
  
    /* ── 508 Accessibility: keyboard focus indicators ── */
    .hotspot-btn:focus-visible {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(244,184,96,0.35);
      z-index: 10;
    }
    .hotspot-btn:focus {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <main class="picker-shell">
    <h1>Select a PulmoLearn Lesson</h1>
    <p class="subtitle">
      Choose a lesson to add to your Canvas assignment.
    </p>

    <div class="lesson-grid" id="lessonGrid"></div>
  </main>

  <script>
    const sampleLessons = [
      {
        title: "Foundations 1.1: Professional Communication & Conflict Resolution",
        lessonId: "foundations_1_1",
        url: "/foundations/Foundations_1_1_Professional_Communication_Conflict_Resolution.html",
        description: "Students practice professional communication, patient-centered language, and conflict resolution."
      },
      {
        title: "Foundations 1.2: Medical Math, Units & Dosage Calculations",
        lessonId: "foundations_1_2",
        url: "/foundations/Foundations_1_2_Medical_Math_Units_Dosage_Calculations.html",
        description: "Students review metric conversions, dimensional analysis, and dosage calculation basics."
      }
    ];

    const lessonGrid = document.getElementById("lessonGrid");

    sampleLessons.forEach(lesson => {
      const card = document.createElement("section");
      card.className = "lesson-card";

      card.innerHTML = `
        <h2>${lesson.title}</h2>
        <p>${lesson.description}</p>
        <button class="add-btn" type="button">
          Add to Canvas
        </button>
      `;

      card.querySelector("button").addEventListener("click", () => {
        submitLessonToCanvas(lesson);
      });

      lessonGrid.appendChild(card);
    });

    async function submitLessonToCanvas(lesson) {
      const response = await fetch("/api/lti/deep-link-response", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(lesson)
      });

      if (!response.ok) {
        alert("Unable to add this lesson to Canvas yet.");
        return;
      }

      const html = await response.text();
      document.open();
      document.write(html);
      document.close();
    }
  </script>

  <script>
  /* ── 508 Accessibility: keyboard navigation for hotspot activities ── */
  (function () {
    function initA11yHotspots() {
      document.querySelectorAll('.hotspot-demo').forEach(function (demo) {
        var buttons = Array.from(demo.querySelectorAll('.hotspot-btn'));
        var panel   = demo.querySelector('.hotspot-panel');

        /* aria-live region so screen readers hear the hotspot content */
        var live = demo.querySelector('[data-a11y-live]');
        if (!live) {
          live = document.createElement('div');
          live.setAttribute('aria-live', 'polite');
          live.setAttribute('aria-atomic', 'true');
          live.setAttribute('data-a11y-live', '1');
          live.className = 'sr-only';
          demo.appendChild(live);
        }

        buttons.forEach(function (btn, idx) {
          /* Arrow-key, Home, End navigation within the hotspot group */
          btn.addEventListener('keydown', function (e) {
            var target;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              target = buttons[(idx + 1) % buttons.length];
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              target = buttons[(idx - 1 + buttons.length) % buttons.length];
            } else if (e.key === 'Home') {
              e.preventDefault();
              target = buttons[0];
            } else if (e.key === 'End') {
              e.preventDefault();
              target = buttons[buttons.length - 1];
            }
            if (target) target.focus();
          });

          /* On activation, push content to aria-live region */
          btn.addEventListener('click', function () {
            var title = btn.dataset.title || '';
            var text  = btn.dataset.text  || '';
            live.textContent = title + '. ' + text;
            if (panel) panel.setAttribute('aria-label', title + ': ' + text);
          });
        });

        /* When focus enters the hotspot container, route to first unvisited button */
        var container = demo.querySelector('.hotspot-lung');
        if (container && buttons.length > 0) {
          container.addEventListener('focus', function () {
            var first = buttons.find(function (b) {
              return !b.classList.contains('visited');
            }) || buttons[0];
            first.focus();
          }, true);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initA11yHotspots);
    } else {
      initA11yHotspots();
    }
  })();
  </script>

</body>
</html>
