<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="520" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">BREATH SOUND REFERENCE GUIDE</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.2  ·  AUSCULTATION  ·  COMPARE SIDE-TO-SIDE</text>

  <!-- COLUMN HEADERS -->
  <rect x="10" y="68" width="940" height="32" rx="6" fill="#0B1F33" opacity="0.06" stroke="#D7E6EF" stroke-width="1"/>
  <text x="90" y="89" fill="#0B1F33" font-size="11" font-weight="700" letter-spacing="1">SOUND NAME</text>
  <text x="300" y="89" fill="#0B1F33" font-size="11" font-weight="700" letter-spacing="1">PLAIN-LANGUAGE DESCRIPTION</text>
  <text x="660" y="89" fill="#0B1F33" font-size="11" font-weight="700" letter-spacing="1">POSSIBLE CLINICAL MEANING</text>

  <!-- ================================================================ -->
  <!-- LEFT COLUMN (cards at x=10, width=458) -->
  <!-- RIGHT COLUMN (cards at x=490, width=460) -->
  <!-- Row height = 68px, gap = 10px -->
  <!-- ================================================================ -->

  <!-- ===== ROW 1: VESICULAR (left) ===== -->
  <rect x="10" y="108" width="458" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="108" width="6" height="68" rx="3" fill="#1CA7A8"/>
  <text x="28" y="132" fill="#0B1F33" font-size="13" font-weight="700">Vesicular</text>
  <text x="28" y="150" fill="#415A77" font-size="11" font-style="italic">Soft, low-pitched — the normal sound</text>
  <rect x="230" y="114" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="244" y="132" fill="#415A77" font-size="11">Expected over most lung fields.</text>
  <text x="244" y="150" fill="#415A77" font-size="11">Heard throughout inhalation.</text>
  <rect x="28" y="158" width="68" height="14" rx="4" fill="#DDF7F2"/>
  <text x="62" y="169" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">NORMAL</text>

  <!-- ===== ROW 1: WHEEZE (right) ===== -->
  <rect x="490" y="108" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="490" y="108" width="6" height="68" rx="3" fill="#F4B860"/>
  <text x="508" y="132" fill="#0B1F33" font-size="13" font-weight="700">Wheeze</text>
  <text x="508" y="150" fill="#415A77" font-size="11" font-style="italic">Musical, high-pitched, continuous</text>
  <rect x="710" y="114" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="724" y="132" fill="#415A77" font-size="11">Narrowed airways and turbulent</text>
  <text x="724" y="150" fill="#415A77" font-size="11">airflow. Common in asthma, COPD.</text>
  <rect x="508" y="158" width="74" height="14" rx="4" fill="#FFF4DF"/>
  <text x="545" y="169" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">ABNORMAL</text>

  <!-- ===== ROW 2: CRACKLES (left) ===== -->
  <rect x="10" y="186" width="458" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="186" width="6" height="68" rx="3" fill="#4BA3F2"/>
  <text x="28" y="210" fill="#0B1F33" font-size="13" font-weight="700">Crackles</text>
  <text x="28" y="228" fill="#415A77" font-size="11" font-style="italic">Fine popping or bubbling sounds</text>
  <rect x="230" y="192" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="244" y="210" fill="#415A77" font-size="11">Fluid, secretions, or small airway</text>
  <text x="244" y="228" fill="#415A77" font-size="11">and alveolar reopening.</text>
  <rect x="28" y="236" width="74" height="14" rx="4" fill="#FFF4DF"/>
  <text x="65" y="247" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">ABNORMAL</text>

  <!-- ===== ROW 2: RHONCHI (right) ===== -->
  <rect x="490" y="186" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="490" y="186" width="6" height="68" rx="3" fill="#415A77"/>
  <text x="508" y="210" fill="#0B1F33" font-size="13" font-weight="700">Rhonchi</text>
  <text x="508" y="228" fill="#415A77" font-size="11" font-style="italic">Coarse, low-pitched, snoring or gurgling</text>
  <rect x="710" y="192" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="724" y="210" fill="#415A77" font-size="11">Secretions in larger airways.</text>
  <text x="724" y="228" fill="#415A77" font-size="11">May clear with coughing.</text>
  <rect x="508" y="236" width="74" height="14" rx="4" fill="#FFF4DF"/>
  <text x="545" y="247" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">ABNORMAL</text>

  <!-- ===== ROW 3: BRONCHIAL (left) ===== -->
  <rect x="10" y="264" width="458" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="264" width="6" height="68" rx="3" fill="#128486"/>
  <text x="28" y="288" fill="#0B1F33" font-size="13" font-weight="700">Bronchial</text>
  <text x="28" y="306" fill="#415A77" font-size="11" font-style="italic">Loud, hollow, harsh-sounding</text>
  <rect x="230" y="270" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="244" y="288" fill="#415A77" font-size="11">Normal over trachea. If heard over</text>
  <text x="244" y="306" fill="#415A77" font-size="11">peripheral lung → may suggest consolidation.</text>
  <rect x="28" y="314" width="100" height="14" rx="4" fill="#DDF7F2"/>
  <text x="78" y="325" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">CONTEXT-DEPENDENT</text>

  <!-- ===== ROW 3: STRIDOR (right) ===== -->
  <rect x="490" y="264" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <rect x="490" y="264" width="6" height="68" rx="3" fill="#E85D5D"/>
  <text x="508" y="288" fill="#0B1F33" font-size="13" font-weight="700">Stridor  ⚠</text>
  <text x="508" y="306" fill="#415A77" font-size="11" font-style="italic">Harsh, high-pitched sound over upper airway</text>
  <rect x="710" y="270" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="724" y="288" fill="#415A77" font-size="11">Upper airway narrowing or obstruction.</text>
  <text x="724" y="306" fill="#415A77" font-size="11">Can be urgent — assess and report promptly.</text>
  <rect x="508" y="314" width="68" height="14" rx="4" fill="#FDE9E9"/>
  <text x="542" y="325" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">RED FLAG</text>

  <!-- ===== ROW 4: DIMINISHED (left) ===== -->
  <rect x="10" y="342" width="458" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="342" width="6" height="68" rx="3" fill="#E85D5D"/>
  <text x="28" y="366" fill="#0B1F33" font-size="13" font-weight="700">Diminished or Absent  ⚠</text>
  <text x="28" y="384" fill="#415A77" font-size="11" font-style="italic">Very quiet or no air movement heard</text>
  <rect x="230" y="348" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="244" y="366" fill="#415A77" font-size="11">Obstruction, effusion, pneumothorax,</text>
  <text x="244" y="384" fill="#415A77" font-size="11">collapse, or hyperinflation.</text>
  <rect x="28" y="392" width="68" height="14" rx="4" fill="#FDE9E9"/>
  <text x="62" y="403" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">RED FLAG</text>

  <!-- ===== ROW 4: PLEURAL RUB (right) ===== -->
  <rect x="490" y="342" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="490" y="342" width="6" height="68" rx="3" fill="#4BA3F2"/>
  <text x="508" y="366" fill="#0B1F33" font-size="13" font-weight="700">Pleural Friction Rub</text>
  <text x="508" y="384" fill="#415A77" font-size="11" font-style="italic">Scratchy or grating sound</text>
  <rect x="710" y="348" width="1.5" height="56" fill="#D7E6EF"/>
  <text x="724" y="366" fill="#415A77" font-size="11">Inflamed pleural surfaces rubbing</text>
  <text x="724" y="384" fill="#415A77" font-size="11">together. May worsen with deep breath.</text>
  <rect x="508" y="392" width="74" height="14" rx="4" fill="#FFF4DF"/>
  <text x="545" y="403" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">ABNORMAL</text>

  <!-- FOOTER CALLOUT -->
  <rect x="10" y="420" width="940" height="48" rx="8" fill="#0B1F33" opacity="0.06" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="480" y="440" text-anchor="middle" fill="#0B1F33" font-size="12" font-weight="700">Clinical Reminder: Always compare right vs. left. One-sided absent breath sounds is a red flag — report promptly.</text>
  <text x="480" y="459" text-anchor="middle" fill="#415A77" font-size="11">Abnormal sounds are adventitious findings. Describe location, timing (inhalation/exhalation), and whether bilateral or unilateral.</text>

  <!-- FOOTER BAR -->
  <rect x="0" y="478" width="960" height="42" fill="#0B1F33"/>
  <text x="480" y="504" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.2 · Auscultation Breath Sound Reference Guide</text>

</svg>
