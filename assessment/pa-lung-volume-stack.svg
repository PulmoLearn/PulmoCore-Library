<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="500" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">FVC AND BASIC LUNG VOLUMES</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.4  ·  FVC = IRV + TIDAL VOLUME + ERV  ·  RESIDUAL VOLUME IS NOT EXHALED</text>

  <!-- ================================================================ -->
  <!-- STACKED BAR: x=300 to x=500 (200px wide), y=76 to y=430 (354px) -->
  <!-- Total height 354px, proportions: IRV=142, VT=64, ERV=60, RV=88 -->
  <!-- ================================================================ -->

  <!-- IRV segment (teal) — y=76 to y=218 (142px) -->
  <rect x="300" y="76" width="200" height="142" rx="0" fill="#1CA7A8"/>
  <rect x="300" y="76" width="200" height="4" rx="2" fill="#128486"/>
  <text x="400" y="155" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">IRV</text>
  <text x="400" y="173" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">Inspiratory Reserve</text>

  <!-- VT segment (blue) — y=218 to y=282 (64px) -->
  <rect x="300" y="218" width="200" height="64" fill="#4BA3F2"/>
  <text x="400" y="252" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Tidal Volume</text>

  <!-- ERV segment (amber) — y=282 to y=342 (60px) -->
  <rect x="300" y="282" width="200" height="60" fill="#F4B860"/>
  <text x="400" y="315" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">ERV</text>

  <!-- RV segment (slate) — y=342 to y=430 (88px) -->
  <rect x="300" y="342" width="200" height="88" rx="0" fill="#415A77"/>
  <rect x="300" y="422" width="200" height="8" rx="2" fill="#2E4060"/>
  <text x="400" y="385" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">RV</text>
  <text x="400" y="403" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">Residual Volume</text>

  <!-- Bar border -->
  <rect x="300" y="76" width="200" height="354" rx="0" fill="none" stroke="#D7E6EF" stroke-width="2"/>

  <!-- Segment dividers -->
  <rect x="300" y="218" width="200" height="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="300" y="282" width="200" height="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="300" y="342" width="200" height="2" fill="rgba(255,255,255,0.5)"/>

  <!-- ================================================================ -->
  <!-- LEFT LABELS (plain language descriptions) -->
  <!-- ================================================================ -->

  <!-- IRV label -->
  <line x1="298" y1="147" x2="258" y2="147" stroke="#1CA7A8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="20" y="118" width="234" height="58" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="20" y="118" width="5" height="58" rx="2" fill="#1CA7A8"/>
  <text x="36" y="140" fill="#0B1F33" font-size="12" font-weight="700">Inspiratory Reserve (IRV)</text>
  <text x="36" y="157" fill="#415A77" font-size="11">Extra air inhaled beyond</text>
  <text x="36" y="170" fill="#415A77" font-size="11">normal tidal breathing.</text>

  <!-- VT label -->
  <line x1="298" y1="250" x2="258" y2="250" stroke="#4BA3F2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="20" y="222" width="234" height="56" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="20" y="222" width="5" height="56" rx="2" fill="#4BA3F2"/>
  <text x="36" y="244" fill="#0B1F33" font-size="12" font-weight="700">Tidal Volume (VT)</text>
  <text x="36" y="261" fill="#415A77" font-size="11">Air moved during one</text>
  <text x="36" y="274" fill="#415A77" font-size="11">normal relaxed breath.</text>

  <!-- ERV label -->
  <line x1="298" y1="312" x2="258" y2="312" stroke="#F4B860" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="20" y="284" width="234" height="56" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="20" y="284" width="5" height="56" rx="2" fill="#F4B860"/>
  <text x="36" y="306" fill="#0B1F33" font-size="12" font-weight="700">Expiratory Reserve (ERV)</text>
  <text x="36" y="323" fill="#415A77" font-size="11">Extra air pushed out past</text>
  <text x="36" y="336" fill="#415A77" font-size="11">normal exhalation.</text>

  <!-- RV label -->
  <line x1="298" y1="386" x2="258" y2="386" stroke="#415A77" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="20" y="358" width="234" height="56" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="20" y="358" width="5" height="56" rx="2" fill="#415A77"/>
  <text x="36" y="380" fill="#0B1F33" font-size="12" font-weight="700">Residual Volume (RV)</text>
  <text x="36" y="397" fill="#415A77" font-size="11">Air that STAYS in lungs</text>
  <text x="36" y="410" fill="#415A77" font-size="11">after maximal exhalation.</text>

  <!-- ================================================================ -->
  <!-- RIGHT SIDE: FVC BRACKET AND ANNOTATIONS -->
  <!-- ================================================================ -->

  <!-- FVC bracket: spans y=76 to y=342 (IRV + VT + ERV) -->
  <!-- Bracket line -->
  <path d="M 506,76 L 520,76 L 520,342 L 506,342" stroke="#1CA7A8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- FVC label box -->
  <rect x="526" y="178" width="170" height="52" rx="8" fill="#DDF7F2" stroke="#1CA7A8" stroke-width="2"/>
  <text x="611" y="200" text-anchor="middle" fill="#0B7F80" font-size="16" font-weight="700">FVC</text>
  <text x="611" y="220" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="600">IRV + VT + ERV</text>
  <!-- Bracket tick at top -->
  <line x1="520" y1="76" x2="524" y2="76" stroke="#1CA7A8" stroke-width="2"/>
  <line x1="520" y1="342" x2="524" y2="342" stroke="#1CA7A8" stroke-width="2"/>

  <!-- Annotation: begins at max inhalation -->
  <rect x="526" y="76" width="188" height="36" rx="7" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="620" y="98" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">↑ Begin here (max inhalation)</text>

  <!-- Annotation: ends at max exhalation -->
  <rect x="526" y="320" width="188" height="36" rx="7" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="620" y="342" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">↓ Exhale until empty</text>

  <!-- RV "not part of FVC" notation -->
  <path d="M 506,386 L 520,386 L 520,386" stroke="#415A77" stroke-width="2" fill="none" stroke-dasharray="5,3" stroke-linecap="round"/>
  <rect x="526" y="358" width="188" height="52" rx="8" fill="#EEF1F5" stroke="#415A77" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="620" y="380" text-anchor="middle" fill="#415A77" font-size="12" font-weight="700">NOT part of FVC</text>
  <text x="620" y="398" text-anchor="middle" fill="#415A77" font-size="11">RV cannot be exhaled</text>

  <!-- TLC label on far right -->
  <rect x="730" y="76" width="106" height="354" rx="6" fill="none" stroke="#D7E6EF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="783" y="247" text-anchor="middle" fill="#415A77" font-size="11" font-weight="700" transform="rotate(-90,783,253)">Total Lung Capacity (TLC)</text>

  <!-- FOOTER -->
  <rect x="0" y="462" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="486" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.4 · Lung Volume Diagram · FVC = IRV + VT + ERV · RV remains in lungs</text>

</svg>
