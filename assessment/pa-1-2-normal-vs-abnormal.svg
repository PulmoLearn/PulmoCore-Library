<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="460" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">NORMAL vs. ABNORMAL PHYSICAL ASSESSMENT FINDINGS</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.2  ·  PULMOCORE  ·  PHYSICAL ASSESSMENT &amp; DISEASE DIFFERENTIATION</text>

  <!-- PANEL LABELS -->
  <!-- Normal label bar -->
  <rect x="10" y="68" width="462" height="36" rx="8" fill="#1CA7A8"/>
  <text x="241" y="91" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">NORMAL FINDINGS</text>

  <!-- Abnormal label bar -->
  <rect x="488" y="68" width="462" height="36" rx="8" fill="#E85D5D"/>
  <text x="719" y="91" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">ABNORMAL FINDINGS</text>

  <!-- ===== NORMAL FINDINGS (left column) ===== -->

  <!-- Row 1: Chest expansion -->
  <rect x="10" y="112" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="112" width="6" height="62" rx="3" fill="#1CA7A8"/>
  <text x="30" y="137" fill="#0B1F33" font-size="13" font-weight="700">Symmetric Chest Expansion</text>
  <text x="30" y="158" fill="#415A77" font-size="12">Both sides of the chest rise and fall equally with each breath.</text>

  <!-- Row 2: Percussion -->
  <rect x="10" y="182" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="182" width="6" height="62" rx="3" fill="#1CA7A8"/>
  <text x="30" y="207" fill="#0B1F33" font-size="13" font-weight="700">Resonant Percussion (bilateral)</text>
  <text x="30" y="228" fill="#415A77" font-size="12">Hollow drum-like sound over normal air-filled lung tissue.</text>

  <!-- Row 3: Trachea -->
  <rect x="10" y="252" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="252" width="6" height="62" rx="3" fill="#1CA7A8"/>
  <text x="30" y="277" fill="#0B1F33" font-size="13" font-weight="700">Trachea: Midline</text>
  <text x="30" y="298" fill="#415A77" font-size="12">Trachea is centered in the neck. No pull or push toward either side.</text>

  <!-- Row 4: Breath sounds -->
  <rect x="10" y="322" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="10" y="322" width="6" height="62" rx="3" fill="#1CA7A8"/>
  <text x="30" y="347" fill="#0B1F33" font-size="13" font-weight="700">Vesicular Breath Sounds (bilateral)</text>
  <text x="30" y="368" fill="#415A77" font-size="12">Soft, low-pitched airflow sounds heard symmetrically over both lungs.</text>

  <!-- DIVIDER -->
  <rect x="476" y="68" width="8" height="336" rx="4" fill="#D7E6EF"/>

  <!-- ===== ABNORMAL FINDINGS (right column) ===== -->

  <!-- Row 1: Asymmetric expansion -->
  <rect x="488" y="112" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <rect x="488" y="112" width="6" height="62" rx="3" fill="#E85D5D"/>
  <text x="508" y="137" fill="#0B1F33" font-size="13" font-weight="700">Asymmetric Chest Expansion</text>
  <text x="508" y="158" fill="#415A77" font-size="12">One side moves less — may suggest obstruction, pneumothorax, or pain.</text>

  <!-- Row 2: Abnormal percussion -->
  <rect x="488" y="182" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <rect x="488" y="182" width="6" height="62" rx="3" fill="#E85D5D"/>
  <text x="508" y="207" fill="#0B1F33" font-size="13" font-weight="700">Dull or Hyperresonant Percussion</text>
  <text x="508" y="228" fill="#415A77" font-size="12">Dull = fluid/dense tissue. Hyperresonant = trapped or excess air.</text>

  <!-- Row 3: Tracheal deviation -->
  <rect x="488" y="252" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <rect x="488" y="252" width="6" height="62" rx="3" fill="#E85D5D"/>
  <text x="508" y="277" fill="#0B1F33" font-size="13" font-weight="700">Tracheal Deviation  ⚠ Red Flag</text>
  <text x="508" y="298" fill="#415A77" font-size="12">Trachea shifted off center — may indicate pressure or volume loss. Report promptly.</text>

  <!-- Row 4: Adventitious sounds -->
  <rect x="488" y="322" width="462" height="62" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <rect x="488" y="322" width="6" height="62" rx="3" fill="#E85D5D"/>
  <text x="508" y="347" fill="#0B1F33" font-size="13" font-weight="700">Adventitious Breath Sounds</text>
  <text x="508" y="368" fill="#415A77" font-size="12">Wheezes, crackles, rhonchi, stridor, or absent sounds in any region.</text>

  <!-- FOOTER -->
  <rect x="0" y="404" width="960" height="56" fill="#0B1F33"/>
  <text x="480" y="424" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="700">Key Principle: No single finding tells the whole story — look for clusters.</text>
  <text x="480" y="446" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="11">PulmoCore · PA 1.2 · Physical Assessment &amp; Disease Differentiation</text>

</svg>
