<svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="570" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">THE OXYGEN CASCADE</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.2  ·  OXYGEN LOSES PARTIAL PRESSURE AT EVERY STEP FROM ATMOSPHERE TO TISSUE CELL</text>

  <!-- Connector spine -->
  <rect x="118" y="70" width="4" height="448" rx="2" fill="#D7E6EF"/>

  <!-- STEP 1: Atmosphere 159 mmHg -->
  <circle cx="120" cy="106" r="36" fill="#4BA3F2"/>
  <text x="120" y="101" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">159</text>
  <text x="120" y="117" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-weight="700">mmHg</text>
  <rect x="170" y="72" width="770" height="68" rx="10" fill="#E6F3FF" stroke="#4BA3F2" stroke-width="1.5"/>
  <text x="186" y="95" fill="#0B1F33" font-size="13" font-weight="700">Atmospheric Air — Sea Level</text>
  <text x="186" y="113" fill="#415A77" font-size="11">21% O₂ at 760 mmHg barometric pressure. PO₂ = 760 × 0.21 = 159 mmHg.</text>
  <text x="186" y="129" fill="#415A77" font-size="11">Starting point — barometric pressure determines everything downstream. Higher altitude = lower start.</text>

  <!-- STEP 2: Airways 150 mmHg -->
  <circle cx="120" cy="178" r="36" fill="#3A8FE8"/>
  <text x="120" y="173" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">150</text>
  <text x="120" y="189" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-weight="700">mmHg</text>
  <rect x="170" y="144" width="770" height="68" rx="10" fill="#EAF0FF" stroke="#3A8FE8" stroke-width="1.5"/>
  <text x="186" y="167" fill="#0B1F33" font-size="13" font-weight="700">Inspired Air — Upper Airways</text>
  <text x="186" y="185" fill="#415A77" font-size="11">Air is humidified — water vapor (47 mmHg) displaces oxygen in the airways.</text>
  <text x="186" y="201" fill="#415A77" font-size="11">PO₂ = (760 − 47) × 0.21 = 150 mmHg. Drop = 9 mmHg from humidification alone.</text>

  <!-- STEP 3: Alveoli 100 mmHg -->
  <circle cx="120" cy="250" r="36" fill="#1CA7A8"/>
  <text x="120" y="245" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">100</text>
  <text x="120" y="261" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-weight="700">mmHg</text>
  <rect x="170" y="216" width="770" height="68" rx="10" fill="#DDF7F2" stroke="#1CA7A8" stroke-width="1.5"/>
  <text x="186" y="239" fill="#0B1F33" font-size="13" font-weight="700">Alveolar Air — PAO₂</text>
  <text x="186" y="257" fill="#415A77" font-size="11">CO₂ diffusing from blood (~40 mmHg) competes for alveolar space. PAO₂ = (713 × FiO₂) − (PaCO₂ ÷ 0.8).</text>
  <text x="186" y="273" fill="#415A77" font-size="11">On room air: PAO₂ ≈ 100 mmHg. High altitude or hypoventilation lowers PAO₂ before blood is even reached.</text>

  <!-- STEP 4: Arterial 90-100 mmHg -->
  <circle cx="120" cy="322" r="36" fill="#F4B860"/>
  <text x="120" y="314" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="800">90–100</text>
  <text x="120" y="328" text-anchor="middle" fill="rgba(0,0,0,0.6)" font-size="8" font-weight="700">mmHg</text>
  <text x="120" y="340" text-anchor="middle" fill="rgba(0,0,0,0.5)" font-size="8">ABG</text>
  <rect x="170" y="288" width="770" height="68" rx="10" fill="#FFF4DF" stroke="#F4B860" stroke-width="1.5"/>
  <text x="186" y="311" fill="#0B1F33" font-size="13" font-weight="700">Arterial Blood — PaO₂ (Measured by ABG)</text>
  <text x="186" y="329" fill="#415A77" font-size="11">Blood leaves the lungs oxygenated. The 5–10 mmHg drop from PAO₂ is the normal A-a gradient.</text>
  <text x="186" y="345" fill="#415A77" font-size="11">PaO₂ &lt; 80 mmHg on room air = hypoxemia. This is the value clinicians measure and act on.</text>

  <!-- STEP 5: Venous 40 mmHg -->
  <circle cx="120" cy="394" r="36" fill="#E07030"/>
  <text x="120" y="389" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">40</text>
  <text x="120" y="405" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-weight="700">mmHg</text>
  <rect x="170" y="360" width="770" height="68" rx="10" fill="#FEF0E6" stroke="#E07030" stroke-width="1.5"/>
  <text x="186" y="383" fill="#0B1F33" font-size="13" font-weight="700">Venous Blood — PvO₂ (Mixed Venous)</text>
  <text x="186" y="401" fill="#415A77" font-size="11">Blood returns from tissues after oxygen has been extracted for cellular metabolism.</text>
  <text x="186" y="417" fill="#415A77" font-size="11">PvO₂ = 40 mmHg is normal — tissues consumed ~25% of delivered oxygen.</text>

  <!-- STEP 6: Tissue 20-40 mmHg -->
  <circle cx="120" cy="466" r="36" fill="#E85D5D"/>
  <text x="120" y="458" text-anchor="middle" fill="#FFF" font-size="11" font-weight="800">20–40</text>
  <text x="120" y="472" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8" font-weight="700">mmHg</text>
  <text x="120" y="483" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="8">tissue</text>
  <rect x="170" y="432" width="770" height="68" rx="10" fill="#FDE9E9" stroke="#E85D5D" stroke-width="1.5"/>
  <text x="186" y="455" fill="#0B1F33" font-size="13" font-weight="700">Tissue Cells — Final Destination</text>
  <text x="186" y="473" fill="#415A77" font-size="11">Where oxygen is consumed in cellular metabolism (mitochondria). Normal PaO₂ does NOT</text>
  <text x="186" y="489" fill="#415A77" font-size="11">guarantee adequate tissue oxygenation if hemoglobin, cardiac output, or cell function is impaired.</text>

  <rect x="0" y="534" width="960" height="36" fill="#0B1F33"/>
  <text x="480" y="557" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.2 · Oxygen Cascade · Atmosphere 159 → Airways 150 → Alveoli 100 → Arterial 90–100 → Venous 40 → Tissue 20–40 mmHg</text>
</svg>
