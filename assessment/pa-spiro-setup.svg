<svg viewBox="0 0 960 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="490" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">SPIROMETRY PRE-TEST SETUP CHECKLIST</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.4  ·  COMPLETE ALL STEPS BEFORE THE PATIENT BEGINS TESTING</text>

  <!-- INTRO LABEL -->
  <rect x="10" y="70" width="940" height="28" rx="7" fill="#102A43"/>
  <text x="480" y="89" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11" font-weight="600">Every step before the test is part of the test. Skipping setup steps can invalidate results.</text>

  <!-- ================================================================ -->
  <!-- 6 CHECKLIST CARDS: 2 columns × 3 rows -->
  <!-- Left col: x=14, width=454 | Right col: x=492, width=454 -->
  <!-- Row y: 108, 198, 288 | Card height: 80px, gap: 10px -->
  <!-- ================================================================ -->

  <!-- CARD 1: Confirm Patient Identity (left, row 1) -->
  <rect x="14" y="108" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <circle cx="54" cy="148" r="22" fill="#1CA7A8"/>
  <text x="54" y="154" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">1</text>
  <text x="88" y="134" fill="#0B1F33" font-size="14" font-weight="700">Confirm Patient Identity</text>
  <text x="88" y="153" fill="#415A77" font-size="12">Use two identifiers per facility policy before any testing</text>
  <text x="88" y="170" fill="#415A77" font-size="12">begins. Never assume identity from room number alone.</text>
  <rect x="386" y="114" width="70" height="16" rx="5" fill="#DDF7F2"/>
  <text x="421" y="126" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">SAFETY ✓</text>

  <!-- CARD 2: Enter Patient Data (right, row 1) -->
  <rect x="492" y="108" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <circle cx="532" cy="148" r="22" fill="#4BA3F2"/>
  <text x="532" y="154" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">2</text>
  <text x="566" y="134" fill="#0B1F33" font-size="14" font-weight="700">Enter Required Patient Data</text>
  <text x="566" y="153" fill="#415A77" font-size="12">Age, height, and sex per device and facility policy.</text>
  <text x="566" y="170" fill="#415A77" font-size="12">Used to calculate predicted reference values.</text>
  <rect x="864" y="114" width="68" height="16" rx="5" fill="#E6F3FF"/>
  <text x="898" y="126" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">REQUIRED</text>

  <!-- CARD 3: Explain and Demonstrate (left, row 2) -->
  <rect x="14" y="198" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <circle cx="54" cy="238" r="22" fill="#F4B860"/>
  <text x="54" y="244" text-anchor="middle" fill="#0B1F33" font-size="16" font-weight="700">3</text>
  <text x="88" y="224" fill="#0B1F33" font-size="14" font-weight="700">Explain and Demonstrate</text>
  <text x="88" y="243" fill="#415A77" font-size="12">Show the patient what the maneuver looks like before</text>
  <text x="88" y="260" fill="#415A77" font-size="12">they attempt it. Demonstration improves effort quality.</text>
  <rect x="372" y="204" width="84" height="16" rx="5" fill="#FFF4DF"/>
  <text x="414" y="216" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">KEY STEP ★</text>

  <!-- CARD 4: Prepare Equipment (right, row 2) -->
  <rect x="492" y="198" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <circle cx="532" cy="238" r="22" fill="#128486"/>
  <text x="532" y="244" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">4</text>
  <text x="566" y="224" fill="#0B1F33" font-size="14" font-weight="700">Prepare Equipment</text>
  <text x="566" y="243" fill="#415A77" font-size="12">Attach a new mouthpiece. Calibrate per policy if required.</text>
  <text x="566" y="260" fill="#415A77" font-size="12">Check device is ready and functioning correctly.</text>
  <rect x="854" y="204" width="78" height="16" rx="5" fill="#DDF7F2"/>
  <text x="893" y="216" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">EQUIPMENT</text>

  <!-- CARD 5: Screen Contraindications (left, row 3) -->
  <rect x="14" y="288" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#FADADD" stroke-width="1.5"/>
  <circle cx="54" cy="328" r="22" fill="#E85D5D"/>
  <text x="54" y="334" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">5</text>
  <text x="88" y="314" fill="#0B1F33" font-size="14" font-weight="700">Screen for Contraindications</text>
  <text x="88" y="333" fill="#415A77" font-size="12">Follow facility policy for safety contraindications such as</text>
  <text x="88" y="350" fill="#415A77" font-size="12">recent surgery, hemoptysis, active infection, or instability.</text>
  <rect x="358" y="294" width="98" height="16" rx="5" fill="#FDE9E9"/>
  <text x="407" y="306" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">SAFETY CHECK ⚠</text>

  <!-- CARD 6: Position and Nose Clip (right, row 3) -->
  <rect x="492" y="288" width="454" height="80" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <circle cx="532" cy="328" r="22" fill="#415A77"/>
  <text x="532" y="334" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">6</text>
  <text x="566" y="314" fill="#0B1F33" font-size="14" font-weight="700">Position Patient + Nose Clip</text>
  <text x="566" y="333" fill="#415A77" font-size="12">Seat patient upright. Apply nose clip per protocol.</text>
  <text x="566" y="350" fill="#415A77" font-size="12">Confirm comfortable position before testing begins.</text>
  <rect x="854" y="294" width="78" height="16" rx="5" fill="#EEF1F5"/>
  <text x="893" y="306" text-anchor="middle" fill="#243b55" font-size="9" font-weight="700">POSITION</text>

  <!-- WHAT NOT TO DO warning -->
  <rect x="14" y="382" width="932" height="52" rx="8" fill="#FDE9E9" stroke="#F2B5B5" stroke-width="1.5"/>
  <text x="480" y="403" text-anchor="middle" fill="#C0392B" font-size="12" font-weight="700">Do NOT do this before testing:</text>
  <text x="480" y="422" text-anchor="middle" fill="#415A77" font-size="12">Ask the patient to eat a large meal immediately beforehand · Begin before explaining the maneuver · Skip identity verification</text>

  <!-- FOOTER -->
  <rect x="0" y="452" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="476" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.4 · Spirometry Pre-Test Setup · Complete all steps before the patient begins</text>

</svg>
