<svg viewBox="0 0 960 590" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="562" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">WHEN OXYGEN THERAPY HELPS — AND WHEN IT DOESN'T</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.2  ·  TYPE OF HYPOXIA DETERMINES TREATMENT  ·  MORE O₂ ONLY DIRECTLY ADDRESSES TYPE 1</text>

  <!-- TOP-LEFT: Type 1 Hypoxemic — O2 HELPS -->
  <rect x="8" y="70" width="466" height="190" rx="10" fill="#FFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <rect x="8" y="70" width="466" height="38" rx="10" fill="#1CA7A8"/>
  <rect x="8" y="96" width="466" height="12" fill="#1CA7A8"/>
  <text x="241" y="95" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Type 1 — Hypoxemic Hypoxia</text>
  <!-- Big YES badge -->
  <rect x="18" y="114" width="80" height="70" rx="8" fill="#DDF7F2" stroke="#1CA7A8" stroke-width="2"/>
  <text x="58" y="144" text-anchor="middle" fill="#1CA7A8" font-size="20" font-weight="800">O₂</text>
  <text x="58" y="165" text-anchor="middle" fill="#1CA7A8" font-size="16" font-weight="800">✓ YES</text>
  <!-- Content -->
  <text x="112" y="130" fill="#0B1F33" font-size="12" font-weight="700">Oxygen directly addresses the problem.</text>
  <text x="112" y="147" fill="#415A77" font-size="11">PaO₂ is low — supplemental O₂ raises PAO₂ →</text>
  <text x="112" y="162" fill="#415A77" font-size="11">raises PaO₂ → raises SaO₂ → raises CaO₂.</text>
  <text x="112" y="177" fill="#415A77" font-size="11">Exception: true shunts respond poorly — PEEP needed.</text>
  <rect x="18" y="194" width="436" height="58" rx="7" fill="#DDF7F2"/>
  <text x="236" y="212" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Treatment: Supplemental O₂ + treat underlying lung disease</text>
  <text x="236" y="228" text-anchor="middle" fill="#0B7F80" font-size="11">Nasal cannula → simple mask → NRB → CPAP/BiPAP → intubation</text>
  <text x="236" y="243" text-anchor="middle" fill="#0B7F80" font-size="10">Titrate to SpO₂ 92–96% (or 88–92% in COPD — see below)</text>

  <!-- TOP-RIGHT: Type 2 Ischemic — fix pump -->
  <rect x="486" y="70" width="466" height="190" rx="10" fill="#FFF" stroke="#E85D5D" stroke-width="2.5"/>
  <rect x="486" y="70" width="466" height="38" rx="10" fill="#E85D5D"/>
  <rect x="486" y="96" width="466" height="12" fill="#E85D5D"/>
  <text x="719" y="95" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Type 2 — Ischemic (Stagnant) Hypoxia</text>
  <rect x="496" y="114" width="80" height="70" rx="8" fill="#FDE9E9" stroke="#E85D5D" stroke-width="2"/>
  <text x="536" y="144" text-anchor="middle" fill="#E85D5D" font-size="20" font-weight="800">O₂</text>
  <text x="536" y="165" text-anchor="middle" fill="#E85D5D" font-size="14" font-weight="800">✗ NO</text>
  <text x="590" y="130" fill="#0B1F33" font-size="12" font-weight="700">Blood is already oxygenated. Fix the pump.</text>
  <text x="590" y="147" fill="#415A77" font-size="11">PaO₂ and CaO₂ are normal — but cardiac output</text>
  <text x="590" y="162" fill="#415A77" font-size="11">is too low to deliver it. Adding O₂ is futile.</text>
  <text x="590" y="177" fill="#415A77" font-size="11">Extra dissolved O₂ (0.003×PaO₂) is negligible.</text>
  <rect x="496" y="194" width="436" height="58" rx="7" fill="#FDE9E9"/>
  <text x="714" y="212" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Treatment: Restore cardiac output and perfusion</text>
  <text x="714" y="228" text-anchor="middle" fill="#C0392B" font-size="11">Inotropes, vasopressors, fluids, revascularization (PCI for MI)</text>
  <text x="714" y="243" text-anchor="middle" fill="#C0392B" font-size="10">Goal: adequate DO₂ — not higher SpO₂</text>

  <!-- BOTTOM-LEFT: Type 3 Anemic — transfuse -->
  <rect x="8" y="272" width="466" height="190" rx="10" fill="#FFF" stroke="#F4B860" stroke-width="2.5"/>
  <rect x="8" y="272" width="466" height="38" rx="10" fill="#F4B860"/>
  <rect x="8" y="298" width="466" height="12" fill="#F4B860"/>
  <text x="241" y="297" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">Type 3 — Anemic Hypoxia</text>
  <rect x="18" y="316" width="80" height="70" rx="8" fill="#FFF4DF" stroke="#F4B860" stroke-width="2"/>
  <text x="58" y="346" text-anchor="middle" fill="#F4B860" font-size="20" font-weight="800">O₂</text>
  <text x="58" y="367" text-anchor="middle" fill="#F4B860" font-size="14" font-weight="800">✗ NO</text>
  <text x="112" y="332" fill="#0B1F33" font-size="12" font-weight="700">Hemoglobin is the problem. Fix the carriers.</text>
  <text x="112" y="349" fill="#415A77" font-size="11">SpO₂ is 97–98% — saturation looks normal.</text>
  <text x="112" y="364" fill="#415A77" font-size="11">But Hb is critically low → CaO₂ is critically low.</text>
  <text x="112" y="379" fill="#415A77" font-size="11">More O₂ does not create more hemoglobin.</text>
  <rect x="18" y="396" width="436" height="58" rx="7" fill="#FFF4DF"/>
  <text x="236" y="414" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">Treatment: Restore oxygen-carrying capacity</text>
  <text x="236" y="430" text-anchor="middle" fill="#7A4B00" font-size="11">Transfusion (acute), iron/B12/folate (deficiency), treat bleeding source</text>
  <text x="236" y="445" text-anchor="middle" fill="#7A4B00" font-size="10">CO poisoning: 100% O₂ IS indicated — displaces CO from hemoglobin</text>

  <!-- BOTTOM-RIGHT: Type 4 Histotoxic — antidote -->
  <rect x="486" y="272" width="466" height="190" rx="10" fill="#FFF" stroke="#8B5CF6" stroke-width="2.5"/>
  <rect x="486" y="272" width="466" height="38" rx="10" fill="#8B5CF6"/>
  <rect x="486" y="298" width="466" height="12" fill="#8B5CF6"/>
  <text x="719" y="297" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Type 4 — Histotoxic Hypoxia</text>
  <rect x="496" y="316" width="80" height="70" rx="8" fill="#F3F0FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="536" y="346" text-anchor="middle" fill="#8B5CF6" font-size="20" font-weight="800">O₂</text>
  <text x="536" y="367" text-anchor="middle" fill="#8B5CF6" font-size="14" font-weight="800">✗ NO</text>
  <text x="590" y="332" fill="#0B1F33" font-size="12" font-weight="700">Cells cannot use O₂. Give the antidote.</text>
  <text x="590" y="349" fill="#415A77" font-size="11">PaO₂, CaO₂, and DO₂ are all normal. But</text>
  <text x="590" y="364" fill="#415A77" font-size="11">mitochondria are blocked — O₂ sits unused.</text>
  <text x="590" y="379" fill="#415A77" font-size="11">No amount of O₂ unblocks cytochrome oxidase.</text>
  <rect x="496" y="396" width="436" height="58" rx="7" fill="#F3F0FF"/>
  <text x="714" y="414" text-anchor="middle" fill="#6D35CC" font-size="11" font-weight="700">Treatment: Specific antidote + remove toxin source</text>
  <text x="714" y="430" text-anchor="middle" fill="#6D35CC" font-size="11">Hydroxocobalamin (cyanide), H₂S: fresh air + supportive, severe sepsis: source control</text>
  <text x="714" y="445" text-anchor="middle" fill="#6D35CC" font-size="10">100% O₂ is given while preparing antidote, but does not fix the cellular block</text>

  <!-- COPD Special Panel (full width) -->
  <rect x="8" y="474" width="944" height="60" rx="10" fill="#FFF4DF" stroke="#F4B860" stroke-width="2"/>
  <text x="480" y="495" text-anchor="middle" fill="#7A4B00" font-size="13" font-weight="700">⚠ Special Case — COPD with Chronic CO₂ Retention</text>
  <text x="480" y="513" text-anchor="middle" fill="#7A4B00" font-size="11">Target SpO₂ 88–92% (NOT 95–98%). Start at 1–2 L/min and titrate slowly. Over-oxygenation risks suppressing</text>
  <text x="480" y="527" text-anchor="middle" fill="#7A4B00" font-size="11">hypoxic respiratory drive → CO₂ narcosis. Monitor PaCO₂ after any O₂ increase.</text>

  <rect x="0" y="550" width="960" height="34" fill="#0B1F33"/>
  <text x="480" y="572" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.2 · O₂ Therapy Decision · Type 1: O₂ YES · Type 2: Fix pump · Type 3: Fix carriers · Type 4: Antidote · COPD: target SpO₂ 88–92%</text>
</svg>
