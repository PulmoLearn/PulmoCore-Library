<svg viewBox="0 0 960 616" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="594" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">HYPOXIA — FOUR TYPES, FOUR DIFFERENT TREATMENTS</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.2  ·  HYPOXIA = INADEQUATE O₂ TO TISSUES  ·  TYPE DETERMINES TREATMENT — MORE O₂ ONLY HELPS TYPE 1</text>

  <!-- ===== TYPE 1: Hypoxemic (top-left) ===== -->
  <rect x="8" y="70" width="464" height="248" rx="10" fill="#FFF" stroke="#4BA3F2" stroke-width="2.5"/>
  <rect x="8" y="70" width="464" height="42" rx="10" fill="#4BA3F2"/>
  <rect x="8" y="98" width="464" height="14" fill="#4BA3F2"/>
  <text x="240" y="97" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Type 1 — Hypoxemic Hypoxia</text>
  <!-- ABG tiles -->
  <rect x="18" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="58" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="58" y="155" text-anchor="middle" fill="#E85D5D" font-size="16" font-weight="800">LOW</text>
  <rect x="106" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="146" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">CaO₂</text>
  <text x="146" y="155" text-anchor="middle" fill="#E85D5D" font-size="16" font-weight="800">LOW</text>
  <rect x="194" y="118" width="100" height="46" rx="7" fill="#0B1F33"/>
  <text x="244" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Cardiac Output</text>
  <text x="244" y="155" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="302" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="342" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Hb</text>
  <text x="342" y="155" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <text x="18" y="183" fill="#0B1F33" font-size="11" font-weight="700">Problem:</text>
  <text x="18" y="198" fill="#415A77" font-size="11">Lungs fail to oxygenate blood → PaO₂ falls.</text>
  <text x="18" y="213" fill="#415A77" font-size="11">Pneumonia, ARDS, COPD exacerbation, pulmonary edema, V/Q mismatch.</text>
  <rect x="18" y="224" width="434" height="40" rx="7" fill="#E6F3FF"/>
  <text x="235" y="240" text-anchor="middle" fill="#1A5EA8" font-size="11" font-weight="700">O₂ HELPS ✓ — Supplemental oxygen directly addresses the deficit.</text>
  <text x="235" y="256" text-anchor="middle" fill="#1A5EA8" font-size="10">Treat the lung disease + increase inspired O₂. PEEP for shunting.</text>

  <!-- ===== TYPE 2: Ischemic (top-right) ===== -->
  <rect x="488" y="70" width="464" height="248" rx="10" fill="#FFF" stroke="#E85D5D" stroke-width="2.5"/>
  <rect x="488" y="70" width="464" height="42" rx="10" fill="#E85D5D"/>
  <rect x="488" y="98" width="464" height="14" fill="#E85D5D"/>
  <text x="720" y="97" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Type 2 — Ischemic (Stagnant) Hypoxia</text>
  <rect x="498" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="538" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="538" y="155" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="586" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="626" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">CaO₂</text>
  <text x="626" y="155" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="674" y="118" width="116" height="46" rx="7" fill="#0B1F33"/>
  <text x="732" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Cardiac Output</text>
  <text x="732" y="155" text-anchor="middle" fill="#E85D5D" font-size="16" font-weight="800">LOW</text>
  <rect x="798" y="118" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="838" y="135" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Hb</text>
  <text x="838" y="155" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <text x="498" y="183" fill="#0B1F33" font-size="11" font-weight="700">Problem:</text>
  <text x="498" y="198" fill="#415A77" font-size="11">Blood is oxygenated but not reaching tissues. Pump failure.</text>
  <text x="498" y="213" fill="#415A77" font-size="11">Heart failure, cardiogenic shock, PE, hemorrhage, septic shock.</text>
  <rect x="498" y="224" width="434" height="40" rx="7" fill="#FDE9E9"/>
  <text x="715" y="240" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">O₂ DOES NOT HELP ✗ — Blood is already oxygenated.</text>
  <text x="715" y="256" text-anchor="middle" fill="#C0392B" font-size="10">Fix the pump: inotropes, fluids, vasopressors, revascularization.</text>

  <!-- ===== TYPE 3: Anemic (bottom-left) ===== -->
  <rect x="8" y="330" width="464" height="228" rx="10" fill="#FFF" stroke="#F4B860" stroke-width="2.5"/>
  <rect x="8" y="330" width="464" height="42" rx="10" fill="#F4B860"/>
  <rect x="8" y="358" width="464" height="14" fill="#F4B860"/>
  <text x="240" y="357" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Type 3 — Anemic Hypoxia</text>
  <rect x="18" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="58" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="58" y="415" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="106" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="146" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">SaO₂</text>
  <text x="146" y="415" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="194" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="234" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">CaO₂</text>
  <text x="234" y="415" text-anchor="middle" fill="#F4B860" font-size="16" font-weight="800">LOW</text>
  <rect x="282" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="322" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Hb</text>
  <text x="322" y="415" text-anchor="middle" fill="#E85D5D" font-size="16" font-weight="800">LOW</text>
  <text x="18" y="443" fill="#0B1F33" font-size="11" font-weight="700">Problem:</text>
  <text x="18" y="458" fill="#415A77" font-size="11">Not enough hemoglobin to carry oxygen. SpO₂ looks fine. PaO₂ looks fine.</text>
  <text x="18" y="473" fill="#415A77" font-size="11">Anemia, GI bleed, trauma, sickle cell, CO poisoning. CaO₂ is critically low.</text>
  <rect x="18" y="484" width="434" height="30" rx="7" fill="#FFF4DF"/>
  <text x="235" y="504" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">O₂ DOES NOT HELP ✗ — Fix the carriers: transfusion, treat bleeding, iron/B12.</text>

  <!-- ===== TYPE 4: Histotoxic (bottom-right) ===== -->
  <rect x="488" y="330" width="464" height="228" rx="10" fill="#FFF" stroke="#8B5CF6" stroke-width="2.5"/>
  <rect x="488" y="330" width="464" height="42" rx="10" fill="#8B5CF6"/>
  <rect x="488" y="358" width="464" height="14" fill="#8B5CF6"/>
  <text x="720" y="357" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Type 4 — Histotoxic Hypoxia</text>
  <rect x="498" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="538" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="538" y="415" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="586" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="626" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">CaO₂</text>
  <text x="626" y="415" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="674" y="378" width="80" height="46" rx="7" fill="#0B1F33"/>
  <text x="714" y="395" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">DO₂</text>
  <text x="714" y="415" text-anchor="middle" fill="#A3E6A0" font-size="14" font-weight="800">NORMAL</text>
  <rect x="762" y="378" width="120" height="46" rx="7" fill="#0B1F33"/>
  <text x="822" y="392" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">Cell Utilization</text>
  <text x="822" y="412" text-anchor="middle" fill="#E85D5D" font-size="13" font-weight="800">BLOCKED</text>
  <text x="498" y="443" fill="#0B1F33" font-size="11" font-weight="700">Problem:</text>
  <text x="498" y="458" fill="#415A77" font-size="11">Cells CANNOT use oxygen despite normal delivery. Mitochondria are poisoned.</text>
  <text x="498" y="473" fill="#415A77" font-size="11">Cyanide (blocks cytochrome oxidase), CO (muscle myoglobin), H₂S, severe sepsis.</text>
  <rect x="498" y="484" width="434" height="30" rx="7" fill="#F3F0FF"/>
  <text x="715" y="504" text-anchor="middle" fill="#6D35CC" font-size="11" font-weight="700">O₂ DOES NOT HELP ✗ — Give the antidote: hydroxocobalamin (cyanide), remove toxin.</text>

  <rect x="0" y="574" width="960" height="36" fill="#0B1F33"/>
  <text x="480" y="597" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.2 · 4 Types of Hypoxia · Type 1: O₂ helps · Type 2: Fix pump · Type 3: Fix carriers · Type 4: Give antidote</text>
</svg>
