<svg viewBox="0 0 960 564" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="510" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">CAPNOGRAPHY — END-TIDAL CO₂ WAVEFORMS</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.1  ·  ETCO₂ NORMAL 35–45 mmHg  ·  WAVEFORM SHAPE CARRIES DIAGNOSTIC INFORMATION</text>

  <!-- ===== TOP: NORMAL CAPNOGRAM ===== -->
  <rect x="8" y="70" width="944" height="196" rx="10" fill="#FFF" stroke="#1CA7A8" stroke-width="2"/>
  <rect x="8" y="70" width="944" height="36" rx="10" fill="#1CA7A8"/>
  <rect x="8" y="92" width="944" height="14" fill="#1CA7A8"/>
  <text x="480" y="94" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">NORMAL CAPNOGRAM — The Four Phases</text>

  <!-- Plot area: x=80 to x=760, y=120 (max CO2) to y=240 (baseline=0) -->
  <!-- Y-axis -->
  <line x1="80" y1="116" x2="80" y2="244" stroke="#415A77" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="80" y1="244" x2="760" y2="244" stroke="#415A77" stroke-width="1.5"/>
  <!-- Y labels -->
  <text x="72" y="125" text-anchor="end" fill="#415A77" font-size="9">50</text>
  <text x="72" y="168" text-anchor="end" fill="#415A77" font-size="9">25</text>
  <text x="72" y="248" text-anchor="end" fill="#415A77" font-size="9">0</text>
  <text x="66" y="188" text-anchor="end" fill="#1CA7A8" font-size="9" font-weight="700">ETCO₂</text>
  <text x="66" y="198" text-anchor="end" fill="#1CA7A8" font-size="9" font-weight="700">(mmHg)</text>
  <!-- X label -->
  <text x="420" y="260" text-anchor="middle" fill="#415A77" font-size="10">Time (seconds) →</text>

  <!-- NORMAL WAVEFORM PATH -->
  <!-- Two complete breaths -->
  <!-- Breath 1: baseline → upstroke → plateau → downstroke -->
  <!-- Phase I: x=80-140, y=244 (baseline 0 CO2) -->
  <!-- Phase II: x=140-175, rises to y=145 (ETCO2 ~40mmHg) -->
  <!-- Phase III: x=175-320, plateau with slight upslope y=145 to y=140 -->
  <!-- Phase IV: x=320-355, drops to y=244 -->
  <!-- Next breath: x=355-420, y=244 (inspiration) -->
  <!-- Breath 2 repeat -->
  <path d="M 80,244 L 140,244 L 145,236 Q 160,155 175,145 L 320,140 L 325,142 L 355,244 L 420,244 L 425,236 Q 440,155 455,145 L 600,140 L 605,142 L 635,244 L 760,244"
        stroke="#1CA7A8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Phase labels with arrows -->
  <!-- Phase I -->
  <rect x="88" y="116" width="48" height="18" rx="4" fill="#0B1F33"/>
  <text x="112" y="129" text-anchor="middle" fill="#FFF" font-size="9" font-weight="700">Phase I</text>
  <line x1="112" y1="134" x2="112" y2="242" stroke="#0B1F33" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="112" y="252" text-anchor="middle" fill="#415A77" font-size="9">Baseline</text>
  <text x="112" y="263" text-anchor="middle" fill="#415A77" font-size="9">CO₂=0</text>

  <!-- Phase II label -->
  <rect x="148" y="116" width="48" height="18" rx="4" fill="#4BA3F2"/>
  <text x="172" y="129" text-anchor="middle" fill="#FFF" font-size="9" font-weight="700">Phase II</text>
  <line x1="162" y1="134" x2="162" y2="220" stroke="#4BA3F2" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="162" y="252" text-anchor="middle" fill="#415A77" font-size="9">Rapid</text>
  <text x="162" y="263" text-anchor="middle" fill="#415A77" font-size="9">upstroke</text>

  <!-- Phase III label -->
  <rect x="218" y="116" width="64" height="18" rx="4" fill="#F4B860"/>
  <text x="250" y="129" text-anchor="middle" fill="#0B1F33" font-size="9" font-weight="700">Phase III</text>
  <line x1="250" y1="134" x2="250" y2="140" stroke="#F4B860" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="250" y="252" text-anchor="middle" fill="#415A77" font-size="9">Alveolar</text>
  <text x="250" y="263" text-anchor="middle" fill="#415A77" font-size="9">plateau</text>

  <!-- ETCO2 peak marker -->
  <line x1="320" y1="140" x2="320" y2="116" stroke="#E85D5D" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="280" y="108" width="80" height="18" rx="4" fill="#E85D5D"/>
  <text x="320" y="121" text-anchor="middle" fill="#FFF" font-size="9" font-weight="700">ETCO₂ peak ~40</text>

  <!-- Phase IV label -->
  <rect x="332" y="116" width="52" height="18" rx="4" fill="#415A77"/>
  <text x="358" y="129" text-anchor="middle" fill="#FFF" font-size="9" font-weight="700">Phase IV</text>
  <line x1="340" y1="134" x2="340" y2="200" stroke="#415A77" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="340" y="252" text-anchor="middle" fill="#415A77" font-size="9">Sharp</text>
  <text x="340" y="263" text-anchor="middle" fill="#415A77" font-size="9">downstroke</text>

  <!-- Alpha angle label -->
  <text x="170" y="148" fill="#F4B860" font-size="9" font-weight="700">α angle</text>

  <!-- Right-side interpretation -->
  <rect x="770" y="116" width="174" height="145" rx="8" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1"/>
  <text x="857" y="134" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">Clinical Uses:</text>
  <circle cx="780" cy="150" r="3" fill="#1CA7A8"/>
  <text x="790" y="155" fill="#415A77" font-size="10">Confirm ET tube position</text>
  <circle cx="780" cy="168" r="3" fill="#1CA7A8"/>
  <text x="790" y="173" fill="#415A77" font-size="10">Monitor ventilation (ICU)</text>
  <circle cx="780" cy="186" r="3" fill="#1CA7A8"/>
  <text x="790" y="191" fill="#415A77" font-size="10">CPR quality / ROSC</text>
  <circle cx="780" cy="204" r="3" fill="#1CA7A8"/>
  <text x="790" y="209" fill="#415A77" font-size="10">Bronchospasm detection</text>
  <circle cx="780" cy="222" r="3" fill="#1CA7A8"/>
  <text x="790" y="227" fill="#415A77" font-size="10">Procedural sedation</text>
  <circle cx="780" cy="240" r="3" fill="#1CA7A8"/>
  <text x="790" y="245" fill="#415A77" font-size="10">PE (dead space ↑)</text>

  <!-- ===== BOTTOM: THREE ABNORMAL WAVEFORMS ===== -->

  <!-- PANEL 1: Shark fin / bronchospasm -->
  <rect x="8" y="276" width="304" height="220" rx="10" fill="#FFF" stroke="#F4B860" stroke-width="2"/>
  <rect x="8" y="276" width="304" height="36" rx="10" fill="#F4B860"/>
  <rect x="8" y="298" width="304" height="14" fill="#F4B860"/>
  <text x="160" y="299" text-anchor="middle" fill="#0B1F33" font-size="12" font-weight="700">"SHARK FIN" — Bronchospasm</text>
  <!-- Plot -->
  <line x1="30" y1="432" x2="296" y2="432" stroke="#415A77" stroke-width="1"/>
  <line x1="30" y1="432" x2="30" y2="320" stroke="#415A77" stroke-width="1"/>
  <!-- Shark fin curve: slow rounded rise, no plateau, gradual descent -->
  <path d="M 30,432 L 50,432 Q 80,420 110,395 Q 140,360 160,340 Q 185,325 210,322 Q 240,325 265,370 Q 280,400 296,432"
        stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Reference normal (dashed) -->
  <path d="M 30,432 L 55,432 Q 70,370 80,330 L 200,326 L 218,432"
        stroke="#D7E6EF" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
  <text x="100" y="318" fill="#7A4B00" font-size="9" font-style="italic">normal (dashed)</text>
  <rect x="18" y="440" width="284" height="50" rx="6" fill="#FFF4DF"/>
  <text x="160" y="459" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">No clear alveolar plateau</text>
  <text x="160" y="476" text-anchor="middle" fill="#7A4B00" font-size="11">Rounded = uneven emptying → bronchospasm</text>

  <!-- PANEL 2: CPR / ROSC -->
  <rect x="328" y="276" width="304" height="220" rx="10" fill="#FFF" stroke="#E85D5D" stroke-width="2"/>
  <rect x="328" y="276" width="304" height="36" rx="10" fill="#E85D5D"/>
  <rect x="328" y="298" width="304" height="14" fill="#E85D5D"/>
  <text x="480" y="299" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">CPR / ROSC Pattern</text>
  <!-- Plot -->
  <line x1="350" y1="432" x2="616" y2="432" stroke="#415A77" stroke-width="1"/>
  <line x1="350" y1="432" x2="350" y2="320" stroke="#415A77" stroke-width="1"/>
  <!-- Low CPR cycles -->
  <path d="M 350,432 Q 360,418 365,415 Q 370,418 375,432 Q 385,418 390,415 Q 395,418 400,432 Q 410,418 415,415 Q 420,418 425,432"
        stroke="#E85D5D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- ROSC arrow and jump -->
  <line x1="430" y1="400" x2="450" y2="400" stroke="#E85D5D" stroke-width="2" marker-end="url(#rArr)"/>
  <defs><marker id="rArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7 Z" fill="#E85D5D"/></marker></defs>
  <text x="436" y="396" text-anchor="middle" fill="#E85D5D" font-size="9" font-weight="700">ROSC!</text>
  <!-- Post-ROSC normal amplitude -->
  <path d="M 455,432 L 465,432 Q 480,360 490,330 L 560,328 L 572,432 L 616,432"
        stroke="#1CA7A8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Low ETCO2 label -->
  <text x="390" y="455" text-anchor="middle" fill="#E85D5D" font-size="9">ETCO₂ &lt;10</text>
  <!-- Post-ROSC label -->
  <text x="530" y="320" text-anchor="middle" fill="#1CA7A8" font-size="9">ETCO₂ 38</text>
  <rect x="338" y="440" width="284" height="50" rx="6" fill="#FDE9E9"/>
  <text x="480" y="459" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">ETCO₂ &lt;10 during CPR = poor compressions</text>
  <text x="480" y="476" text-anchor="middle" fill="#C0392B" font-size="11">Sudden jump (&gt;35) = ROSC — most sensitive indicator</text>

  <!-- PANEL 3: Flat line (esophageal / apnea) -->
  <rect x="648" y="276" width="304" height="220" rx="10" fill="#FFF" stroke="#415A77" stroke-width="2"/>
  <rect x="648" y="276" width="304" height="36" rx="10" fill="#415A77"/>
  <rect x="648" y="298" width="304" height="14" fill="#415A77"/>
  <text x="800" y="299" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">FLAT LINE — Esophageal or Apnea</text>
  <!-- Plot -->
  <line x1="670" y1="432" x2="936" y2="432" stroke="#415A77" stroke-width="1"/>
  <line x1="670" y1="432" x2="670" y2="320" stroke="#415A77" stroke-width="1"/>
  <!-- Flat line at zero -->
  <line x1="670" y1="432" x2="936" y2="432" stroke="#E85D5D" stroke-width="3"/>
  <!-- Alarm icon -->
  <rect x="748" y="350" width="104" height="38" rx="8" fill="#FDE9E9" stroke="#E85D5D" stroke-width="2"/>
  <text x="800" y="366" text-anchor="middle" fill="#C0392B" font-size="12" font-weight="800">⚠ NO CO₂</text>
  <text x="800" y="382" text-anchor="middle" fill="#C0392B" font-size="10">ETCO₂ = 0</text>
  <rect x="658" y="440" width="284" height="50" rx="6" fill="#EEF1F5"/>
  <text x="800" y="459" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">No waveform = esophageal intubation</text>
  <text x="800" y="476" text-anchor="middle" fill="#243b55" font-size="11">Also: apnea, complete airway obstruction</text>

  <rect x="0" y="516" width="960" height="40" fill="#0B1F33"/>
  <text x="480" y="536" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.1 · Capnography · ETCO₂ 35–45 normal · Shark fin = bronchospasm · ROSC = ETCO₂ jump · Flat = esophageal</text>
</svg>
