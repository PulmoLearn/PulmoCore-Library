<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- ===== BACKGROUND ===== -->
  <rect width="960" height="520" fill="#F4FAFC"/>

  <!-- ===== HEADER BAR ===== -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">FIRST IMPRESSION ASSESSMENT</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.1  ·  PULMOCORE  ·  RESPIRATORY PATIENT ASSESSMENT</text>

  <!-- ===== LEFT PANEL (dark) ===== -->
  <rect x="0" y="62" width="400" height="416" fill="#0B1F33"/>

  <!-- Room background (lighter navy inside) -->
  <rect x="18" y="82" width="364" height="288" rx="8" fill="#102A43"/>

  <!-- Ceiling light strip -->
  <rect x="155" y="82" width="90" height="7" rx="3" fill="#1CA7A8" opacity="0.35"/>

  <!-- ---- DOOR FRAME ---- -->
  <rect x="28" y="97" width="106" height="245" rx="4" fill="none" stroke="#1CA7A8" stroke-width="2"/>
  <rect x="32" y="101" width="98" height="237" rx="2" fill="#0D2338"/>

  <!-- ---- RT FIGURE ---- -->
  <!-- Head -->
  <circle cx="80" cy="172" r="19" fill="#F0C890" stroke="#D4A068" stroke-width="1.2"/>
  <!-- Hair -->
  <ellipse cx="80" cy="157" rx="19" ry="8" fill="#5A3928"/>
  <!-- Lab coat body -->
  <rect x="62" y="193" width="36" height="54" rx="7" fill="#F8F8F8" stroke="#DCDCDC" stroke-width="1"/>
  <!-- Lab coat V-detail -->
  <path d="M68,193 L80,204 L92,193" fill="#EBEBEB" stroke="none"/>
  <!-- Left arm (slightly extended) -->
  <rect x="52" y="196" width="12" height="38" rx="5" fill="#F8F8F8" stroke="#DCDCDC" stroke-width="1" transform="rotate(-10,58,215)"/>
  <!-- Right arm -->
  <rect x="88" y="196" width="12" height="38" rx="5" fill="#F8F8F8" stroke="#DCDCDC" stroke-width="1" transform="rotate(10,94,215)"/>
  <!-- Stethoscope around neck -->
  <path d="M70,200 Q62,214 67,220" stroke="#909090" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="67" cy="221" r="3.5" fill="#909090"/>
  <!-- Legs -->
  <rect x="65" y="246" width="12" height="36" rx="4" fill="#1A3448"/>
  <rect x="81" y="246" width="12" height="36" rx="4" fill="#1A3448"/>
  <!-- Shoes -->
  <ellipse cx="71" cy="284" rx="9" ry="4" fill="#0D2030"/>
  <ellipse cx="87" cy="284" rx="9" ry="4" fill="#0D2030"/>

  <!-- RT Label badge -->
  <rect x="38" y="294" width="84" height="24" rx="6" fill="#1CA7A8" opacity="0.18"/>
  <text x="80" y="310" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="700">RT Student</text>

  <!-- ---- GAZE / OBSERVATION LINE ---- -->
  <path d="M 100,170 Q 190,158 242,204" stroke="#1CA7A8" stroke-width="2" stroke-dasharray="7,4" fill="none" marker-end="url(#gazearrow)"/>
  <defs>
    <marker id="gazearrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1CA7A8" opacity="0.85"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1CA7A8"/>
    </marker>
  </defs>

  <!-- ---- PATIENT IN BED ---- -->
  <!-- Bed frame -->
  <rect x="224" y="252" width="148" height="78" rx="8" fill="#1A3550" stroke="#2A4F6E" stroke-width="1.5"/>
  <!-- Headboard -->
  <rect x="347" y="244" width="16" height="94" rx="4" fill="#1E3A54"/>
  <!-- Pillow -->
  <rect x="230" y="240" width="50" height="26" rx="7" fill="#FFFFFF" opacity="0.82"/>
  <!-- Blanket -->
  <rect x="230" y="267" width="114" height="57" rx="4" fill="#4BA3F2" opacity="0.22"/>
  <!-- Patient head -->
  <circle cx="255" cy="226" r="22" fill="#F0C890" stroke="#D4A068" stroke-width="1.2"/>
  <!-- Patient hair -->
  <ellipse cx="255" cy="210" rx="22" ry="9" fill="#8B6040"/>
  <!-- Patient eyes closed -->
  <path d="M245,224 Q250,221 255,224" stroke="#6B4828" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M255,224 Q260,221 265,224" stroke="#6B4828" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Patient label -->
  <rect x="226" y="338" width="72" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="262" y="354" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="11" font-weight="600">Patient</text>

  <!-- ---- OBSERVE FIRST text ---- -->
  <text x="200" y="405" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="700">Observe</text>
  <text x="200" y="428" text-anchor="middle" fill="#1CA7A8" font-size="21" font-weight="700">Before You Act</text>

  <!-- Time badge -->
  <rect x="58" y="443" width="284" height="30" rx="8" fill="#1CA7A8" opacity="0.16" stroke="#1CA7A8" stroke-width="1.5"/>
  <text x="200" y="462" text-anchor="middle" fill="#1CA7A8" font-size="12" font-weight="700">First look: less than 60 seconds</text>

  <!-- ===== PANEL DIVIDER ===== -->
  <rect x="400" y="62" width="1.5" height="416" fill="#C8DDE8"/>

  <!-- ===== RIGHT PANEL ===== -->

  <!-- Section heading -->
  <text x="422" y="100" fill="#0B1F33" font-size="13" font-weight="700" letter-spacing="1.5">WHAT TO OBSERVE</text>
  <rect x="422" y="106" width="70" height="3" rx="2" fill="#1CA7A8"/>

  <!-- BOX 1 · Breathing Rate -->
  <rect x="414" y="118" width="532" height="60" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="414" y="118" width="6" height="60" rx="3" fill="#1CA7A8"/>
  <text x="434" y="143" fill="#0B1F33" font-size="14" font-weight="700">Breathing Rate</text>
  <text x="434" y="163" fill="#415A77" font-size="12">Is breathing too fast, too slow, or paused? Normal adult: ~12–20 breaths/min</text>

  <!-- BOX 2 · Work of Breathing -->
  <rect x="414" y="188" width="532" height="60" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="414" y="188" width="6" height="60" rx="3" fill="#4BA3F2"/>
  <text x="434" y="213" fill="#0B1F33" font-size="14" font-weight="700">Work of Breathing</text>
  <text x="434" y="233" fill="#415A77" font-size="12">Does breathing look like hard work? Are neck or shoulder muscles helping?</text>

  <!-- BOX 3 · Posture -->
  <rect x="414" y="258" width="532" height="60" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="414" y="258" width="6" height="60" rx="3" fill="#F4B860"/>
  <text x="434" y="283" fill="#0B1F33" font-size="14" font-weight="700">Posture</text>
  <text x="434" y="303" fill="#415A77" font-size="12">Sitting upright? Leaning forward to breathe? Unable to lie flat? (Tripod?)</text>

  <!-- BOX 4 · Skin Color -->
  <rect x="414" y="328" width="532" height="60" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="414" y="328" width="6" height="60" rx="3" fill="#E85D5D"/>
  <text x="434" y="353" fill="#0B1F33" font-size="14" font-weight="700">Skin Color</text>
  <text x="434" y="373" fill="#415A77" font-size="12">Normal, pale, flushed, or bluish-gray? Blue may indicate poor oxygenation.</text>

  <!-- BOX 5 · Mental Status -->
  <rect x="414" y="398" width="532" height="60" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="414" y="398" width="6" height="60" rx="3" fill="#415A77"/>
  <text x="434" y="423" fill="#0B1F33" font-size="14" font-weight="700">Mental Status</text>
  <text x="434" y="443" fill="#415A77" font-size="12">Awake and responding? Confused or drowsy? Changes can signal poor ventilation.</text>

  <!-- ===== FOOTER ===== -->
  <rect x="0" y="478" width="960" height="42" fill="#0B1F33"/>
  <text x="480" y="503" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · Pulmonary Assessment Unit 1 · Lesson 1.1 · First Impression Assessment</text>

</svg>
