<svg viewBox="0 0 960 522" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="530" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">HYPOXEMIA — THE LABORATORY FINDING</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.2  ·  PaO₂ &lt; 80 mmHg ON ROOM AIR AT SEA LEVEL  ·  OBJECTIVE · MEASURABLE · QUANTIFIED BY ABG</text>

  <!-- ===== LEFT: PaO2 severity scale (x=8, w=210) ===== -->
  <rect x="8" y="70" width="210" height="395" rx="10" fill="#FFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="8" y="70" width="210" height="38" rx="10" fill="#0B1F33"/>
  <rect x="8" y="96" width="210" height="12" fill="#0B1F33"/>
  <text x="113" y="94" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">PaO₂ SEVERITY</text>

  <!-- Scale bar -->
  <!-- Normal: y=118-198 (green) -->
  <rect x="50" y="118" width="50" height="80" rx="4" fill="#A3E6A0"/>
  <text x="75" y="145" text-anchor="middle" fill="#1A5E1A" font-size="9" font-weight="800">100</text>
  <text x="75" y="160" text-anchor="middle" fill="#1A5E1A" font-size="8">mmHg</text>
  <line x1="100" y1="138" x2="140" y2="138" stroke="#415A77" stroke-width="1"/>
  <text x="145" y="142" fill="#0B1F33" font-size="12" font-weight="700">Normal</text>
  <text x="145" y="156" fill="#415A77" font-size="10">80–100</text>
  <rect x="50" y="198" width="50" height="2" fill="#0B1F33"/>
  <text x="75" y="207" text-anchor="middle" fill="#E85D5D" font-size="10" font-weight="800">80</text>

  <!-- Mild: y=208-278 (yellow) -->
  <rect x="50" y="210" width="50" height="70" rx="4" fill="#F4B860"/>
  <line x1="100" y1="228" x2="140" y2="228" stroke="#415A77" stroke-width="1"/>
  <text x="145" y="232" fill="#0B1F33" font-size="12" font-weight="700">Mild</text>
  <text x="145" y="246" fill="#415A77" font-size="10">60–79 mmHg</text>
  <rect x="50" y="280" width="50" height="2" fill="#0B1F33"/>
  <text x="75" y="289" text-anchor="middle" fill="#E85D5D" font-size="10" font-weight="800">60</text>

  <!-- Moderate: y=290-360 (orange) -->
  <rect x="50" y="292" width="50" height="70" rx="4" fill="#E07030"/>
  <line x1="100" y1="312" x2="140" y2="312" stroke="#415A77" stroke-width="1"/>
  <text x="145" y="316" fill="#0B1F33" font-size="12" font-weight="700">Moderate</text>
  <text x="145" y="330" fill="#415A77" font-size="10">40–59 mmHg</text>
  <rect x="50" y="362" width="50" height="2" fill="#0B1F33"/>
  <text x="75" y="371" text-anchor="middle" fill="#E85D5D" font-size="10" font-weight="800">40</text>

  <!-- Severe: y=373-443 (red) -->
  <rect x="50" y="374" width="50" height="70" rx="4" fill="#E85D5D"/>
  <line x1="100" y1="398" x2="140" y2="398" stroke="#415A77" stroke-width="1"/>
  <text x="145" y="402" fill="#0B1F33" font-size="12" font-weight="700">Severe</text>
  <text x="145" y="416" fill="#415A77" font-size="10">&lt;40 mmHg</text>
  <text x="145" y="430" fill="#E85D5D" font-size="10" font-weight="700">Life-threatening</text>
  <text x="75" y="460" text-anchor="middle" fill="#E85D5D" font-size="10" font-weight="800">0</text>

  <!-- ===== RIGHT: 5 Causes (x=228, w=724) ===== -->
  <rect x="228" y="70" width="724" height="395" rx="10" fill="#FFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="228" y="70" width="724" height="38" rx="10" fill="#0B1F33"/>
  <rect x="228" y="96" width="724" height="12" fill="#0B1F33"/>
  <text x="590" y="94" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">FIVE CAUSES OF HYPOXEMIA</text>

  <!-- Cause 1: Hypoventilation -->
  <rect x="238" y="118" width="704" height="62" rx="8" fill="#E6F3FF"/>
  <rect x="238" y="118" width="6" height="62" rx="3" fill="#4BA3F2"/>
  <text x="256" y="137" fill="#0B1F33" font-size="12" font-weight="700">1. Hypoventilation</text>
  <text x="256" y="154" fill="#415A77" font-size="11">Too little air movement → alveoli don't receive fresh O₂ → CO₂ displaces O₂ → PAO₂ falls.</text>
  <text x="256" y="170" fill="#415A77" font-size="11">PaCO₂ will be ELEVATED. A-a gradient is NORMAL (lungs transfer O₂ fine — the input is just low).</text>

  <!-- Cause 2: V/Q Mismatch -->
  <rect x="238" y="188" width="704" height="62" rx="8" fill="#DDF7F2"/>
  <rect x="238" y="188" width="6" height="62" rx="3" fill="#1CA7A8"/>
  <text x="256" y="207" fill="#0B1F33" font-size="12" font-weight="700">2. V/Q Mismatch</text>
  <text x="256" y="224" fill="#415A77" font-size="11">Ventilation and perfusion are mismatched across lung regions — some areas ventilated but not perfused,</text>
  <text x="256" y="240" fill="#415A77" font-size="11">others perfused but not ventilated. A-a gradient is WIDENED. Most common cause of hypoxemia.</text>

  <!-- Cause 3: Diffusion Impairment -->
  <rect x="238" y="258" width="704" height="62" rx="8" fill="#FFF4DF"/>
  <rect x="238" y="258" width="6" height="62" rx="3" fill="#F4B860"/>
  <text x="256" y="277" fill="#0B1F33" font-size="12" font-weight="700">3. Diffusion Impairment</text>
  <text x="256" y="294" fill="#415A77" font-size="11">Thickened alveolar-capillary membrane (fibrosis, ARDS) slows O₂ crossing into blood. Worsens with</text>
  <text x="256" y="310" fill="#415A77" font-size="11">exercise (shorter transit time). A-a gradient is WIDENED. Responds well to supplemental O₂.</text>

  <!-- Cause 4: Shunting -->
  <rect x="238" y="328" width="704" height="62" rx="8" fill="#FDE9E9"/>
  <rect x="238" y="328" width="6" height="62" rx="3" fill="#E85D5D"/>
  <text x="256" y="347" fill="#0B1F33" font-size="12" font-weight="700">4. Shunting (True Shunt)</text>
  <text x="256" y="364" fill="#415A77" font-size="11">Blood bypasses ventilated alveoli entirely (consolidated/collapsed/flooded alveoli). A-a gradient is WIDE.</text>
  <text x="256" y="380" fill="#E85D5D" font-size="11" font-weight="700">Does NOT respond to supplemental O₂ — blood never contacts alveolar gas. PEEP is the key intervention.</text>

  <!-- Cause 5: Low FiO2 -->
  <rect x="238" y="398" width="704" height="62" rx="8" fill="#F3F0FF"/>
  <rect x="238" y="398" width="6" height="62" rx="3" fill="#8B5CF6"/>
  <text x="256" y="417" fill="#0B1F33" font-size="12" font-weight="700">5. Low Inspired Oxygen (Low FiO₂)</text>
  <text x="256" y="434" fill="#415A77" font-size="11">High altitude reduces barometric pressure → lower PAO₂ despite normal lungs and normal gas exchange.</text>
  <text x="256" y="450" fill="#415A77" font-size="11">A-a gradient is NORMAL. Supplemental O₂ or descent completely reverses this cause.</text>

  <rect x="0" y="481" width="960" height="36" fill="#0B1F33"/>
  <text x="480" y="504" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.2 · Hypoxemia · PaO₂ &lt; 80 mmHg · 5 causes: Hypoventilation · V/Q Mismatch · Diffusion · Shunt · Low FiO₂</text>
</svg>
