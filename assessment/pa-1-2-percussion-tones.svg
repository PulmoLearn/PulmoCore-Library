<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="460" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">PERCUSSION TONES: WHAT EACH SOUND SUGGESTS</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.2  ·  TAP OVER THE CHEST WALL AND LISTEN</text>

  <!-- ============================================================ -->
  <!-- PANEL 1: RESONANT (x = 10 to 308) -->
  <!-- ============================================================ -->
  <rect x="10" y="70" width="298" height="358" rx="12" fill="#FFFFFF" stroke="#1CA7A8" stroke-width="2"/>

  <!-- Panel top band -->
  <rect x="10" y="70" width="298" height="50" rx="12" fill="#1CA7A8"/>
  <rect x="10" y="104" width="298" height="16" fill="#1CA7A8"/>
  <text x="159" y="103" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">RESONANT</text>

  <!-- Waveform area -->
  <rect x="22" y="128" width="274" height="70" rx="8" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <!-- Moderate amplitude wave -->
  <path d="M 32,163 Q 55,133 78,163 Q 101,193 124,163 Q 147,133 170,163 Q 193,193 216,163 Q 239,133 262,163 Q 274,163 286,163"
        stroke="#1CA7A8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="159" y="210" text-anchor="middle" fill="#0B7F80" font-size="10" font-weight="600">moderate amplitude · clear tone</text>

  <!-- Main label -->
  <text x="159" y="248" text-anchor="middle" fill="#0B1F33" font-size="22" font-weight="700">Normal</text>

  <!-- Equals and meaning -->
  <rect x="24" y="260" width="270" height="34" rx="7" fill="#DDF7F2"/>
  <text x="159" y="283" text-anchor="middle" fill="#0B7F80" font-size="13" font-weight="700">= Air-filled lung tissue</text>

  <!-- Divider -->
  <rect x="30" y="302" width="248" height="1.5" fill="#D7E6EF"/>

  <!-- Examples section -->
  <text x="36" y="323" fill="#0B1F33" font-size="11" font-weight="700">EXPECTED WHEN:</text>
  <circle cx="42" cy="343" r="3" fill="#1CA7A8"/>
  <text x="54" y="348" fill="#415A77" font-size="11">Normal lung fields (bilateral)</text>
  <circle cx="42" cy="363" r="3" fill="#1CA7A8"/>
  <text x="54" y="368" fill="#415A77" font-size="11">Symmetric — both sides match</text>
  <circle cx="42" cy="383" r="3" fill="#1CA7A8"/>
  <text x="54" y="388" fill="#415A77" font-size="11">Healthy adult lung tissue</text>

  <!-- ============================================================ -->
  <!-- PANEL 2: DULL (x = 330 to 628) -->
  <!-- ============================================================ -->
  <rect x="330" y="70" width="300" height="358" rx="12" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>

  <!-- Panel top band -->
  <rect x="330" y="70" width="300" height="50" rx="12" fill="#415A77"/>
  <rect x="330" y="104" width="300" height="16" fill="#415A77"/>
  <text x="480" y="103" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">DULL</text>

  <!-- Waveform area -->
  <rect x="342" y="128" width="276" height="70" rx="8" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <!-- Low amplitude, flat wave -->
  <path d="M 352,163 Q 375,151 398,163 Q 421,175 444,163 Q 467,151 490,163 Q 513,175 536,163 Q 559,151 582,163 Q 600,163 608,163"
        stroke="#415A77" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="480" y="210" text-anchor="middle" fill="#415A77" font-size="10" font-weight="600">low amplitude · muffled, flat tone</text>

  <!-- Main label -->
  <text x="480" y="248" text-anchor="middle" fill="#0B1F33" font-size="22" font-weight="700">Dense / Fluid</text>

  <!-- Equals and meaning -->
  <rect x="344" y="260" width="272" height="34" rx="7" fill="#EEF1F5"/>
  <text x="480" y="283" text-anchor="middle" fill="#243b55" font-size="13" font-weight="700">= Less air or more density</text>

  <!-- Divider -->
  <rect x="346" y="302" width="248" height="1.5" fill="#D7E6EF"/>

  <!-- Examples section -->
  <text x="352" y="323" fill="#0B1F33" font-size="11" font-weight="700">ASSOCIATED WITH:</text>
  <circle cx="358" cy="343" r="3" fill="#415A77"/>
  <text x="370" y="348" fill="#415A77" font-size="11">Pleural effusion (fluid around lung)</text>
  <circle cx="358" cy="363" r="3" fill="#415A77"/>
  <text x="370" y="368" fill="#415A77" font-size="11">Consolidation (dense lung tissue)</text>
  <circle cx="358" cy="383" r="3" fill="#415A77"/>
  <text x="370" y="388" fill="#415A77" font-size="11">Collapse / atelectasis</text>

  <!-- ============================================================ -->
  <!-- PANEL 3: HYPERRESONANT (x = 650 to 950) -->
  <!-- ============================================================ -->
  <rect x="650" y="70" width="300" height="358" rx="12" fill="#FFFFFF" stroke="#F4B860" stroke-width="2"/>

  <!-- Panel top band -->
  <rect x="650" y="70" width="300" height="50" rx="12" fill="#F4B860"/>
  <rect x="650" y="104" width="300" height="16" fill="#F4B860"/>
  <text x="800" y="103" text-anchor="middle" fill="#0B1F33" font-size="16" font-weight="700">HYPERRESONANT</text>

  <!-- Waveform area -->
  <rect x="662" y="128" width="276" height="70" rx="8" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <!-- High amplitude, widely-spaced wave -->
  <path d="M 668,163 Q 697,118 726,163 Q 755,208 784,163 Q 813,118 842,163 Q 858,163 928,163"
        stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="800" y="210" text-anchor="middle" fill="#7A4B00" font-size="10" font-weight="600">high amplitude · booming, prolonged tone</text>

  <!-- Main label -->
  <text x="800" y="248" text-anchor="middle" fill="#0B1F33" font-size="22" font-weight="700">Excess Air</text>

  <!-- Equals and meaning -->
  <rect x="664" y="260" width="272" height="34" rx="7" fill="#FFF4DF"/>
  <text x="800" y="283" text-anchor="middle" fill="#7A4B00" font-size="13" font-weight="700">= Too much air or trapped air</text>

  <!-- Divider -->
  <rect x="666" y="302" width="248" height="1.5" fill="#D7E6EF"/>

  <!-- Examples section -->
  <text x="672" y="323" fill="#0B1F33" font-size="11" font-weight="700">ASSOCIATED WITH:</text>
  <circle cx="678" cy="343" r="3" fill="#F4B860"/>
  <text x="690" y="348" fill="#415A77" font-size="11">Pneumothorax (air in pleural space)</text>
  <circle cx="678" cy="363" r="3" fill="#F4B860"/>
  <text x="690" y="368" fill="#415A77" font-size="11">Severe air trapping (e.g., asthma)</text>
  <circle cx="678" cy="383" r="3" fill="#F4B860"/>
  <text x="690" y="388" fill="#415A77" font-size="11">Significant hyperinflation</text>

  <!-- FOOTER -->
  <rect x="0" y="424" width="960" height="36" fill="#0B1F33"/>
  <text x="480" y="447" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.2 · Percussion Tones · Always compare right vs. left side</text>

</svg>
