<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <marker id="seqarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1CA7A8"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="420" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">THE BEDSIDE ASSESSMENT SEQUENCE</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.2  ·  INSPECT · PALPATE · PERCUSS · AUSCULTATE</text>

  <!-- ===== STEP 1: INSPECT ===== -->
  <rect x="14" y="80" width="200" height="296" rx="14" fill="#FFFFFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <!-- Step badge -->
  <circle cx="44" cy="80" r="16" fill="#1CA7A8"/>
  <text x="44" y="86" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">1</text>
  <!-- Step name band -->
  <rect x="14" y="80" width="200" height="52" rx="14" fill="#1CA7A8"/>
  <rect x="14" y="117" width="200" height="15" fill="#1CA7A8"/>
  <text x="114" y="114" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">INSPECT</text>
  <!-- Plain language -->
  <text x="114" y="158" text-anchor="middle" fill="#415A77" font-size="12" font-style="italic">Look at the patient</text>
  <!-- Divider -->
  <rect x="30" y="170" width="168" height="1.5" fill="#D7E6EF"/>
  <!-- Content label -->
  <text x="30" y="193" fill="#0B1F33" font-size="11" font-weight="700">WHAT RT LEARNS:</text>
  <!-- Bullet items -->
  <circle cx="38" cy="214" r="3" fill="#1CA7A8"/>
  <text x="50" y="219" fill="#415A77" font-size="11">Breathing effort &amp; rate</text>
  <circle cx="38" cy="236" r="3" fill="#1CA7A8"/>
  <text x="50" y="241" fill="#415A77" font-size="11">Posture &amp; position</text>
  <circle cx="38" cy="258" r="3" fill="#1CA7A8"/>
  <text x="50" y="263" fill="#415A77" font-size="11">Chest symmetry</text>
  <circle cx="38" cy="280" r="3" fill="#1CA7A8"/>
  <text x="50" y="285" fill="#415A77" font-size="11">Skin color &amp; distress</text>
  <circle cx="38" cy="302" r="3" fill="#1CA7A8"/>
  <text x="50" y="307" fill="#415A77" font-size="11">Accessory muscle use</text>
  <circle cx="38" cy="324" r="3" fill="#1CA7A8"/>
  <text x="50" y="329" fill="#415A77" font-size="11">Retractions</text>
  <!-- No touch icon -->
  <rect x="136" y="316" width="64" height="24" rx="6" fill="#DDF7F2"/>
  <text x="168" y="332" text-anchor="middle" fill="#0B7F80" font-size="10" font-weight="700">Eyes only</text>

  <!-- ARROW 1→2 -->
  <line x1="218" y1="228" x2="248" y2="228" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#seqarrow)"/>

  <!-- ===== STEP 2: PALPATE ===== -->
  <rect x="254" y="80" width="200" height="296" rx="14" fill="#FFFFFF" stroke="#4BA3F2" stroke-width="2.5"/>
  <circle cx="284" cy="80" r="16" fill="#4BA3F2"/>
  <text x="284" y="86" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">2</text>
  <rect x="254" y="80" width="200" height="52" rx="14" fill="#4BA3F2"/>
  <rect x="254" y="117" width="200" height="15" fill="#4BA3F2"/>
  <text x="354" y="114" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">PALPATE</text>
  <text x="354" y="158" text-anchor="middle" fill="#415A77" font-size="12" font-style="italic">Use your hands to feel</text>
  <rect x="270" y="170" width="168" height="1.5" fill="#D7E6EF"/>
  <text x="270" y="193" fill="#0B1F33" font-size="11" font-weight="700">WHAT RT LEARNS:</text>
  <circle cx="278" cy="214" r="3" fill="#4BA3F2"/>
  <text x="290" y="219" fill="#415A77" font-size="11">Chest wall expansion</text>
  <circle cx="278" cy="236" r="3" fill="#4BA3F2"/>
  <text x="290" y="241" fill="#415A77" font-size="11">Tracheal position</text>
  <circle cx="278" cy="258" r="3" fill="#4BA3F2"/>
  <text x="290" y="263" fill="#415A77" font-size="11">Tactile fremitus</text>
  <circle cx="278" cy="280" r="3" fill="#4BA3F2"/>
  <text x="290" y="285" fill="#415A77" font-size="11">Tenderness / pain</text>
  <circle cx="278" cy="302" r="3" fill="#4BA3F2"/>
  <text x="290" y="307" fill="#415A77" font-size="11">Crepitus (air under skin)</text>
  <rect x="278" y="318" width="96" height="24" rx="6" fill="#E6F3FF"/>
  <text x="326" y="334" text-anchor="middle" fill="#1A5EA8" font-size="10" font-weight="700">Hands-on</text>

  <!-- ARROW 2→3 -->
  <line x1="458" y1="228" x2="488" y2="228" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#seqarrow)"/>

  <!-- ===== STEP 3: PERCUSS ===== -->
  <rect x="494" y="80" width="200" height="296" rx="14" fill="#FFFFFF" stroke="#F4B860" stroke-width="2.5"/>
  <circle cx="524" cy="80" r="16" fill="#F4B860"/>
  <text x="524" y="86" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">3</text>
  <rect x="494" y="80" width="200" height="52" rx="14" fill="#F4B860"/>
  <rect x="494" y="117" width="200" height="15" fill="#F4B860"/>
  <text x="594" y="114" text-anchor="middle" fill="#0B1F33" font-size="17" font-weight="700">PERCUSS</text>
  <text x="594" y="158" text-anchor="middle" fill="#415A77" font-size="12" font-style="italic">Tap over the chest wall</text>
  <rect x="510" y="170" width="168" height="1.5" fill="#D7E6EF"/>
  <text x="510" y="193" fill="#0B1F33" font-size="11" font-weight="700">TONE INDICATES:</text>
  <circle cx="518" cy="214" r="3" fill="#F4B860"/>
  <text x="530" y="219" fill="#415A77" font-size="11">Resonant = normal air</text>
  <circle cx="518" cy="236" r="3" fill="#F4B860"/>
  <text x="530" y="241" fill="#415A77" font-size="11">Dull = fluid or density</text>
  <circle cx="518" cy="258" r="3" fill="#F4B860"/>
  <text x="530" y="263" fill="#415A77" font-size="11">Hyperresonant = excess air</text>
  <circle cx="518" cy="280" r="3" fill="#F4B860"/>
  <text x="530" y="285" fill="#415A77" font-size="11">Compare side-to-side</text>
  <circle cx="518" cy="302" r="3" fill="#F4B860"/>
  <text x="530" y="307" fill="#415A77" font-size="11">Work top to bottom</text>
  <rect x="516" y="318" width="80" height="24" rx="6" fill="#FFF4DF"/>
  <text x="556" y="334" text-anchor="middle" fill="#7A4B00" font-size="10" font-weight="700">Tapping</text>

  <!-- ARROW 3→4 -->
  <line x1="698" y1="228" x2="728" y2="228" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#seqarrow)"/>

  <!-- ===== STEP 4: AUSCULTATE ===== -->
  <rect x="734" y="80" width="212" height="296" rx="14" fill="#FFFFFF" stroke="#415A77" stroke-width="2.5"/>
  <circle cx="764" cy="80" r="16" fill="#415A77"/>
  <text x="764" y="86" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">4</text>
  <rect x="734" y="80" width="212" height="52" rx="14" fill="#415A77"/>
  <rect x="734" y="117" width="212" height="15" fill="#415A77"/>
  <text x="840" y="114" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">AUSCULTATE</text>
  <text x="840" y="158" text-anchor="middle" fill="#415A77" font-size="12" font-style="italic">Listen with stethoscope</text>
  <rect x="750" y="170" width="180" height="1.5" fill="#D7E6EF"/>
  <text x="750" y="193" fill="#0B1F33" font-size="11" font-weight="700">WHAT RT HEARS:</text>
  <circle cx="758" cy="214" r="3" fill="#415A77"/>
  <text x="770" y="219" fill="#415A77" font-size="11">Vesicular (normal)</text>
  <circle cx="758" cy="236" r="3" fill="#415A77"/>
  <text x="770" y="241" fill="#415A77" font-size="11">Wheezes (narrowed airway)</text>
  <circle cx="758" cy="258" r="3" fill="#415A77"/>
  <text x="770" y="263" fill="#415A77" font-size="11">Crackles (fluid/reopening)</text>
  <circle cx="758" cy="280" r="3" fill="#415A77"/>
  <text x="770" y="285" fill="#415A77" font-size="11">Rhonchi (secretions)</text>
  <circle cx="758" cy="302" r="3" fill="#415A77"/>
  <text x="770" y="307" fill="#415A77" font-size="11">Diminished or absent</text>
  <rect x="756" y="318" width="104" height="24" rx="6" fill="#EEF1F5"/>
  <text x="808" y="334" text-anchor="middle" fill="#243b55" font-size="10" font-weight="700">Stethoscope</text>

  <!-- FOOTER -->
  <rect x="0" y="386" width="960" height="34" fill="#0B1F33"/>
  <text x="480" y="408" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.2 · Bedside Assessment Sequence · Always compare side-to-side</text>

</svg>
