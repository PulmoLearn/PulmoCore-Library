<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <!-- Arrow marker (auto-orient for all directions) -->
    <marker id="cyclearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1CA7A8"/>
    </marker>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="900" height="490" fill="#F4FAFC"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="900" height="62" fill="#0B1F33"/>
  <text x="450" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">THE RESPIRATORY ASSESSMENT CYCLE</text>
  <text x="450" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.1  ·  PULMOCORE  ·  THE RT DETECTIVE FRAMEWORK</text>

  <!-- ===== CYCLE BACKGROUND TRACK ===== -->
  <!-- Subtle rounded rectangle track showing the loop -->
  <rect x="56" y="154" width="788" height="240" rx="28" fill="none" stroke="#D7E6EF" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- ============================= -->
  <!-- ===== TOP ROW OF NODES ===== -->
  <!-- ============================= -->

  <!-- NODE 1 · Observe (top-left, x=150, y=200) -->
  <rect x="60" y="168" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="84" cy="168" r="13" fill="#1CA7A8"/>
  <text x="84" y="173" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
  <!-- Labels -->
  <text x="150" y="196" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Observe</text>
  <text x="150" y="215" text-anchor="middle" fill="#415A77" font-size="11">Patient appearance</text>

  <!-- NODE 2 · Ask (top-center, x=450, y=200) -->
  <rect x="360" y="168" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#4BA3F2" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="384" cy="168" r="13" fill="#4BA3F2"/>
  <text x="384" y="173" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">2</text>
  <!-- Labels -->
  <text x="450" y="196" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Ask</text>
  <text x="450" y="215" text-anchor="middle" fill="#415A77" font-size="11">Symptoms &amp; history</text>

  <!-- NODE 3 · Review (top-right, x=750, y=200) -->
  <rect x="660" y="168" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#415A77" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="684" cy="168" r="13" fill="#415A77"/>
  <text x="684" y="173" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">3</text>
  <!-- Labels -->
  <text x="750" y="196" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Review</text>
  <text x="750" y="215" text-anchor="middle" fill="#415A77" font-size="11">Chart &amp; orders</text>

  <!-- ================================ -->
  <!-- ===== BOTTOM ROW OF NODES ===== -->
  <!-- ================================ -->

  <!-- NODE 4 · Assess (bottom-right, x=750, y=355) -->
  <rect x="660" y="322" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#F4B860" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="684" cy="322" r="13" fill="#F4B860"/>
  <text x="684" y="327" text-anchor="middle" fill="#0B1F33" font-size="12" font-weight="700">4</text>
  <!-- Labels -->
  <text x="750" y="350" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Assess</text>
  <text x="750" y="369" text-anchor="middle" fill="#415A77" font-size="11">Connect the data</text>

  <!-- NODE 5 · Support (bottom-center, x=450, y=355) -->
  <rect x="360" y="322" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#128486" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="384" cy="322" r="13" fill="#128486"/>
  <text x="384" y="327" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">5</text>
  <!-- Labels -->
  <text x="450" y="350" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Support</text>
  <text x="450" y="369" text-anchor="middle" fill="#415A77" font-size="11">Provide RT care</text>

  <!-- NODE 6 · Reassess (bottom-left, x=150, y=355) -->
  <rect x="60" y="322" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <!-- Number badge -->
  <circle cx="84" cy="322" r="13" fill="#1CA7A8"/>
  <text x="84" y="327" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">6</text>
  <!-- Labels -->
  <text x="150" y="350" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Reassess</text>
  <text x="150" y="369" text-anchor="middle" fill="#415A77" font-size="11">Patient changed?</text>

  <!-- ====================== -->
  <!-- ===== ARROWS ========= -->
  <!-- ====================== -->

  <!-- TOP ROW: Left→Center (right arrow) -->
  <line x1="244" y1="202" x2="356" y2="202" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- TOP ROW: Center→Right (right arrow) -->
  <line x1="544" y1="202" x2="656" y2="202" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- RIGHT SIDE: Top→Bottom (down arrow) -->
  <line x1="750" y1="240" x2="750" y2="318" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- BOTTOM ROW: Right→Center (left arrow) -->
  <line x1="656" y1="356" x2="544" y2="356" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- BOTTOM ROW: Center→Left (left arrow) -->
  <line x1="356" y1="356" x2="244" y2="356" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- LEFT SIDE: Bottom→Top (up arrow) -->
  <line x1="150" y1="318" x2="150" y2="240" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#cyclearrow)"/>

  <!-- ===== CENTER BADGE ===== -->
  <rect x="372" y="264" width="156" height="36" rx="10" fill="#DDF7F2" stroke="#1CA7A8" stroke-width="1.5"/>
  <text x="450" y="287" text-anchor="middle" fill="#0B7F80" font-size="12" font-weight="700">Repeating Process</text>

  <!-- ===== BOTTOM CALLOUT ===== -->
  <!-- Assessment comes before intervention -->
  <rect x="200" y="410" width="500" height="36" rx="10" fill="#0B1F33" opacity="0.05" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="450" y="433" text-anchor="middle" fill="#0B1F33" font-size="12" font-weight="700">Assessment comes before intervention — always.</text>

  <!-- ===== FOOTER ===== -->
  <rect x="0" y="452" width="900" height="38" fill="#0B1F33"/>
  <text x="450" y="476" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · Pulmonary Assessment Unit 1 · Lesson 1.1 · The RT Assessment Cycle</text>

</svg>
