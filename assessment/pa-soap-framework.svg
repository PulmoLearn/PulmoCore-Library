<svg viewBox="0 0 960 510" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="510" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">THE SOAP NOTE FRAMEWORK</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.3  ·  PULMOCORE  ·  SOAP NOTES &amp; CLINICAL DOCUMENTATION</text>

  <!-- SUB-HEADER: four-part story label -->
  <rect x="0" y="62" width="960" height="30" fill="#102A43"/>
  <text x="480" y="82" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-weight="600" letter-spacing="0.5">Four-part story: What they said · What you found · What it means · What happens next</text>

  <!-- ============================================================ -->
  <!-- PANEL 1 — S: SUBJECTIVE (x=0–240, y=92–472) -->
  <!-- ============================================================ -->

  <!-- Panel background -->
  <rect x="0" y="92" width="240" height="380" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1"/>

  <!-- Color band -->
  <rect x="0" y="92" width="240" height="80" fill="#1CA7A8"/>
  <!-- Large letter -->
  <text x="120" y="152" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800" opacity="0.25">S</text>
  <text x="120" y="148" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800">S</text>
  <!-- Section name -->
  <rect x="10" y="158" width="220" height="24" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="120" y="175" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1">SUBJECTIVE</text>

  <!-- Plain language -->
  <text x="120" y="212" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">What the patient reports</text>

  <!-- Divider -->
  <rect x="16" y="224" width="208" height="1.5" fill="#D7E6EF"/>

  <!-- Examples label -->
  <text x="16" y="246" fill="#1CA7A8" font-size="10" font-weight="700" letter-spacing="1">RT EXAMPLES:</text>

  <!-- Bullets -->
  <circle cx="22" cy="264" r="3" fill="#1CA7A8"/>
  <text x="32" y="269" fill="#415A77" font-size="12">"I feel short of breath."</text>

  <circle cx="22" cy="286" r="3" fill="#1CA7A8"/>
  <text x="32" y="291" fill="#415A77" font-size="12">Smoking / vaping history</text>

  <circle cx="22" cy="308" r="3" fill="#1CA7A8"/>
  <text x="32" y="313" fill="#415A77" font-size="12">Home inhaler or O₂ use</text>

  <circle cx="22" cy="330" r="3" fill="#1CA7A8"/>
  <text x="32" y="335" fill="#415A77" font-size="12">Allergies (patient-reported)</text>

  <circle cx="22" cy="352" r="3" fill="#1CA7A8"/>
  <text x="32" y="357" fill="#415A77" font-size="12">Chief complaint / symptoms</text>

  <circle cx="22" cy="374" r="3" fill="#1CA7A8"/>
  <text x="32" y="379" fill="#415A77" font-size="12">30 pack-year history</text>

  <!-- Bottom rule -->
  <rect x="10" y="420" width="220" height="36" rx="7" fill="#DDF7F2"/>
  <text x="120" y="442" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Patient said it = Subjective</text>

  <!-- ============================================================ -->
  <!-- PANEL 2 — O: OBJECTIVE (x=240–480, y=92–472) -->
  <!-- ============================================================ -->
  <rect x="240" y="92" width="240" height="380" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1"/>
  <rect x="240" y="92" width="240" height="80" fill="#4BA3F2"/>
  <text x="360" y="152" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800" opacity="0.25">O</text>
  <text x="360" y="148" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800">O</text>
  <rect x="250" y="158" width="220" height="24" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="360" y="175" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1">OBJECTIVE</text>

  <text x="360" y="212" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">What you measure or observe</text>

  <rect x="256" y="224" width="208" height="1.5" fill="#D7E6EF"/>
  <text x="256" y="246" fill="#4BA3F2" font-size="10" font-weight="700" letter-spacing="1">RT EXAMPLES:</text>

  <circle cx="262" cy="264" r="3" fill="#4BA3F2"/>
  <text x="272" y="269" fill="#415A77" font-size="12">RR, SpO₂, HR, BP values</text>

  <circle cx="262" cy="286" r="3" fill="#4BA3F2"/>
  <text x="272" y="291" fill="#415A77" font-size="12">Breath sounds heard</text>

  <circle cx="262" cy="308" r="3" fill="#4BA3F2"/>
  <text x="272" y="313" fill="#415A77" font-size="12">Oxygen device in use</text>

  <circle cx="262" cy="330" r="3" fill="#4BA3F2"/>
  <text x="272" y="335" fill="#415A77" font-size="12">ABG / lab values (chart)</text>

  <circle cx="262" cy="352" r="3" fill="#4BA3F2"/>
  <text x="272" y="357" fill="#415A77" font-size="12">Work of breathing noted</text>

  <circle cx="262" cy="374" r="3" fill="#4BA3F2"/>
  <text x="272" y="379" fill="#415A77" font-size="12">Imaging reports in chart</text>

  <rect x="250" y="420" width="220" height="36" rx="7" fill="#E6F3FF"/>
  <text x="360" y="442" text-anchor="middle" fill="#1A5EA8" font-size="11" font-weight="700">You measured it = Objective</text>

  <!-- ============================================================ -->
  <!-- PANEL 3 — A: ASSESSMENT (x=480–720, y=92–472) -->
  <!-- ============================================================ -->
  <rect x="480" y="92" width="240" height="380" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1"/>
  <rect x="480" y="92" width="240" height="80" fill="#F4B860"/>
  <text x="600" y="152" text-anchor="middle" fill="#0B1F33" font-size="54" font-weight="800" opacity="0.2">A</text>
  <text x="600" y="148" text-anchor="middle" fill="#0B1F33" font-size="54" font-weight="800">A</text>
  <rect x="490" y="158" width="220" height="24" rx="5" fill="rgba(0,0,0,0.12)"/>
  <text x="600" y="175" text-anchor="middle" fill="#0B1F33" font-size="12" font-weight="700" letter-spacing="1">ASSESSMENT</text>

  <text x="600" y="210" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">Your interpretation of S + O</text>

  <rect x="496" y="222" width="208" height="1.5" fill="#D7E6EF"/>
  <text x="496" y="244" fill="#B07A00" font-size="10" font-weight="700" letter-spacing="1">RT EXAMPLES:</text>

  <circle cx="502" cy="262" r="3" fill="#F4B860"/>
  <text x="512" y="267" fill="#415A77" font-size="12">Increased work of breathing</text>

  <circle cx="502" cy="284" r="3" fill="#F4B860"/>
  <text x="512" y="289" fill="#415A77" font-size="12">Possible airflow obstruction</text>

  <circle cx="502" cy="306" r="3" fill="#F4B860"/>
  <text x="512" y="311" fill="#415A77" font-size="12">Low SpO₂ with wheezing</text>

  <circle cx="502" cy="328" r="3" fill="#F4B860"/>
  <text x="512" y="333" fill="#415A77" font-size="12">Connect S and O together</text>

  <circle cx="502" cy="350" r="3" fill="#F4B860"/>
  <text x="512" y="355" fill="#415A77" font-size="12">Stay within your RT scope</text>

  <circle cx="502" cy="372" r="3" fill="#F4B860"/>
  <text x="512" y="377" fill="#415A77" font-size="12">Avoid over-diagnosing</text>

  <rect x="490" y="420" width="220" height="36" rx="7" fill="#FFF4DF"/>
  <text x="600" y="440" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">What does this suggest?</text>

  <!-- ============================================================ -->
  <!-- PANEL 4 — P: PLAN (x=720–960, y=92–472) -->
  <!-- ============================================================ -->
  <rect x="720" y="92" width="240" height="380" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1"/>
  <rect x="720" y="92" width="240" height="80" fill="#415A77"/>
  <text x="840" y="152" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800" opacity="0.25">P</text>
  <text x="840" y="148" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="800">P</text>
  <rect x="730" y="158" width="220" height="24" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="840" y="175" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1">PLAN</text>

  <text x="840" y="212" text-anchor="middle" fill="#0B1F33" font-size="13" font-weight="700">What happens next</text>

  <rect x="736" y="224" width="208" height="1.5" fill="#D7E6EF"/>
  <text x="736" y="246" fill="#415A77" font-size="10" font-weight="700" letter-spacing="1">RT EXAMPLES:</text>

  <circle cx="742" cy="264" r="3" fill="#415A77"/>
  <text x="752" y="269" fill="#415A77" font-size="12">Give ordered therapy</text>

  <circle cx="742" cy="286" r="3" fill="#415A77"/>
  <text x="752" y="291" fill="#415A77" font-size="12">Educate patient</text>

  <circle cx="742" cy="308" r="3" fill="#415A77"/>
  <text x="752" y="313" fill="#415A77" font-size="12">Reassess breath sounds</text>

  <circle cx="742" cy="330" r="3" fill="#415A77"/>
  <text x="752" y="335" fill="#415A77" font-size="12">Reassess SpO₂ after O₂</text>

  <circle cx="742" cy="352" r="3" fill="#415A77"/>
  <text x="752" y="357" fill="#415A77" font-size="12">Notify provider if worsening</text>

  <circle cx="742" cy="374" r="3" fill="#415A77"/>
  <text x="752" y="379" fill="#415A77" font-size="12">Document response to therapy</text>

  <rect x="730" y="420" width="220" height="36" rx="7" fill="#EEF1F5"/>
  <text x="840" y="440" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">What happens next?</text>

  <!-- FOOTER -->
  <rect x="0" y="472" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="496" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.3 · SOAP Notes &amp; Clinical Documentation · Beginner Framework</text>

</svg>
