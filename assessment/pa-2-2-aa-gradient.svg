<svg viewBox="0 0 960 438" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="500" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">THE A-a GRADIENT — WHERE IS THE PROBLEM?</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.2  ·  A-a = PAO₂ − PaO₂  ·  Normal &lt;15 mmHg  ·  PINPOINTS WHETHER HYPOXEMIA IS INSIDE OR OUTSIDE THE LUNGS</text>

  <!-- Formula bar -->
  <rect x="8" y="70" width="944" height="44" rx="8" fill="#0B1F33"/>
  <text x="480" y="88" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">PAO₂ = (P</text>
  <text x="480" y="88" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">PAO₂ = (PB − 47) × FiO₂ − (PaCO₂ ÷ 0.8)     →     A-a Gradient = PAO₂ − PaO₂</text>
  <text x="480" y="105" text-anchor="middle" fill="#1CA7A8" font-size="11">At sea level on room air: PAO₂ ≈ (760 − 47) × 0.21 − (PaCO₂ ÷ 0.8) = 713 × 0.21 − (PaCO₂ ÷ 0.8)</text>

  <!-- ===== LEFT PANEL: Small A-a gradient ===== -->
  <rect x="8" y="122" width="464" height="260" rx="12" fill="#FFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <rect x="8" y="122" width="464" height="42" rx="12" fill="#1CA7A8"/>
  <rect x="8" y="150" width="464" height="14" fill="#1CA7A8"/>
  <text x="240" y="150" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">SMALL A-a GRADIENT (&lt;15 mmHg)</text>

  <!-- Alveolus diagram: simple circle + capillary -->
  <!-- Alveolus circle -->
  <circle cx="130" cy="230" r="56" fill="#E6F3FF" stroke="#4BA3F2" stroke-width="2"/>
  <text x="130" y="222" text-anchor="middle" fill="#1A5EA8" font-size="11" font-weight="700">PAO₂</text>
  <text x="130" y="240" text-anchor="middle" fill="#1A5EA8" font-size="18" font-weight="800">60</text>
  <text x="130" y="254" text-anchor="middle" fill="#1A5EA8" font-size="10">mmHg (low)</text>
  <!-- Capillary below -->
  <rect x="80" y="296" width="100" height="36" rx="10" fill="#4BA3F2"/>
  <text x="130" y="310" text-anchor="middle" fill="#FFF" font-size="10" font-weight="700">PaO₂</text>
  <text x="130" y="325" text-anchor="middle" fill="#FFF" font-size="13" font-weight="800">56</text>
  <!-- Diffusion arrow -->
  <line x1="130" y1="287" x2="130" y2="296" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#arrDown1)"/>
  <defs><marker id="arrDown1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#1CA7A8"/></marker></defs>
  <!-- Gradient callout -->
  <rect x="80" y="340" width="100" height="30" rx="6" fill="#DDF7F2"/>
  <text x="130" y="358" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Gradient = 4</text>

  <!-- Explanation text -->
  <text x="210" y="178" fill="#0B7F80" font-size="12" font-weight="700">Problem is OUTSIDE the lungs</text>
  <text x="210" y="196" fill="#415A77" font-size="11">Alveolar PO₂ is low → arterial PO₂</text>
  <text x="210" y="211" fill="#415A77" font-size="11">is low too — but the transfer</text>
  <text x="210" y="226" fill="#415A77" font-size="11">across the membrane is NORMAL.</text>
  <text x="210" y="246" fill="#0B1F33" font-size="11" font-weight="700">Causes:</text>
  <text x="210" y="261" fill="#415A77" font-size="11">· Hypoventilation</text>
  <text x="210" y="276" fill="#415A77" font-size="11">· High altitude / Low FiO₂</text>
  <text x="210" y="291" fill="#415A77" font-size="11">· Neuromuscular weakness</text>
  <rect x="210" y="308" width="248" height="46" rx="7" fill="#DDF7F2"/>
  <text x="334" y="326" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Treatment:</text>
  <text x="334" y="342" text-anchor="middle" fill="#0B7F80" font-size="11">Fix ventilation or ↑ FiO₂.</text>
  <text x="334" y="356" text-anchor="middle" fill="#0B7F80" font-size="10">The lungs themselves are not the problem.</text>

  <!-- ===== RIGHT PANEL: Large A-a gradient ===== -->
  <rect x="488" y="122" width="464" height="260" rx="12" fill="#FFF" stroke="#E85D5D" stroke-width="2.5"/>
  <rect x="488" y="122" width="464" height="42" rx="12" fill="#E85D5D"/>
  <rect x="488" y="150" width="464" height="14" fill="#E85D5D"/>
  <text x="720" y="150" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">LARGE A-a GRADIENT (&gt;15 mmHg)</text>

  <!-- Alveolus circle (normal PaO2 inside) -->
  <circle cx="610" cy="230" r="56" fill="#E6F3FF" stroke="#4BA3F2" stroke-width="2"/>
  <text x="610" y="222" text-anchor="middle" fill="#1A5EA8" font-size="11" font-weight="700">PAO₂</text>
  <text x="610" y="240" text-anchor="middle" fill="#1A5EA8" font-size="18" font-weight="800">100</text>
  <text x="610" y="254" text-anchor="middle" fill="#1A5EA8" font-size="10">mmHg (normal)</text>
  <!-- Thickened membrane indicator -->
  <ellipse cx="610" cy="290" rx="42" ry="8" fill="#E85D5D" opacity="0.4"/>
  <text x="610" y="294" text-anchor="middle" fill="#C0392B" font-size="8" font-weight="700">✗ membrane barrier</text>
  <!-- Capillary below -->
  <rect x="560" y="300" width="100" height="36" rx="10" fill="#E85D5D"/>
  <text x="610" y="314" text-anchor="middle" fill="#FFF" font-size="10" font-weight="700">PaO₂</text>
  <text x="610" y="329" text-anchor="middle" fill="#FFF" font-size="13" font-weight="800">56</text>
  <!-- Gap callout -->
  <rect x="560" y="344" width="100" height="30" rx="6" fill="#FDE9E9"/>
  <text x="610" y="362" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Gradient = 44</text>

  <!-- Explanation text -->
  <text x="690" y="178" fill="#C0392B" font-size="12" font-weight="700">Problem is INSIDE the lungs</text>
  <text x="690" y="196" fill="#415A77" font-size="11">Alveolar PO₂ is adequate, but</text>
  <text x="690" y="211" fill="#415A77" font-size="11">blood is not picking it up</text>
  <text x="690" y="226" fill="#415A77" font-size="11">efficiently. The lung is failing.</text>
  <text x="690" y="246" fill="#0B1F33" font-size="11" font-weight="700">Causes:</text>
  <text x="690" y="261" fill="#415A77" font-size="11">· V/Q Mismatch (PE, COPD)</text>
  <text x="690" y="276" fill="#415A77" font-size="11">· Diffusion impairment (fibrosis)</text>
  <text x="690" y="291" fill="#415A77" font-size="11">· Shunting (ARDS, pneumonia)</text>
  <rect x="690" y="308" width="248" height="46" rx="7" fill="#FDE9E9"/>
  <text x="814" y="326" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Treatment:</text>
  <text x="814" y="342" text-anchor="middle" fill="#C0392B" font-size="11">Treat the underlying lung disease.</text>
  <text x="814" y="356" text-anchor="middle" fill="#C0392B" font-size="10">PEEP, antibiotics, diuretics, positioning.</text>

  <rect x="0" y="398" width="960" height="36" fill="#0B1F33"/>
  <text x="480" y="421" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.2 · A-a Gradient · Small = problem outside lungs · Large = problem inside lungs · Normal &lt;15 mmHg</text>
</svg>
