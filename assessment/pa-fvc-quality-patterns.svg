<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <!-- Good arrow marker -->
    <marker id="axisArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#415A77"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="500" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">FVC QUALITY PATTERNS: WHAT TO LOOK FOR</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.4  ·  VOLUME–TIME CURVES  ·  RECOGNIZE PROBLEM → EXPLAIN → DEMONSTRATE → REPEAT</text>

  <!-- ================================================================ -->
  <!-- FOUR PANELS, each 240px wide -->
  <!-- Panel 1: x=0,   Panel 2: x=240, Panel 3: x=480, Panel 4: x=720 -->
  <!-- Plot area per panel: x_offset+16 to x_offset+224, y=175 to y=330 -->
  <!-- ================================================================ -->

  <!-- ============= PANEL 1: GOOD EFFORT ============= -->
  <rect x="0" y="68" width="240" height="388" fill="#FFFFFF" stroke="#86D9C8" stroke-width="2.5"/>
  <!-- Color top band -->
  <rect x="0" y="68" width="240" height="52" rx="0" fill="#1CA7A8"/>
  <text x="120" y="98" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">GOOD EFFORT</text>
  <text x="120" y="115" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">Acceptable maneuver</text>

  <!-- Plot background -->
  <rect x="14" y="136" width="212" height="162" rx="6" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="30" y1="284" x2="218" y2="284" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Y-axis -->
  <line x1="30" y1="284" x2="30" y2="148" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Axis labels -->
  <text x="120" y="298" text-anchor="middle" fill="#415A77" font-size="9">Time (seconds)</text>
  <text x="20" y="220" text-anchor="middle" fill="#415A77" font-size="9" transform="rotate(-90,14,220)">Volume</text>

  <!-- GOOD EFFORT CURVE: rapid rise, smooth plateau -->
  <path d="M 30,284 Q 50,210 70,175 Q 100,163 160,160 Q 195,160 218,160"
        stroke="#1CA7A8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Description -->
  <rect x="14" y="308" width="212" height="42" rx="6" fill="#DDF7F2"/>
  <text x="120" y="325" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Rapid rise, smooth plateau</text>
  <text x="120" y="341" text-anchor="middle" fill="#0B7F80" font-size="10">Strong start, maintained effort</text>

  <!-- What RT does -->
  <rect x="14" y="360" width="212" height="88" rx="6" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <text x="120" y="378" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">RT Action:</text>
  <text x="120" y="394" text-anchor="middle" fill="#415A77" font-size="10">Confirm acceptable maneuver.</text>
  <text x="120" y="410" text-anchor="middle" fill="#415A77" font-size="10">Review result and repeat per</text>
  <text x="120" y="426" text-anchor="middle" fill="#415A77" font-size="10">protocol (usually 3 attempts).</text>
  <rect x="60" y="436" width="120" height="14" rx="4" fill="#DDF7F2"/>
  <text x="120" y="447" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">VALID ✓</text>

  <!-- PANEL DIVIDER -->
  <rect x="240" y="68" width="1.5" height="388" fill="#D7E6EF"/>

  <!-- ============= PANEL 2: HESITATION ============= -->
  <rect x="240" y="68" width="240" height="388" fill="#FFFFFF" stroke="#F8D9A5" stroke-width="2.5"/>
  <rect x="240" y="68" width="240" height="52" rx="0" fill="#F4B860"/>
  <text x="360" y="98" text-anchor="middle" fill="#0B1F33" font-size="15" font-weight="700">HESITATION</text>
  <text x="360" y="115" text-anchor="middle" fill="rgba(0,0,0,0.6)" font-size="11">Slow or delayed start</text>

  <!-- Plot background -->
  <rect x="254" y="136" width="212" height="162" rx="6" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="270" y1="284" x2="458" y2="284" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Y-axis -->
  <line x1="270" y1="284" x2="270" y2="148" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Axis labels -->
  <text x="360" y="298" text-anchor="middle" fill="#415A77" font-size="9">Time (seconds)</text>
  <text x="260" y="220" text-anchor="middle" fill="#415A77" font-size="9" transform="rotate(-90,254,220)">Volume</text>

  <!-- HESITATION CURVE: flat at start, then rises late -->
  <!-- Good reference (dashed) -->
  <path d="M 270,284 Q 290,210 310,175 Q 340,163 400,160 Q 435,160 458,160"
        stroke="#D7E6EF" stroke-width="1.5" fill="none" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- Actual hesitation curve: slow ramp, delayed peak -->
  <path d="M 270,284 L 285,280 Q 298,270 308,255 Q 322,228 338,195 Q 355,170 375,163 Q 410,160 458,160"
        stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Problem indicator -->
  <circle cx="290" cy="279" r="8" fill="none" stroke="#E85D5D" stroke-width="2"/>
  <text x="290" y="270" text-anchor="middle" fill="#E85D5D" font-size="9" font-weight="700">!</text>

  <!-- Description -->
  <rect x="254" y="308" width="212" height="42" rx="6" fill="#FFF4DF"/>
  <text x="360" y="325" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">Flat start, late rise</text>
  <text x="360" y="341" text-anchor="middle" fill="#7A4B00" font-size="10">Effort didn't start immediately</text>

  <!-- What RT does -->
  <rect x="254" y="360" width="212" height="88" rx="6" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <text x="360" y="378" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">RT Action:</text>
  <text x="360" y="394" text-anchor="middle" fill="#415A77" font-size="10">"Blast out right away — the</text>
  <text x="360" y="410" text-anchor="middle" fill="#415A77" font-size="10">moment you seal, go hard."</text>
  <text x="360" y="426" text-anchor="middle" fill="#415A77" font-size="10">Demonstrate again and repeat.</text>
  <rect x="300" y="436" width="120" height="14" rx="4" fill="#FFF4DF"/>
  <text x="360" y="447" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">REPEAT NEEDED</text>

  <!-- PANEL DIVIDER -->
  <rect x="480" y="68" width="1.5" height="388" fill="#D7E6EF"/>

  <!-- ============= PANEL 3: EARLY TERMINATION ============= -->
  <rect x="480" y="68" width="240" height="388" fill="#FFFFFF" stroke="#F2B5B5" stroke-width="2.5"/>
  <rect x="480" y="68" width="240" height="52" rx="0" fill="#E85D5D"/>
  <text x="600" y="98" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">EARLY STOP</text>
  <text x="600" y="115" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">Patient stops too soon</text>

  <!-- Plot background -->
  <rect x="494" y="136" width="212" height="162" rx="6" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="510" y1="284" x2="698" y2="284" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Y-axis -->
  <line x1="510" y1="284" x2="510" y2="148" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Axis labels -->
  <text x="600" y="298" text-anchor="middle" fill="#415A77" font-size="9">Time (seconds)</text>
  <text x="500" y="220" text-anchor="middle" fill="#415A77" font-size="9" transform="rotate(-90,494,220)">Volume</text>

  <!-- Target (dashed line showing where it should reach) -->
  <line x1="510" y1="160" x2="698" y2="160" stroke="#1CA7A8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="615" y="157" text-anchor="middle" fill="#1CA7A8" font-size="8" font-weight="700">should reach here</text>

  <!-- EARLY STOP CURVE: rises then plateaus LOW, then drops sharply -->
  <path d="M 510,284 Q 530,215 550,192 Q 566,190 590,190 L 610,190 L 618,284"
        stroke="#E85D5D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gap indicator -->
  <rect x="612" y="160" width="2" height="30" fill="#E85D5D" stroke="none"/>
  <path d="M 604,160 L 628,160" stroke="#E85D5D" stroke-width="1.5"/>
  <path d="M 604,190 L 628,190" stroke="#E85D5D" stroke-width="1.5"/>
  <text x="640" y="178" fill="#E85D5D" font-size="9" font-weight="700">gap</text>

  <!-- Description -->
  <rect x="494" y="308" width="212" height="42" rx="6" fill="#FDE9E9"/>
  <text x="600" y="325" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Stops before lungs empty</text>
  <text x="600" y="341" text-anchor="middle" fill="#C0392B" font-size="10">Curve levels too early, then drops</text>

  <!-- What RT does -->
  <rect x="494" y="360" width="212" height="88" rx="6" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <text x="600" y="378" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">RT Action:</text>
  <text x="600" y="394" text-anchor="middle" fill="#415A77" font-size="10">"Keep going, keep going —</text>
  <text x="600" y="410" text-anchor="middle" fill="#415A77" font-size="10">all the way out until empty."</text>
  <text x="600" y="426" text-anchor="middle" fill="#415A77" font-size="10">Understimates true FVC.</text>
  <rect x="540" y="436" width="120" height="14" rx="4" fill="#FDE9E9"/>
  <text x="600" y="447" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">UNDERESTIMATES FVC</text>

  <!-- PANEL DIVIDER -->
  <rect x="720" y="68" width="1.5" height="388" fill="#D7E6EF"/>

  <!-- ============= PANEL 4: COUGH / LEAK ============= -->
  <rect x="720" y="68" width="240" height="388" fill="#FFFFFF" stroke="#C5D4E8" stroke-width="2.5"/>
  <rect x="720" y="68" width="240" height="52" rx="0" fill="#415A77"/>
  <text x="840" y="98" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">COUGH / LEAK</text>
  <text x="840" y="115" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">Artifact in the curve</text>

  <!-- Plot background -->
  <rect x="734" y="136" width="212" height="162" rx="6" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="750" y1="284" x2="938" y2="284" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Y-axis -->
  <line x1="750" y1="284" x2="750" y2="148" stroke="#415A77" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <!-- Axis labels -->
  <text x="840" y="298" text-anchor="middle" fill="#415A77" font-size="9">Time (seconds)</text>
  <text x="740" y="220" text-anchor="middle" fill="#415A77" font-size="9" transform="rotate(-90,734,220)">Volume</text>

  <!-- COUGH CURVE: rises then has a spike/notch artifact -->
  <path d="M 750,284 Q 770,210 790,175 Q 805,163 818,162 L 825,170 L 830,155 L 835,167 Q 860,162 938,160"
        stroke="#415A77" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cough artifact circle -->
  <circle cx="827" cy="162" r="10" fill="none" stroke="#E85D5D" stroke-width="2"/>
  <text x="827" y="153" text-anchor="middle" fill="#E85D5D" font-size="8" font-weight="700">cough</text>

  <!-- Description -->
  <rect x="734" y="308" width="212" height="42" rx="6" fill="#EEF1F5"/>
  <text x="840" y="325" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">Spike or notch in curve</text>
  <text x="840" y="341" text-anchor="middle" fill="#243b55" font-size="10">Cough or air leak artifact</text>

  <!-- What RT does -->
  <rect x="734" y="360" width="212" height="88" rx="6" fill="#F4FAFC" stroke="#D7E6EF" stroke-width="1"/>
  <text x="840" y="378" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">RT Action:</text>
  <text x="840" y="394" text-anchor="middle" fill="#415A77" font-size="10">For cough: wait and repeat</text>
  <text x="840" y="410" text-anchor="middle" fill="#415A77" font-size="10">when patient is ready.</text>
  <text x="840" y="426" text-anchor="middle" fill="#415A77" font-size="10">For leak: check mouthpiece seal.</text>
  <rect x="780" y="436" width="120" height="14" rx="4" fill="#EEF1F5"/>
  <text x="840" y="447" text-anchor="middle" fill="#243b55" font-size="9" font-weight="700">ASSESS AND REPEAT</text>

  <!-- FOOTER -->
  <rect x="0" y="456" width="960" height="44" fill="#0B1F33"/>
  <text x="480" y="474" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700">Quality rule: Explain the problem → Demonstrate the fix → Repeat when safe.</text>
  <text x="480" y="492" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">PulmoCore · PA 1.4 · FVC Quality Patterns · Volume–Time Curve Recognition</text>

</svg>
