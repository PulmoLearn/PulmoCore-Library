<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="540" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">CHART REVIEW: EXTRACTING RESPIRATORY DATA</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.3  ·  PULMOCORE  ·  IDENTIFY KEY RESPIRATORY INFORMATION BEFORE ENTERING THE ROOM</text>

  <!-- EHR SCREEN BEZEL -->
  <rect x="10" y="70" width="940" height="450" rx="12" fill="#1A2F45" stroke="#0B1F33" stroke-width="2"/>

  <!-- SCREEN TOP BAR (patient info) -->
  <rect x="10" y="70" width="940" height="44" rx="12" fill="#102A43"/>
  <rect x="10" y="98" width="940" height="16" fill="#102A43"/>
  <!-- Patient identifiers -->
  <text x="30" y="98" fill="rgba(255,255,255,0.9)" font-size="12" font-weight="700">Patient: [Room 412]</text>
  <text x="210" y="98" fill="rgba(255,255,255,0.6)" font-size="12">DOB: 19XX</text>
  <text x="320" y="98" fill="rgba(255,255,255,0.6)" font-size="12">Adm: Shortness of breath</text>
  <text x="580" y="98" fill="rgba(255,255,255,0.6)" font-size="12">Attending: Dr. [Provider]</text>
  <text x="820" y="98" fill="#1CA7A8" font-size="12" font-weight="700">RT Active Order ✓</text>

  <!-- SCREEN CONTENT AREA background -->
  <rect x="10" y="114" width="940" height="406" fill="#F8FBFD" rx="0"/>

  <!-- ================================================================ -->
  <!-- TOP-LEFT: PATIENT HISTORY / DIAGNOSIS (x=18, y=122, w=454, h=180) -->
  <!-- ================================================================ -->
  <rect x="18" y="122" width="454" height="182" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <!-- Section title -->
  <rect x="18" y="122" width="454" height="34" rx="8" fill="#0B1F33"/>
  <rect x="18" y="138" width="454" height="18" fill="#0B1F33"/>
  <text x="30" y="145" fill="#FFFFFF" font-size="12" font-weight="700">HISTORY &amp; DIAGNOSIS</text>

  <!-- Data items -->
  <text x="30" y="172" fill="#415A77" font-size="11">Admission Dx:</text>
  <text x="130" y="172" fill="#0B1F33" font-size="11" font-weight="700">Acute exacerbation of COPD</text>
  <!-- RT Badge -->
  <rect x="392" y="162" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="425" y="174" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT NOTE</text>

  <text x="30" y="194" fill="#415A77" font-size="11">Chief Complaint:</text>
  <text x="138" y="194" fill="#0B1F33" font-size="11">"Short of breath for 3 days, worse today."</text>

  <text x="30" y="214" fill="#415A77" font-size="11">PMH:</text>
  <text x="72" y="214" fill="#0B1F33" font-size="11">COPD, HTN, 30 pack-year smoking history</text>
  <rect x="392" y="204" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="425" y="216" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT NOTE</text>

  <text x="30" y="234" fill="#415A77" font-size="11">Allergies:</text>
  <text x="92" y="234" fill="#E85D5D" font-size="11" font-weight="700">Penicillin (rash)</text>
  <rect x="392" y="224" width="66" height="16" rx="4" fill="#FDE9E9"/>
  <text x="425" y="236" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">ALLERGY ⚠</text>

  <text x="30" y="254" fill="#415A77" font-size="11">Smoking Hx:</text>
  <text x="106" y="254" fill="#0B1F33" font-size="11">30 pack-years. Quit 5 years ago.</text>
  <rect x="392" y="244" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="425" y="256" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT NOTE</text>

  <text x="30" y="276" fill="#415A77" font-size="11">Social Hx:</text>
  <text x="92" y="276" fill="#0B1F33" font-size="11">Lives alone. Denies alcohol use.</text>
  <rect x="18" y="290" width="454" height="14" rx="0" fill="#F4FAFC" stroke="none"/>

  <!-- ================================================================ -->
  <!-- TOP-RIGHT: VITAL SIGNS (x=490, y=122, w=452, h=180) -->
  <!-- ================================================================ -->
  <rect x="490" y="122" width="452" height="182" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="490" y="122" width="452" height="34" rx="8" fill="#0B1F33"/>
  <rect x="490" y="138" width="452" height="18" fill="#0B1F33"/>
  <text x="502" y="145" fill="#FFFFFF" font-size="12" font-weight="700">VITAL SIGNS  (Most Recent)</text>

  <!-- Vitals grid - 2 columns -->
  <!-- Col 1 -->
  <text x="502" y="172" fill="#415A77" font-size="11">RR:</text>
  <text x="530" y="172" fill="#E85D5D" font-size="13" font-weight="700">28 / min</text>
  <rect x="620" y="162" width="66" height="16" rx="4" fill="#FDE9E9"/>
  <text x="653" y="174" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">ELEVATED ⚠</text>

  <text x="502" y="196" fill="#415A77" font-size="11">SpO₂:</text>
  <text x="540" y="196" fill="#E85D5D" font-size="13" font-weight="700">88% on RA</text>
  <rect x="620" y="186" width="66" height="16" rx="4" fill="#FDE9E9"/>
  <text x="653" y="198" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">LOW ⚠</text>

  <text x="502" y="220" fill="#415A77" font-size="11">HR:</text>
  <text x="530" y="220" fill="#F4B860" font-size="13" font-weight="700">108 / min</text>
  <rect x="620" y="210" width="66" height="16" rx="4" fill="#FFF4DF"/>
  <text x="653" y="222" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">ELEVATED</text>

  <text x="502" y="244" fill="#415A77" font-size="11">BP:</text>
  <text x="530" y="244" fill="#0B1F33" font-size="13" font-weight="700">138/84 mmHg</text>

  <text x="502" y="268" fill="#415A77" font-size="11">Temp:</text>
  <text x="548" y="268" fill="#0B1F33" font-size="13" font-weight="700">37.4°C</text>

  <!-- Col 2 -->
  <text x="710" y="172" fill="#415A77" font-size="11">O₂ Device:</text>
  <text x="784" y="172" fill="#1CA7A8" font-size="12" font-weight="700">2 L NC</text>
  <rect x="840" y="162" width="78" height="16" rx="4" fill="#DDF7F2"/>
  <text x="879" y="174" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">CHECK ORDER</text>

  <text x="710" y="196" fill="#415A77" font-size="11">SpO₂ goal:</text>
  <text x="784" y="196" fill="#0B1F33" font-size="12">88–92%</text>

  <text x="710" y="220" fill="#415A77" font-size="11">Last RR:</text>
  <text x="784" y="220" fill="#0B1F33" font-size="12">30 min ago</text>

  <text x="710" y="244" fill="#415A77" font-size="11">Trending:</text>
  <text x="784" y="244" fill="#E85D5D" font-size="12" font-weight="700">↑ RR over 2 hrs</text>

  <!-- ================================================================ -->
  <!-- BOTTOM-LEFT: RESPIRATORY ORDERS (x=18, y=314, w=454, h=192) -->
  <!-- ================================================================ -->
  <rect x="18" y="314" width="454" height="192" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="18" y="314" width="454" height="34" rx="8" fill="#1CA7A8"/>
  <rect x="18" y="330" width="454" height="18" fill="#1CA7A8"/>
  <text x="30" y="337" fill="#FFFFFF" font-size="12" font-weight="700">RESPIRATORY ORDERS</text>

  <text x="30" y="366" fill="#415A77" font-size="11">Order:</text>
  <text x="72" y="366" fill="#0B1F33" font-size="11" font-weight="700">Albuterol 2.5 mg neb q4h and PRN</text>
  <rect x="382" y="356" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="415" y="368" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT ACTION</text>

  <text x="30" y="388" fill="#415A77" font-size="11">Order:</text>
  <text x="72" y="388" fill="#0B1F33" font-size="11" font-weight="700">O₂ titrate to SpO₂ 88–92%</text>
  <rect x="382" y="378" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="415" y="390" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT ACTION</text>

  <text x="30" y="410" fill="#415A77" font-size="11">Last Tx:</text>
  <text x="80" y="410" fill="#0B1F33" font-size="11">Albuterol given at 06:00 (4 hrs ago)</text>
  <rect x="382" y="400" width="66" height="16" rx="4" fill="#FFF4DF"/>
  <text x="415" y="412" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">DUE NOW</text>

  <text x="30" y="432" fill="#415A77" font-size="11">RT Note:</text>
  <text x="84" y="432" fill="#0B1F33" font-size="11">See previous RT flowsheet for response.</text>

  <text x="30" y="454" fill="#415A77" font-size="11">Provider:</text>
  <text x="86" y="454" fill="#0B1F33" font-size="11">Notified if SpO₂ drops below 86%</text>
  <rect x="382" y="444" width="66" height="16" rx="4" fill="#DDF7F2"/>
  <text x="415" y="456" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RT AWARE</text>

  <!-- ================================================================ -->
  <!-- BOTTOM-RIGHT: MEDICATIONS & CHART DATA (x=490, y=314, w=452, h=192) -->
  <!-- ================================================================ -->
  <rect x="490" y="314" width="452" height="192" rx="8" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="490" y="314" width="452" height="34" rx="8" fill="#4BA3F2"/>
  <rect x="490" y="330" width="452" height="18" fill="#4BA3F2"/>
  <text x="502" y="337" fill="#FFFFFF" font-size="12" font-weight="700">MEDICATIONS &amp; CHART DATA</text>

  <!-- Meds column 1 -->
  <text x="502" y="366" fill="#0B1F33" font-size="11" font-weight="700">Active Medications:</text>
  <circle cx="508" cy="384" r="3" fill="#4BA3F2"/>
  <text x="518" y="389" fill="#415A77" font-size="11">Albuterol MDI (home)</text>
  <rect x="648" y="379" width="66" height="16" rx="4" fill="#E6F3FF"/>
  <text x="681" y="391" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">RECONCILE</text>

  <circle cx="508" cy="405" r="3" fill="#4BA3F2"/>
  <text x="518" y="410" fill="#415A77" font-size="11">Tiotropium (home)</text>
  <rect x="648" y="400" width="66" height="16" rx="4" fill="#E6F3FF"/>
  <text x="681" y="412" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">RECONCILE</text>

  <circle cx="508" cy="425" r="3" fill="#4BA3F2"/>
  <text x="518" y="430" fill="#415A77" font-size="11">Prednisone 40 mg daily (new)</text>

  <circle cx="508" cy="445" r="3" fill="#4BA3F2"/>
  <text x="518" y="450" fill="#415A77" font-size="11">Lisinopril (HTN)</text>

  <!-- Chart data column 2 -->
  <text x="740" y="366" fill="#0B1F33" font-size="11" font-weight="700">Chart Data:</text>
  <text x="740" y="384" fill="#415A77" font-size="11">CXR: hyperinflation noted</text>
  <rect x="880" y="374" width="48" height="16" rx="4" fill="#E6F3FF"/>
  <text x="904" y="386" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">RT NOTE</text>

  <text x="740" y="404" fill="#415A77" font-size="11">ABG: pending results</text>
  <text x="740" y="424" fill="#415A77" font-size="11">PFTs: FEV₁/FVC 0.52</text>
  <rect x="880" y="414" width="48" height="16" rx="4" fill="#E6F3FF"/>
  <text x="904" y="426" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">RT NOTE</text>

  <text x="740" y="444" fill="#415A77" font-size="11">MAR: last Albuterol 06:00</text>
  <rect x="880" y="434" width="48" height="16" rx="4" fill="#FFF4DF"/>
  <text x="904" y="446" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">DUE</text>

  <text x="740" y="464" fill="#415A77" font-size="11">Precautions: Standard</text>

  <!-- FOOTER -->
  <rect x="0" y="502" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="518" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700">Review chart before entering the room — orders, allergies, O₂ goal, and last treatment are all RT priorities.</text>
  <text x="480" y="533" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">PulmoCore · PA 1.3 · Chart Review &amp; Data Extraction</text>

</svg>
