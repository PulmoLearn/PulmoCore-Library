<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="460" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">WHAT IS FORCED VITAL CAPACITY (FVC)?</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.4  ·  PULMOCORE  ·  FVC = COACHED MAXIMAL EFFORT, NOT A NORMAL BREATH</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: Action Sequence (dark, x=0-500) -->
  <!-- ============================================================ -->
  <rect x="0" y="62" width="500" height="360" fill="#0B1F33"/>

  <!-- Step 1: Deep Inhalation -->
  <rect x="14" y="78" width="228" height="158" rx="10" fill="#102A43" stroke="#1CA7A8" stroke-width="1.5"/>
  <!-- Step badge -->
  <circle cx="36" cy="78" r="14" fill="#1CA7A8"/>
  <text x="36" y="83" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
  <text x="128" y="106" text-anchor="middle" fill="#1CA7A8" font-size="13" font-weight="700">DEEPEST BREATH IN</text>
  <!-- Lungs inhaling - two rounded shapes expanding -->
  <ellipse cx="100" cy="175" rx="34" ry="42" fill="none" stroke="#4BA3F2" stroke-width="2.5"/>
  <ellipse cx="156" cy="175" rx="34" ry="42" fill="none" stroke="#4BA3F2" stroke-width="2.5"/>
  <!-- Airway -->
  <path d="M 128,133 L 128,148" stroke="#4BA3F2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 128,148 Q 110,152 100,157" stroke="#4BA3F2" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 128,148 Q 146,152 156,157" stroke="#4BA3F2" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Inhale arrows -->
  <path d="M 128,118 L 128,128" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#downArr)" stroke-linecap="round"/>
  <text x="128" y="116" text-anchor="middle" fill="#1CA7A8" font-size="10" font-weight="600">inhale</text>
  <!-- "Max" label -->
  <rect x="100" y="217" width="56" height="16" rx="4" fill="#1CA7A8" opacity="0.2"/>
  <text x="128" y="229" text-anchor="middle" fill="#1CA7A8" font-size="9" font-weight="700">MAXIMUM</text>

  <!-- Step 2: Seal + Blast -->
  <rect x="258" y="78" width="228" height="158" rx="10" fill="#102A43" stroke="#4BA3F2" stroke-width="1.5"/>
  <circle cx="280" cy="78" r="14" fill="#4BA3F2"/>
  <text x="280" y="83" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">2</text>
  <text x="372" y="106" text-anchor="middle" fill="#4BA3F2" font-size="13" font-weight="700">SEAL + BLAST OUT</text>
  <!-- Mouth/mouthpiece  -->
  <ellipse cx="344" cy="175" rx="38" ry="44" fill="none" stroke="#4BA3F2" stroke-width="2.5"/>
  <ellipse cx="400" cy="175" rx="38" ry="44" fill="none" stroke="#4BA3F2" stroke-width="2.5"/>
  <!-- Airway + mouthpiece -->
  <path d="M 372,131 L 372,148" stroke="#4BA3F2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 372,148 Q 354,152 344,158" stroke="#4BA3F2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 372,148 Q 390,152 400,158" stroke="#4BA3F2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Mouthpiece tube pointing right -->
  <rect x="420" y="169" width="50" height="12" rx="4" fill="#1CA7A8"/>
  <!-- Exhale arrows going right -->
  <path d="M 472,175 L 488,175" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#rightArr)" stroke-linecap="round"/>
  <text x="454" y="162" text-anchor="middle" fill="#1CA7A8" font-size="9" font-weight="700">BLAST</text>
  <text x="454" y="196" text-anchor="middle" fill="#1CA7A8" font-size="9" font-weight="700">OUT</text>

  <!-- Arrow between steps -->
  <path d="M 246,157 L 254,157" stroke="#1CA7A8" stroke-width="2.5" marker-end="url(#rightArr)"/>

  <!-- Bottom banner: keep going instruction -->
  <rect x="14" y="248" width="472" height="54" rx="8" fill="#1CA7A8" opacity="0.12" stroke="#1CA7A8" stroke-width="1.5"/>
  <text x="250" y="272" text-anchor="middle" fill="#1CA7A8" font-size="13" font-weight="700">"Keep blowing… keep going… keep going…"</text>
  <text x="250" y="292" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="11">Until the RT says stop — or lungs are empty</text>

  <!-- FVC definition box -->
  <rect x="14" y="316" width="472" height="92" rx="8" fill="#FFFFFF" opacity="0.06" stroke="#1CA7A8" stroke-width="1.5"/>
  <text x="250" y="344" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">FVC = Forced Vital Capacity</text>
  <text x="250" y="366" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="12">Total air exhaled after the deepest breath possible</text>
  <text x="250" y="386" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600">This is a MAXIMAL EFFORT test — not a normal breath</text>

  <defs>
    <marker id="downArr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M1,0 L4,7 L7,0 Z" fill="#1CA7A8"/>
    </marker>
    <marker id="rightArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1CA7A8"/>
    </marker>
  </defs>

  <!-- DIVIDER -->
  <rect x="500" y="62" width="1.5" height="360" fill="#C8DDE8"/>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Three key fact boxes -->
  <!-- ============================================================ -->

  <!-- Box 1: Plain Language -->
  <rect x="514" y="78" width="432" height="92" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="514" y="78" width="6" height="92" rx="3" fill="#1CA7A8"/>
  <text x="534" y="104" fill="#0B1F33" font-size="14" font-weight="700">Plain Language</text>
  <text x="534" y="124" fill="#415A77" font-size="12">"Take the deepest breath you can. Then blast the</text>
  <text x="534" y="141" fill="#415A77" font-size="12">air out as hard and long as possible."</text>
  <rect x="534" y="152" width="110" height="14" rx="4" fill="#DDF7F2"/>
  <text x="589" y="163" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">PATIENT INSTRUCTION</text>

  <!-- Box 2: What FVC Measures -->
  <rect x="514" y="182" width="432" height="92" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="514" y="182" width="6" height="92" rx="3" fill="#4BA3F2"/>
  <text x="534" y="208" fill="#0B1F33" font-size="14" font-weight="700">What FVC Measures</text>
  <text x="534" y="228" fill="#415A77" font-size="12">The total volume of air a patient can forcefully exhale</text>
  <text x="534" y="245" fill="#415A77" font-size="12">after a maximal inhalation. Measured in liters.</text>
  <rect x="534" y="256" width="130" height="14" rx="4" fill="#E6F3FF"/>
  <text x="599" y="267" text-anchor="middle" fill="#1A5EA8" font-size="9" font-weight="700">SPIROMETRY MEASUREMENT</text>

  <!-- Box 3: Why RTs Care -->
  <rect x="514" y="286" width="432" height="92" rx="10" fill="#FFFFFF" stroke="#D7E6EF" stroke-width="1.5"/>
  <rect x="514" y="286" width="6" height="92" rx="3" fill="#F4B860"/>
  <text x="534" y="312" fill="#0B1F33" font-size="14" font-weight="700">Why RTs Care</text>
  <text x="534" y="332" fill="#415A77" font-size="12">FVC helps evaluate lung volume, obstruction and</text>
  <text x="534" y="349" fill="#415A77" font-size="12">restriction patterns, and tells us if the effort was valid.</text>
  <rect x="534" y="360" width="100" height="14" rx="4" fill="#FFF4DF"/>
  <text x="584" y="371" text-anchor="middle" fill="#7A4B00" font-size="9" font-weight="700">CLINICAL PURPOSE</text>

  <!-- FOOTER -->
  <rect x="0" y="422" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="446" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 1.4 · Pulmonary Function Testing Basics · FVC Overview</text>

</svg>
