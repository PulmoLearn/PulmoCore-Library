<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="580" fill="#F4FAFC"/>
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700" letter-spacing="1.5">SPECIAL POPULATIONS — ADJUSTED ABG INTERPRETATION</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 2.1  ·  STANDARD ADULT NORMALS DO NOT APPLY TO ALL PATIENTS — KNOW WHO DIFFERS AND HOW</text>

  <!-- ============================================================ -->
  <!-- TOP-LEFT: Pregnancy (x=8, y=70, w=462, h=210) -->
  <!-- ============================================================ -->
  <rect x="8" y="70" width="462" height="210" rx="10" fill="#FFF" stroke="#F472B6" stroke-width="2.5"/>
  <!-- Header band -->
  <rect x="8" y="70" width="462" height="38" rx="10" fill="#F472B6"/>
  <rect x="8" y="95" width="462" height="13" fill="#F472B6"/>
  <text x="239" y="94" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Pregnancy — Physiological Hyperventilation</text>
  <!-- ABG tiles row -->
  <rect x="18" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="62" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">pH</text>
  <text x="62" y="152" text-anchor="middle" fill="#A3E6A0" font-size="17" font-weight="800">7.42</text>
  <text x="62" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Normal</text>
  <rect x="114" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="158" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaCO₂</text>
  <text x="158" y="152" text-anchor="middle" fill="#4BA3F2" font-size="17" font-weight="800">27–32</text>
  <text x="158" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Expected ↓</text>
  <rect x="210" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="254" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">HCO₃⁻</text>
  <text x="254" y="152" text-anchor="middle" fill="#4BA3F2" font-size="17" font-weight="800">18–21</text>
  <text x="254" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Expected ↓</text>
  <rect x="306" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="350" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="350" y="152" text-anchor="middle" fill="#A3E6A0" font-size="17" font-weight="800">100+</text>
  <text x="350" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Slightly ↑</text>
  <!-- Explanation text -->
  <text x="18" y="184" fill="#0B1F33" font-size="11" font-weight="700">Mechanism:</text>
  <text x="18" y="199" fill="#415A77" font-size="11">Progesterone stimulates respiratory center → chronic mild hyperventilation.</text>
  <text x="18" y="213" fill="#415A77" font-size="11">Kidneys compensate by excreting HCO₃⁻ → fully compensated, pH normal.</text>
  <!-- Key error box -->
  <rect x="18" y="222" width="442" height="50" rx="6" fill="#FDE9E9"/>
  <text x="239" y="239" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Key Error: Do NOT treat as "respiratory alkalosis"</text>
  <text x="239" y="255" text-anchor="middle" fill="#C0392B" font-size="11">This is their normal baseline — treat only if acutely worse than prior values</text>
  <text x="239" y="268" text-anchor="middle" fill="#C0392B" font-size="10">Progesterone effect persists throughout all three trimesters.</text>

  <!-- ============================================================ -->
  <!-- TOP-RIGHT: COPD (x=490, y=70, w=462, h=210) -->
  <!-- ============================================================ -->
  <rect x="490" y="70" width="462" height="210" rx="10" fill="#FFF" stroke="#F4B860" stroke-width="2.5"/>
  <rect x="490" y="70" width="462" height="38" rx="10" fill="#F4B860"/>
  <rect x="490" y="95" width="462" height="13" fill="#F4B860"/>
  <text x="721" y="94" text-anchor="middle" fill="#0B1F33" font-size="14" font-weight="700">Chronic Lung Disease (COPD) — Patient-Specific Baseline</text>
  <rect x="500" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="544" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">pH</text>
  <text x="544" y="152" text-anchor="middle" fill="#A3E6A0" font-size="17" font-weight="800">7.38</text>
  <text x="544" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Compensated</text>
  <rect x="596" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="640" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaCO₂</text>
  <text x="640" y="152" text-anchor="middle" fill="#E85D5D" font-size="17" font-weight="800">55–65</text>
  <text x="640" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Their normal</text>
  <rect x="692" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="736" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">HCO₃⁻</text>
  <text x="736" y="152" text-anchor="middle" fill="#A3E6A0" font-size="17" font-weight="800">34–40</text>
  <text x="736" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Renal comp.</text>
  <rect x="788" y="114" width="88" height="52" rx="8" fill="#0B1F33"/>
  <text x="832" y="133" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9" font-weight="700">PaO₂</text>
  <text x="832" y="152" text-anchor="middle" fill="#F4B860" font-size="17" font-weight="800">55–70</text>
  <text x="832" y="162" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">Acceptable</text>
  <text x="500" y="184" fill="#0B1F33" font-size="11" font-weight="700">Mechanism:</text>
  <text x="500" y="199" fill="#415A77" font-size="11">Chronic CO₂ retention → renal compensation → normalized pH. Each COPD patient</text>
  <text x="500" y="213" fill="#415A77" font-size="11">has their own "normal" — defined by prior stable ABGs, not population norms.</text>
  <rect x="500" y="222" width="442" height="50" rx="6" fill="#FFF4DF"/>
  <text x="721" y="239" text-anchor="middle" fill="#7A4B00" font-size="11" font-weight="700">Key Rule: ALWAYS compare to prior baseline ABGs</text>
  <text x="721" y="255" text-anchor="middle" fill="#7A4B00" font-size="11">PaCO₂ 65 + pH 7.38 = may be baseline ≠ acute failure.</text>
  <text x="721" y="269" text-anchor="middle" fill="#7A4B00" font-size="10">Only treat acute worsening beyond the documented baseline.</text>

  <!-- ============================================================ -->
  <!-- BOTTOM-LEFT: Elderly (x=8, y=296, w=462, h=228) -->
  <!-- ============================================================ -->
  <rect x="8" y="296" width="462" height="228" rx="10" fill="#FFF" stroke="#415A77" stroke-width="2.5"/>
  <!-- Header band -->
  <rect x="8" y="296" width="462" height="38" rx="10" fill="#415A77"/>
  <rect x="8" y="321" width="462" height="13" fill="#415A77"/>
  <text x="239" y="320" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Elderly Patients — Age-Adjusted PaO₂</text>
  <!-- Formula box (starts after header band, with gap) -->
  <rect x="18" y="340" width="442" height="60" rx="8" fill="#0B1F33"/>
  <text x="239" y="360" text-anchor="middle" fill="#1CA7A8" font-size="14" font-weight="700">Expected PaO₂ ≈ 100 − (0.33 × age)</text>
  <text x="239" y="378" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11">Example: 75-year-old → 100 − 24.75 = ~75 mmHg</text>
  <text x="239" y="394" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">This is NORMAL for them — not hypoxemia requiring intervention</text>
  <!-- Age comparison table -->
  <rect x="18" y="408" width="442" height="38" rx="6" fill="#EEF1F5"/>
  <text x="100" y="424" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">Age 50 → ~84 mmHg</text>
  <text x="239" y="424" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">Age 65 → ~79 mmHg</text>
  <text x="380" y="424" text-anchor="middle" fill="#243b55" font-size="11" font-weight="700">Age 80 → ~74 mmHg</text>
  <text x="100" y="440" text-anchor="middle" fill="#415A77" font-size="10">normal for age</text>
  <text x="239" y="440" text-anchor="middle" fill="#415A77" font-size="10">normal for age</text>
  <text x="380" y="440" text-anchor="middle" fill="#415A77" font-size="10">normal for age</text>
  <!-- Key error box -->
  <rect x="18" y="452" width="442" height="64" rx="6" fill="#FDE9E9"/>
  <text x="239" y="468" text-anchor="middle" fill="#C0392B" font-size="11" font-weight="700">Key Error: Treating age-adjusted normal PaO₂ as hypoxemia</text>
  <text x="239" y="483" text-anchor="middle" fill="#C0392B" font-size="11">Initiating supplemental O₂ unnecessarily may suppress hypoxic</text>
  <text x="239" y="498" text-anchor="middle" fill="#C0392B" font-size="11">respiratory drive. Apply the formula before treating.</text>
  <text x="239" y="512" text-anchor="middle" fill="#C0392B" font-size="10">Formula applies to healthy elderly; use clinical judgment in acute illness.</text>

  <!-- ============================================================ -->
  <!-- BOTTOM-RIGHT: Athletes (x=490, y=296, w=462, h=228) -->
  <!-- ============================================================ -->
  <rect x="490" y="296" width="462" height="228" rx="10" fill="#FFF" stroke="#1CA7A8" stroke-width="2.5"/>
  <!-- Header band -->
  <rect x="490" y="296" width="462" height="38" rx="10" fill="#1CA7A8"/>
  <rect x="490" y="321" width="462" height="13" fill="#1CA7A8"/>
  <text x="721" y="320" text-anchor="middle" fill="#FFF" font-size="14" font-weight="700">Endurance Athletes — Subtle Baseline Differences</text>
  <!-- Two info boxes side by side -->
  <rect x="500" y="340" width="212" height="66" rx="8" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="606" y="358" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">Resting Baseline:</text>
  <text x="606" y="374" text-anchor="middle" fill="#415A77" font-size="11">PaCO₂: 36–40 mmHg</text>
  <text x="606" y="390" text-anchor="middle" fill="#415A77" font-size="11">PaO₂: 95–105 mmHg</text>
  <rect x="722" y="340" width="220" height="66" rx="8" fill="#F8FBFD" stroke="#D7E6EF" stroke-width="1.5"/>
  <text x="832" y="358" text-anchor="middle" fill="#0B1F33" font-size="11" font-weight="700">Exercise-induced:</text>
  <text x="832" y="374" text-anchor="middle" fill="#415A77" font-size="11">PaO₂ may drop to 70–85</text>
  <text x="832" y="390" text-anchor="middle" fill="#415A77" font-size="11">at maximal exertion</text>
  <!-- Green mechanism box -->
  <rect x="500" y="414" width="442" height="102" rx="6" fill="#DDF7F2"/>
  <text x="721" y="432" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Mechanism:</text>
  <text x="721" y="447" text-anchor="middle" fill="#0B7F80" font-size="11">High VO₂max + efficient CO₂ clearance + enhanced respiratory</text>
  <text x="721" y="462" text-anchor="middle" fill="#0B7F80" font-size="11">muscle strength → subtly different resting ABG baseline.</text>
  <text x="721" y="479" text-anchor="middle" fill="#0B7F80" font-size="11" font-weight="700">Clinical note:</text>
  <text x="721" y="494" text-anchor="middle" fill="#0B7F80" font-size="11">Exercise-induced arterial hypoxemia (EIAH) — PaO₂ may drop</text>
  <text x="721" y="509" text-anchor="middle" fill="#0B7F80" font-size="11">to 70–85 at max exertion. Not pathological. Documented on exercise ABG.</text>

  <!-- FOOTER -->
  <rect x="0" y="540" width="960" height="38" fill="#0B1F33"/>
  <text x="480" y="564" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11">PulmoCore · PA 2.1 · Special Populations · Pregnancy / COPD / Elderly / Athletes — always contextualize the ABG</text>
</svg>
