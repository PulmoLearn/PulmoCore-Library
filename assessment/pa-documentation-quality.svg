<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="500" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">DOCUMENTATION QUALITY: WEAK vs. STRONG</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.3  ·  PULMOCORE  ·  SPECIFIC, OBJECTIVE NOTES SUPPORT BETTER CARE</text>

  <!-- PANEL LABELS -->
  <rect x="10" y="68" width="456" height="36" rx="8" fill="#E85D5D"/>
  <text x="238" y="91" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="1">WEAKER DOCUMENTATION</text>

  <rect x="494" y="68" width="456" height="36" rx="8" fill="#1CA7A8"/>
  <text x="722" y="91" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="1">STRONGER DOCUMENTATION</text>

  <!-- DIVIDER -->
  <rect x="473" y="68" width="14" height="390" rx="7" fill="#D7E6EF"/>

  <!-- ================================================================ -->
  <!-- WEAK EXAMPLES (left, x=10 to 467) -->
  <!-- ================================================================ -->

  <!-- Weak Example 1 -->
  <rect x="10" y="114" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="2"/>
  <rect x="10" y="114" width="6" height="74" rx="3" fill="#E85D5D"/>
  <text x="28" y="137" fill="#0B1F33" font-size="11" font-weight="700">Appearance / General Status</text>
  <rect x="370" y="118" width="82" height="18" rx="5" fill="#FDE9E9"/>
  <text x="411" y="131" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">TOO VAGUE</text>
  <text x="28" y="158" fill="#E85D5D" font-size="14" font-style="italic">"Patient looked bad."</text>
  <text x="28" y="178" fill="#415A77" font-size="10">No measurable data. Another clinician cannot act on this.</text>

  <!-- Weak Example 2 -->
  <rect x="10" y="198" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="2"/>
  <rect x="10" y="198" width="6" height="74" rx="3" fill="#E85D5D"/>
  <text x="28" y="221" fill="#0B1F33" font-size="11" font-weight="700">Treatment &amp; Response</text>
  <rect x="340" y="202" width="112" height="18" rx="5" fill="#FDE9E9"/>
  <text x="396" y="215" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">MISSING RESPONSE</text>
  <text x="28" y="242" fill="#E85D5D" font-size="14" font-style="italic">"Gave breathing treatment. Better."</text>
  <text x="28" y="262" fill="#415A77" font-size="10">No values, no specifics, no reassessment. What is "better"?</text>

  <!-- Weak Example 3 -->
  <rect x="10" y="282" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="2"/>
  <rect x="10" y="282" width="6" height="74" rx="3" fill="#E85D5D"/>
  <text x="28" y="305" fill="#0B1F33" font-size="11" font-weight="700">Breath Sound Documentation</text>
  <rect x="350" y="286" width="102" height="18" rx="5" fill="#FDE9E9"/>
  <text x="401" y="299" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">INCOMPLETE</text>
  <text x="28" y="326" fill="#E85D5D" font-size="14" font-style="italic">"Patient was wheezing."</text>
  <text x="28" y="346" fill="#415A77" font-size="10">Location? Bilateral or one-sided? Before or after treatment?</text>

  <!-- Weak Example 4 -->
  <rect x="10" y="366" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#FADADD" stroke-width="2"/>
  <rect x="10" y="366" width="6" height="74" rx="3" fill="#E85D5D"/>
  <text x="28" y="389" fill="#0B1F33" font-size="11" font-weight="700">Plan / Next Steps</text>
  <rect x="342" y="370" width="110" height="18" rx="5" fill="#FDE9E9"/>
  <text x="397" y="383" text-anchor="middle" fill="#C0392B" font-size="9" font-weight="700">NO REASSESSMENT</text>
  <text x="28" y="410" fill="#E85D5D" font-size="14" font-style="italic">"Will continue care."</text>
  <text x="28" y="430" fill="#415A77" font-size="10">No specific actions, timing, or follow-up plan documented.</text>

  <!-- ================================================================ -->
  <!-- STRONG EXAMPLES (right, x=494 to 950) -->
  <!-- ================================================================ -->

  <!-- Strong Example 1 -->
  <rect x="494" y="114" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#86D9C8" stroke-width="2"/>
  <rect x="494" y="114" width="6" height="74" rx="3" fill="#1CA7A8"/>
  <text x="512" y="137" fill="#0B1F33" font-size="11" font-weight="700">Appearance / General Status</text>
  <rect x="846" y="118" width="90" height="18" rx="5" fill="#DDF7F2"/>
  <text x="891" y="131" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">MEASURABLE ✓</text>
  <text x="512" y="155" fill="#128486" font-size="12" font-weight="700">"RR 32/min, accessory muscle use noted,</text>
  <text x="512" y="171" fill="#128486" font-size="12" font-weight="700">SpO₂ 87% on room air."</text>

  <!-- Strong Example 2 -->
  <rect x="494" y="198" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#86D9C8" stroke-width="2"/>
  <rect x="494" y="198" width="6" height="74" rx="3" fill="#1CA7A8"/>
  <text x="512" y="221" fill="#0B1F33" font-size="11" font-weight="700">Treatment &amp; Response</text>
  <rect x="836" y="202" width="100" height="18" rx="5" fill="#DDF7F2"/>
  <text x="886" y="215" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">RESPONSE NOTED ✓</text>
  <text x="512" y="239" fill="#128486" font-size="12" font-weight="700">"Albuterol neb given; SpO₂ improved</text>
  <text x="512" y="255" fill="#128486" font-size="12" font-weight="700">from 89% to 94% on 2 L NC."</text>

  <!-- Strong Example 3 -->
  <rect x="494" y="282" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#86D9C8" stroke-width="2"/>
  <rect x="494" y="282" width="6" height="74" rx="3" fill="#1CA7A8"/>
  <text x="512" y="305" fill="#0B1F33" font-size="11" font-weight="700">Breath Sound Documentation</text>
  <rect x="836" y="286" width="100" height="18" rx="5" fill="#DDF7F2"/>
  <text x="886" y="299" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">SPECIFIC &amp; LOCATED ✓</text>
  <text x="512" y="323" fill="#128486" font-size="12" font-weight="700">"Expiratory wheezes bilaterally;</text>
  <text x="512" y="339" fill="#128486" font-size="12" font-weight="700">decreased following treatment."</text>

  <!-- Strong Example 4 -->
  <rect x="494" y="366" width="456" height="74" rx="8" fill="#FFFFFF" stroke="#86D9C8" stroke-width="2"/>
  <rect x="494" y="366" width="6" height="74" rx="3" fill="#1CA7A8"/>
  <text x="512" y="389" fill="#0B1F33" font-size="11" font-weight="700">Plan / Next Steps</text>
  <rect x="822" y="370" width="114" height="18" rx="5" fill="#DDF7F2"/>
  <text x="879" y="383" text-anchor="middle" fill="#0B7F80" font-size="9" font-weight="700">TIMED &amp; SPECIFIC ✓</text>
  <text x="512" y="407" fill="#128486" font-size="12" font-weight="700">"Reassess WOB and breath sounds</text>
  <text x="512" y="423" fill="#128486" font-size="12" font-weight="700">in 15 min. Notify provider if SpO₂ &lt; 88%."</text>

  <!-- FOOTER -->
  <rect x="0" y="458" width="960" height="42" fill="#0B1F33"/>
  <text x="480" y="476" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700">Key Rule: If another clinician cannot act on your note, make it more specific.</text>
  <text x="480" y="494" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10">PulmoCore · PA 1.3 · Documentation Quality &amp; RT Note Standards</text>

</svg>
