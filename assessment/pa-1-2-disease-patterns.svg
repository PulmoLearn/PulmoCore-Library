<svg viewBox="0 0 960 590" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- BACKGROUND -->
  <rect width="960" height="590" fill="#F4FAFC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="960" height="62" fill="#0B1F33"/>
  <text x="480" y="26" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="1.5">DISEASE PATTERN RECOGNITION MATRIX</text>
  <text x="480" y="49" text-anchor="middle" fill="#1CA7A8" font-size="11" font-weight="600" letter-spacing="2">PA 1.2  ·  CLUSTERS OF FINDINGS — NOT SINGLE CLUES</text>

  <!-- ================================================================ -->
  <!-- COLUMN HEADER ROW (y=68 to y=102) -->
  <!-- ================================================================ -->
  <rect x="0" y="68" width="960" height="38" fill="#102A43"/>

  <!-- Column header text -->
  <!-- Col 0: Condition (x=0, w=170) -->
  <text x="85" y="93" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">CONDITION</text>
  <!-- Divider -->
  <rect x="170" y="68" width="1.5" height="38" fill="rgba(255,255,255,0.15)"/>
  <!-- Col 1: Percussion (x=172, w=138) -->
  <text x="241" y="93" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">PERCUSSION</text>
  <!-- Divider -->
  <rect x="310" y="68" width="1.5" height="38" fill="rgba(255,255,255,0.15)"/>
  <!-- Col 2: Fremitus (x=312, w=148) -->
  <text x="386" y="93" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">FREMITUS</text>
  <!-- Divider -->
  <rect x="460" y="68" width="1.5" height="38" fill="rgba(255,255,255,0.15)"/>
  <!-- Col 3: Trachea (x=462, w=148) -->
  <text x="536" y="93" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">TRACHEA</text>
  <!-- Divider -->
  <rect x="610" y="68" width="1.5" height="38" fill="rgba(255,255,255,0.15)"/>
  <!-- Col 4: Breath Sounds (x=612, w=348) -->
  <text x="786" y="93" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">BREATH SOUNDS</text>

  <!-- ================================================================ -->
  <!-- DATA ROWS (each 74px tall, starting at y=106) -->
  <!-- Row colors alternate: white / very light teal -->
  <!-- ================================================================ -->

  <!-- ===== ROW 1: ASTHMA (y=106) ===== -->
  <rect x="0" y="106" width="960" height="74" fill="#FFFFFF"/>
  <rect x="0" y="106" width="8" height="74" fill="#F4B860"/>
  <text x="22" y="130" fill="#0B1F33" font-size="13" font-weight="700">Asthma</text>
  <text x="22" y="149" fill="#415A77" font-size="10">Airway narrowing</text>
  <rect x="170" y="106" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="178" y="130" fill="#415A77" font-size="11">Hyperresonant</text>
  <text x="178" y="149" fill="#415A77" font-size="10">(air trapping)</text>
  <rect x="310" y="106" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="318" y="130" fill="#415A77" font-size="11">Often decreased</text>
  <text x="318" y="149" fill="#415A77" font-size="10">(air trapping blocks)</text>
  <rect x="460" y="106" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="468" y="130" fill="#415A77" font-size="11">Midline (usual)</text>
  <rect x="610" y="106" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="618" y="130" fill="#415A77" font-size="11">Wheezes, prolonged exhalation</text>
  <text x="618" y="149" fill="#415A77" font-size="11">Diminished during severe episode</text>
  <rect x="0" y="179" width="960" height="1" fill="#D7E6EF"/>

  <!-- ===== ROW 2: PNEUMOTHORAX (y=180) ===== -->
  <rect x="0" y="180" width="960" height="74" fill="#F4FAFC"/>
  <rect x="0" y="180" width="8" height="74" fill="#E85D5D"/>
  <text x="22" y="204" fill="#0B1F33" font-size="13" font-weight="700">Pneumothorax</text>
  <text x="22" y="223" fill="#415A77" font-size="10">Air in pleural space</text>
  <rect x="170" y="180" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="178" y="204" fill="#415A77" font-size="11">Hyperresonant</text>
  <text x="178" y="223" fill="#415A77" font-size="10">(one side)</text>
  <rect x="310" y="180" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="318" y="204" fill="#415A77" font-size="11">Decreased</text>
  <text x="318" y="223" fill="#415A77" font-size="10">(one side)</text>
  <rect x="460" y="180" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="468" y="204" fill="#415A77" font-size="11">May shift away</text>
  <text x="468" y="223" fill="#E85D5D" font-size="10" font-weight="700">⚠ Red flag if shifted</text>
  <rect x="610" y="180" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="618" y="204" fill="#415A77" font-size="11">Absent or markedly decreased</text>
  <text x="618" y="223" fill="#E85D5D" font-size="11" font-weight="700">⚠ One-sided — report promptly</text>
  <rect x="0" y="253" width="960" height="1" fill="#D7E6EF"/>

  <!-- ===== ROW 3: PLEURAL EFFUSION (y=254) ===== -->
  <rect x="0" y="254" width="960" height="74" fill="#FFFFFF"/>
  <rect x="0" y="254" width="8" height="74" fill="#4BA3F2"/>
  <text x="22" y="278" fill="#0B1F33" font-size="13" font-weight="700">Pleural Effusion</text>
  <text x="22" y="297" fill="#415A77" font-size="10">Fluid in pleural space</text>
  <rect x="170" y="254" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="178" y="278" fill="#415A77" font-size="11">Dull</text>
  <text x="178" y="297" fill="#415A77" font-size="10">(fluid blocks tone)</text>
  <rect x="310" y="254" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="318" y="278" fill="#415A77" font-size="11">Decreased</text>
  <text x="318" y="297" fill="#415A77" font-size="10">(fluid blocks vibration)</text>
  <rect x="460" y="254" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="468" y="278" fill="#415A77" font-size="11">May shift away</text>
  <text x="468" y="297" fill="#415A77" font-size="10">(if large effusion)</text>
  <rect x="610" y="254" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="618" y="278" fill="#415A77" font-size="11">Decreased or absent</text>
  <text x="618" y="297" fill="#415A77" font-size="11">over fluid area</text>
  <rect x="0" y="327" width="960" height="1" fill="#D7E6EF"/>

  <!-- ===== ROW 4: CONSOLIDATION (y=328) ===== -->
  <rect x="0" y="328" width="960" height="74" fill="#F4FAFC"/>
  <rect x="0" y="328" width="8" height="74" fill="#415A77"/>
  <text x="22" y="352" fill="#0B1F33" font-size="13" font-weight="700">Consolidation</text>
  <text x="22" y="371" fill="#415A77" font-size="10">Dense lung tissue</text>
  <rect x="170" y="328" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="178" y="352" fill="#415A77" font-size="11">Dull</text>
  <text x="178" y="371" fill="#415A77" font-size="10">(density replaces air)</text>
  <rect x="310" y="328" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="318" y="352" fill="#415A77" font-size="11">Increased</text>
  <text x="318" y="371" fill="#415A77" font-size="10">(vibration travels through density)</text>
  <rect x="460" y="328" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="468" y="352" fill="#415A77" font-size="11">Usually midline</text>
  <rect x="610" y="328" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="618" y="352" fill="#415A77" font-size="11">Bronchial sounds over area</text>
  <text x="618" y="371" fill="#415A77" font-size="11">Crackles possible</text>
  <rect x="0" y="401" width="960" height="1" fill="#D7E6EF"/>

  <!-- ===== ROW 5: ATELECTASIS (y=402) ===== -->
  <rect x="0" y="402" width="960" height="74" fill="#FFFFFF"/>
  <rect x="0" y="402" width="8" height="74" fill="#128486"/>
  <text x="22" y="426" fill="#0B1F33" font-size="13" font-weight="700">Atelectasis</text>
  <text x="22" y="445" fill="#415A77" font-size="10">Lung collapse / underinflation</text>
  <rect x="170" y="402" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="178" y="426" fill="#415A77" font-size="11">Dull</text>
  <text x="178" y="445" fill="#415A77" font-size="10">(collapsed area)</text>
  <rect x="310" y="402" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="318" y="426" fill="#415A77" font-size="11">Decreased or variable</text>
  <rect x="460" y="402" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="468" y="426" fill="#415A77" font-size="11">May pull toward</text>
  <text x="468" y="445" fill="#415A77" font-size="10">(volume loss on that side)</text>
  <rect x="610" y="402" width="1.5" height="74" fill="#D7E6EF"/>
  <text x="618" y="426" fill="#415A77" font-size="11">Diminished or absent</text>
  <text x="618" y="445" fill="#415A77" font-size="11">over collapsed area</text>
  <rect x="0" y="475" width="960" height="1" fill="#D7E6EF"/>

  <!-- ===== ROW 6: PULMONARY EDEMA (y=476) — lighter background -->
  <rect x="0" y="476" width="960" height="68" fill="#F0F8FB"/>
  <rect x="0" y="476" width="8" height="68" fill="#1CA7A8"/>
  <text x="22" y="499" fill="#0B1F33" font-size="13" font-weight="700">Pulmonary Edema</text>
  <text x="22" y="518" fill="#415A77" font-size="10">Fluid in alveoli / interstitium</text>
  <rect x="170" y="476" width="1.5" height="68" fill="#D7E6EF"/>
  <text x="178" y="499" fill="#415A77" font-size="11">Dull (bases)</text>
  <rect x="310" y="476" width="1.5" height="68" fill="#D7E6EF"/>
  <text x="318" y="499" fill="#415A77" font-size="11">Normal/variable</text>
  <rect x="460" y="476" width="1.5" height="68" fill="#D7E6EF"/>
  <text x="468" y="499" fill="#415A77" font-size="11">Midline (usually)</text>
  <rect x="610" y="476" width="1.5" height="68" fill="#D7E6EF"/>
  <text x="618" y="499" fill="#415A77" font-size="11">Crackles at bases</text>
  <text x="618" y="518" fill="#415A77" font-size="11">Possible wheeze if bronchospasm</text>

  <!-- FOOTER -->
  <rect x="0" y="548" width="960" height="42" fill="#0B1F33"/>
  <text x="480" y="568" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700">Patterns guide what to report — clusters matter more than any single finding.</text>
  <text x="480" y="584" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">PulmoCore · PA 1.2 · Disease Pattern Recognition Matrix</text>

</svg>
