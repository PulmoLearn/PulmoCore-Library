<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBRC Registry Test</title>

  <script src="/assets/nbrc-outline-2027.js"></script>
  <script src="/assets/lesson-registry.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
      background: #f4fafc;
      color: #0B1F33;
    }

    pre {
      background: #fff;
      border: 1px solid #d7e6ef;
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d7e6ef;
      background: #1CA7A8;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }
  
    /* ── 508 Accessibility: keyboard focus indicators ── */
    .hotspot-btn:focus-visible {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(244,184,96,0.35);
      z-index: 10;
    }
    .hotspot-btn:focus {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>NBRC Registry Test</h1>
  <p>This page confirms that <code>nbrc-outline-2027.js</code> and <code>lesson-registry.js</code> are loading correctly.</p>

  <button onclick="runStatsTest()">Registry Stats</button>
  <button onclick="runOutlineTest()">Outline Lookup: BOK-I.D.7</button>
  <button onclick="runCoverageTest()">Coverage: BOK-I.D.7</button>
  <button onclick="runInvalidMappingTest()">Invalid Mapping Check</button>
  <button onclick="runSearchTest()">Search: P/F ratio</button>

  <h2>Output</h2>
  <pre id="output">Click a button to run a test.</pre>

  <script>
    function showResult(result) {
      document.getElementById("output").textContent = JSON.stringify(result, null, 2);
      console.log(result);
    }

    function runStatsTest() {
      showResult(PULMO_LESSON_REGISTRY_HELPERS.getRegistryStats());
    }

    function runOutlineTest() {
      showResult(NBRC_RT_DCO_2027_HELPERS.getBreadthItem("BOK-I.D.7"));
    }

    function runCoverageTest() {
      showResult(PULMO_LESSON_REGISTRY_HELPERS.getCoverageByOutlineId("BOK-I.D.7"));
    }

    function runInvalidMappingTest() {
      const invalidRows = PULMO_LESSON_REGISTRY_HELPERS
        .getAlignmentRows()
        .filter(row => !NBRC_RT_DCO_2027_HELPERS.getBreadthItem(row.outlineId));

      showResult({
        invalidCount: invalidRows.length,
        invalidRows
      });
    }

    function runSearchTest() {
      showResult(PULMO_LESSON_REGISTRY_HELPERS.searchLessons("P/F ratio"));
    }

    window.addEventListener("DOMContentLoaded", () => {
      const checks = {
        outlineLoaded: typeof NBRC_RT_DCO_2027 !== "undefined",
        outlineHelpersLoaded: typeof NBRC_RT_DCO_2027_HELPERS !== "undefined",
        registryLoaded: typeof PULMO_LESSON_REGISTRY !== "undefined",
        registryHelpersLoaded: typeof PULMO_LESSON_REGISTRY_HELPERS !== "undefined"
      };

      showResult(checks);
    });
  </script>

  <script>
  /* ── 508 Accessibility: keyboard navigation for hotspot activities ── */
  (function () {
    function initA11yHotspots() {
      document.querySelectorAll('.hotspot-demo').forEach(function (demo) {
        var buttons = Array.from(demo.querySelectorAll('.hotspot-btn'));
        var panel   = demo.querySelector('.hotspot-panel');

        /* aria-live region so screen readers hear the hotspot content */
        var live = demo.querySelector('[data-a11y-live]');
        if (!live) {
          live = document.createElement('div');
          live.setAttribute('aria-live', 'polite');
          live.setAttribute('aria-atomic', 'true');
          live.setAttribute('data-a11y-live', '1');
          live.className = 'sr-only';
          demo.appendChild(live);
        }

        buttons.forEach(function (btn, idx) {
          /* Arrow-key, Home, End navigation within the hotspot group */
          btn.addEventListener('keydown', function (e) {
            var target;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              target = buttons[(idx + 1) % buttons.length];
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              target = buttons[(idx - 1 + buttons.length) % buttons.length];
            } else if (e.key === 'Home') {
              e.preventDefault();
              target = buttons[0];
            } else if (e.key === 'End') {
              e.preventDefault();
              target = buttons[buttons.length - 1];
            }
            if (target) target.focus();
          });

          /* On activation, push content to aria-live region */
          btn.addEventListener('click', function () {
            var title = btn.dataset.title || '';
            var text  = btn.dataset.text  || '';
            live.textContent = title + '. ' + text;
            if (panel) panel.setAttribute('aria-label', title + ': ' + text);
          });
        });

        /* When focus enters the hotspot container, route to first unvisited button */
        var container = demo.querySelector('.hotspot-lung');
        if (container && buttons.length > 0) {
          container.addEventListener('focus', function () {
            var first = buttons.find(function (b) {
              return !b.classList.contains('visited');
            }) || buttons[0];
            first.focus();
          }, true);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initA11yHotspots);
    } else {
      initA11yHotspots();
    }
  })();
  </script>

</body>
</html>
