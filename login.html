<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulmoLearn | Sign In</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/PulmoCore-Library/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/PulmoCore-Library/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/PulmoCore-Library/assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/PulmoCore-Library/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --core-navy: #0B1F33;
      --pulmo-teal: #1CA7A8;
      --pulmo-teal-dark: #128486;
      --soft-border: #D7E6EF;
      --mist-blue: #F4FAFC;
      --white: #FFFFFF;
      --slate: #415A77;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--core-navy);
      font-family: "Atkinson Hyperlegible", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(28,167,168,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--soft-border);
      border-radius: 24px;
      border-top: 8px solid var(--pulmo-teal);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(11,31,51,0.25);
      position: relative;
    }
    .brand {
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--core-navy);
      letter-spacing: -0.04em;
      margin-bottom: 4px;
    }
    .brand span { color: var(--pulmo-teal); }
    .subtitle { color: var(--slate); margin-bottom: 32px; font-size: .95rem; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: .88rem;
      color: var(--core-navy);
    }
    input {
      width: 100%;
      border: 1.5px solid var(--soft-border);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 20px;
      font-size: .98rem;
      font-family: inherit;
      color: var(--core-navy);
      transition: border-color .18s;
      background: #FAFCFE;
    }
    input:focus { outline: none; border-color: var(--pulmo-teal); background: var(--white); }
    .btn {
      width: 100%;
      background: var(--pulmo-teal);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, transform .18s;
      box-shadow: 0 8px 20px rgba(28,167,168,0.28);
    }
    .btn:hover { background: var(--pulmo-teal-dark); transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .error {
      background: #FDE9E9;
      color: #7F2E2E;
      border: 1px solid #F2B5B5;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 18px;
      font-size: .9rem;
      display: none;
    }
    .divider { text-align: center; margin: 20px 0 4px; }
    .footer-link { text-align: center; margin-top: 22px; font-size: .9rem; color: var(--slate); }
    .footer-link a { color: var(--pulmo-teal); font-weight: 700; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .forgot { text-align: right; margin-top: -14px; margin-bottom: 20px; }
    .forgot a { font-size: .82rem; color: var(--slate); font-weight: 700; text-decoration: none; }
    .forgot a:hover { color: var(--pulmo-teal); }
    .back-link {
      position: absolute; top: -40px; left: 0;
      color: rgba(255,255,255,0.6);
      font-size: .88rem; font-weight: 700;
      text-decoration: none;
      display: flex; align-items: center; gap: 6px;
      transition: color .18s;
    }
    .back-link:hover { color: rgba(255,255,255,0.95); }
  
    /* ── 508 Accessibility: keyboard focus indicators ── */
    .hotspot-btn:focus-visible {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(244,184,96,0.35);
      z-index: 10;
    }
    .hotspot-btn:focus {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/PulmoCore-Library/" class="back-link">← Back to PulmoLearn</a>
    <div class="brand">Pulmo<span>Learn</span></div>
    <p class="subtitle">Sign in to continue your learning</p>

    <div class="error" id="errorMsg"></div>

    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

    <div class="forgot"><a href="/PulmoCore-Library/reset.html">Forgot password?</a></div>

    <button class="btn" id="loginBtn">Sign In</button>

    <div class="footer-link">Don't have an account? <a href="/PulmoCore-Library/signup.html">Sign up</a></div>
  </div>

  <script type="module">
    import { supabase } from '/PulmoCore-Library/assets/auth.js'

    // If already logged in, go straight to dashboard
    const { data: { session } } = await supabase.auth.getSession()
    if (session) window.location.href = '/PulmoCore-Library/dashboard.html'

    const loginBtn = document.getElementById('loginBtn')
    const errorMsg = document.getElementById('errorMsg')

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      errorMsg.style.display = 'none'

      if (!email || !password) {
        errorMsg.textContent = 'Please enter your email and password.'
        errorMsg.style.display = 'block'
        return
      }

      loginBtn.disabled = true
      loginBtn.textContent = 'Signing in...'

      const { error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        errorMsg.textContent = error.message
        errorMsg.style.display = 'block'
        loginBtn.disabled = false
        loginBtn.textContent = 'Sign In'
      } else {
        window.location.href = '/PulmoCore-Library/dashboard.html'
      }
    })

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') loginBtn.click()
    })
  </script>

  <script>
  /* ── 508 Accessibility: keyboard navigation for hotspot activities ── */
  (function () {
    function initA11yHotspots() {
      document.querySelectorAll('.hotspot-demo').forEach(function (demo) {
        var buttons = Array.from(demo.querySelectorAll('.hotspot-btn'));
        var panel   = demo.querySelector('.hotspot-panel');

        /* aria-live region so screen readers hear the hotspot content */
        var live = demo.querySelector('[data-a11y-live]');
        if (!live) {
          live = document.createElement('div');
          live.setAttribute('aria-live', 'polite');
          live.setAttribute('aria-atomic', 'true');
          live.setAttribute('data-a11y-live', '1');
          live.className = 'sr-only';
          demo.appendChild(live);
        }

        buttons.forEach(function (btn, idx) {
          /* Arrow-key, Home, End navigation within the hotspot group */
          btn.addEventListener('keydown', function (e) {
            var target;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              target = buttons[(idx + 1) % buttons.length];
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              target = buttons[(idx - 1 + buttons.length) % buttons.length];
            } else if (e.key === 'Home') {
              e.preventDefault();
              target = buttons[0];
            } else if (e.key === 'End') {
              e.preventDefault();
              target = buttons[buttons.length - 1];
            }
            if (target) target.focus();
          });

          /* On activation, push content to aria-live region */
          btn.addEventListener('click', function () {
            var title = btn.dataset.title || '';
            var text  = btn.dataset.text  || '';
            live.textContent = title + '. ' + text;
            if (panel) panel.setAttribute('aria-label', title + ': ' + text);
          });
        });

        /* When focus enters the hotspot container, route to first unvisited button */
        var container = demo.querySelector('.hotspot-lung');
        if (container && buttons.length > 0) {
          container.addEventListener('focus', function () {
            var first = buttons.find(function (b) {
              return !b.classList.contains('visited');
            }) || buttons[0];
            first.focus();
          }, true);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initA11yHotspots);
    } else {
      initA11yHotspots();
    }
  })();
  </script>

</body>
</html>
