<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N04BW4TL3F');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulmoLearn | Sign In</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --core-navy: #0B1F33;
      --pulmo-teal: #1CA7A8;
      --pulmo-teal-dark: #128486;
      --soft-border: #D7E6EF;
      --mist-blue: #F4FAFC;
      --white: #FFFFFF;
      --slate: #415A77;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--core-navy);
      font-family: "Atkinson Hyperlegible", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse 60% 50% at 50% 0%,
          rgba(28,167,168,0.15) 0%,
          transparent 70%
        );
      pointer-events: none;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--soft-border);
      border-radius: 24px;
      border-top: 8px solid var(--pulmo-teal);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(11,31,51,0.25);
      position: relative;
    }

    .brand {
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--core-navy);
      letter-spacing: -0.04em;
      margin-bottom: 4px;
    }

    .brand span {
      color: var(--pulmo-teal);
    }

    .subtitle {
      color: var(--slate);
      margin-bottom: 32px;
      font-size: .95rem;
    }

    .lti-banner {
      display: none;
      background: #DDF7F2;
      border: 1px solid #1CA7A8;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: .9rem;
      color: var(--core-navy);
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: .88rem;
      color: var(--core-navy);
    }

    input {
      width: 100%;
      border: 1.5px solid var(--soft-border);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 20px;
      font-size: .98rem;
      font-family: inherit;
      color: var(--core-navy);
      transition: border-color .18s;
      background: #FAFCFE;
    }

    input:focus {
      outline: none;
      border-color: var(--pulmo-teal);
      background: var(--white);
    }

    .btn {
      width: 100%;
      background: var(--pulmo-teal);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, transform .18s;
      box-shadow: 0 8px 20px rgba(28,167,168,0.28);
    }

    .btn:hover {
      background: var(--pulmo-teal-dark);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: #FDE9E9;
      color: #7F2E2E;
      border: 1px solid #F2B5B5;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 18px;
      font-size: .9rem;
      display: none;
    }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: .9rem;
      color: var(--slate);
    }

    .footer-link a {
      color: var(--pulmo-teal);
      font-weight: 700;
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    .forgot {
      text-align: right;
      margin-top: -14px;
      margin-bottom: 20px;
    }

    .forgot a {
      font-size: .82rem;
      color: var(--slate);
      font-weight: 700;
      text-decoration: none;
    }

    .forgot a:hover {
      color: var(--pulmo-teal);
    }

    .back-link {
      position: absolute;
      top: -40px;
      left: 0;
      color: rgba(255,255,255,0.6);
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .18s;
    }

    .back-link:hover {
      color: rgba(255,255,255,0.95);
    }

    .hotspot-btn:focus-visible {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(244,184,96,0.35);
      z-index: 10;
    }

    .hotspot-btn:focus {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <div class="card">
    <a href="https://www.pulmolearn.com" class="back-link">
      ← Back to PulmoLearn
    </a>

    <div class="brand">
      Pulmo<span>Learn</span>
    </div>

    <p class="subtitle" id="subtitle">
      Sign in to continue your learning
    </p>

    <!-- Shown when arriving from Canvas -->
    <div class="lti-banner" id="ltiBanner">
      Sign in to continue to your PulmoLearn assignment in Canvas.
      <strong>Use the PulmoLearn account you activated with your bookstore voucher.</strong>
    </div>

    <div class="error" id="errorMsg"></div>

    <label for="email">
      Email address
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
    />

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="••••••••"
      autocomplete="current-password"
    />

    <div class="forgot">
      <a href="/reset.html">
        Forgot password?
      </a>
    </div>

    <button class="btn" id="loginBtn">
      Sign In
    </button>

    <div class="footer-link">
      Don't have an account?
      <a href="/signup.html" id="signupLink">
        Sign up
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/assets/auth.js'

    // ─────────────────────────────────────────────────────────────────
    // LOGIN CONTEXT
    // ─────────────────────────────────────────────────────────────────

    const params = new URLSearchParams(window.location.search)

    // Existing LTI account-linking token flow
    const ltiToken = params.get('lti_token')

    // Canvas assignment-return flow
    const lessonId = params.get('lesson')
    const isLtiLaunch = params.get('lti') === '1'

    console.log('PulmoLearn login context:', {
      ltiTokenPresent: Boolean(ltiToken),
      lessonId,
      isLtiLaunch
    })

    // ─────────────────────────────────────────────────────────────────
    // TEMPORARY LTI LESSON MAP
    //
    // This keeps the first two test lessons explicit while we finish
    // validating the Canvas workflow.
    //
    // Later this can be generated from courses.js so it does not need
    // to be maintained separately.
    // ─────────────────────────────────────────────────────────────────

    const lessonMap = {
      foundations_1_1:
        '/foundations/Foundations_1_1_Professional_Communication_Conflict_Resolution.html',

      foundations_1_2:
        '/foundations/Foundations_1_2_Medical_Math_Units_Dosage_Calculations.html'
    }

    // ─────────────────────────────────────────────────────────────────
    // CANVAS DISPLAY
    // ─────────────────────────────────────────────────────────────────

    if (ltiToken || isLtiLaunch) {
      const ltiBanner = document.getElementById('ltiBanner')
      const subtitle = document.getElementById('subtitle')
      const signupLink = document.getElementById('signupLink')

      if (ltiBanner) {
        ltiBanner.style.display = 'block'
      }

      if (subtitle) {
        subtitle.textContent =
          'Sign in to continue to your Canvas assignment'
      }

      // Preserve Canvas context if user goes to signup.
      if (signupLink) {
        const signupParams = new URLSearchParams()

        if (ltiToken) {
          signupParams.set('lti_token', ltiToken)
        }

        if (lessonId) {
          signupParams.set('lesson', lessonId)
        }

        if (isLtiLaunch) {
          signupParams.set('lti', '1')
        }

        const queryString = signupParams.toString()

        signupLink.href = queryString
          ? `/signup.html?${queryString}`
          : '/signup.html'
      }
    }

    // ─────────────────────────────────────────────────────────────────
    // POST-LOGIN DESTINATION
    // ─────────────────────────────────────────────────────────────────

    function getPostLoginRedirect() {
      // Canvas launch:
      // return to exact lesson rather than dashboard.
      if (isLtiLaunch && lessonId) {
        const lessonUrl = lessonMap[lessonId]

        if (lessonUrl) {
          return `${lessonUrl}?lti=1`
        }

        console.warn(
          `PulmoLearn: No lesson mapping found for "${lessonId}".`
        )
      }

      // Normal PulmoLearn website login.
      return '/dashboard.html'
    }

    // ─────────────────────────────────────────────────────────────────
    // EXISTING LTI ACCOUNT-LINK FLOW
    // ─────────────────────────────────────────────────────────────────

    async function handleLtiLinkIfPresent() {
      if (!ltiToken) {
        return false
      }

      const {
        data: { session }
      } = await supabase.auth.getSession()

      if (!session) {
        return false
      }

      try {
        const resp = await fetch('/api/lti/link', {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            lti_token: ltiToken,
            access_token: session.access_token
          })
        })

        const result = await resp.json()

        if (result.ok && result.redirect) {
          console.log(
            'PulmoLearn: LTI account link complete. Redirecting:',
            result.redirect
          )

          window.location.href = result.redirect
          return true
        }

        if (!resp.ok) {
          console.warn(
            'PulmoLearn: LTI link endpoint returned an error:',
            result
          )
        }

      } catch (err) {
        console.error(
          'PulmoLearn: LTI link failed:',
          err
        )
      }

      // Do not trap the learner if linking fails.
      // Continue to the Canvas lesson/dashboard routing below.
      return false
    }

    // ─────────────────────────────────────────────────────────────────
    // ALREADY LOGGED IN
    // ─────────────────────────────────────────────────────────────────

    const {
      data: { session: existingSession }
    } = await supabase.auth.getSession()

    if (existingSession) {
      console.log(
        'PulmoLearn: Existing authenticated session detected.'
      )

      const handled = await handleLtiLinkIfPresent()

      if (!handled) {
        const redirect = getPostLoginRedirect()

        console.log(
          'PulmoLearn: Existing session redirect:',
          redirect
        )

        window.location.href = redirect
      }
    }

    // ─────────────────────────────────────────────────────────────────
    // FORM CONTROLS
    // ─────────────────────────────────────────────────────────────────

    const loginBtn =
      document.getElementById('loginBtn')

    const errorMsg =
      document.getElementById('errorMsg')

    const emailInput =
      document.getElementById('email')

    const passwordInput =
      document.getElementById('password')

    function showError(message) {
      if (!errorMsg) return

      errorMsg.textContent = message
      errorMsg.style.display = 'block'
    }

    function clearError() {
      if (!errorMsg) return

      errorMsg.textContent = ''
      errorMsg.style.display = 'none'
    }

    function setLoginBusy(isBusy) {
      if (!loginBtn) return

      loginBtn.disabled = isBusy

      loginBtn.textContent = isBusy
        ? 'Signing in...'
        : 'Sign In'
    }

    // ─────────────────────────────────────────────────────────────────
    // SIGN IN
    // ─────────────────────────────────────────────────────────────────

    async function signIn() {
      clearError()

      const email =
        emailInput?.value.trim() || ''

      const password =
        passwordInput?.value || ''

      if (!email || !password) {
        showError(
          'Please enter your email and password.'
        )

        return
      }

      setLoginBusy(true)

      try {
        const {
          data,
          error
        } = await supabase.auth.signInWithPassword({
          email,
          password
        })

        if (error) {
          showError(error.message)
          setLoginBusy(false)
          return
        }

        if (!data?.session) {
          showError(
            'Sign in succeeded, but no active session was created. Please try again.'
          )

          setLoginBusy(false)
          return
        }

        console.log(
          'PulmoLearn: Sign in successful.'
        )

        // Preserve your existing account-linking workflow.
        const handled =
          await handleLtiLinkIfPresent()

        if (handled) {
          return
        }

        // Canvas → selected assignment lesson
        // Website → dashboard
        const redirect =
          getPostLoginRedirect()

        console.log(
          'PulmoLearn: Redirecting after login:',
          redirect
        )

        window.location.href = redirect

      } catch (err) {
        console.error(
          'PulmoLearn: Sign in failed:',
          err
        )

        showError(
          'Unable to sign in right now. Please try again.'
        )

        setLoginBusy(false)
      }
    }

    if (loginBtn) {
      loginBtn.addEventListener(
        'click',
        signIn
      )
    }

    // Allow Enter to submit.
    document.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Enter') {
          event.preventDefault()
          signIn()
        }
      }
    )
  </script>

  <script>
    /* ── 508 Accessibility: keyboard navigation for hotspot activities ── */

    (function () {
      function initA11yHotspots() {
        document.querySelectorAll('.hotspot-demo').forEach(function (demo) {
          var buttons =
            Array.from(
              demo.querySelectorAll('.hotspot-btn')
            )

          var panel =
            demo.querySelector('.hotspot-panel')

          var live =
            demo.querySelector('[data-a11y-live]')

          if (!live) {
            live =
              document.createElement('div')

            live.setAttribute(
              'aria-live',
              'polite'
            )

            live.setAttribute(
              'aria-atomic',
              'true'
            )

            live.setAttribute(
              'data-a11y-live',
              '1'
            )

            live.className = 'sr-only'

            demo.appendChild(live)
          }

          buttons.forEach(function (btn, idx) {
            btn.addEventListener(
              'keydown',
              function (e) {
                var target

                if (
                  e.key === 'ArrowRight' ||
                  e.key === 'ArrowDown'
                ) {
                  e.preventDefault()

                  target =
                    buttons[
                      (idx + 1) %
                      buttons.length
                    ]

                } else if (
                  e.key === 'ArrowLeft' ||
                  e.key === 'ArrowUp'
                ) {
                  e.preventDefault()

                  target =
                    buttons[
                      (idx - 1 + buttons.length) %
                      buttons.length
                    ]

                } else if (
                  e.key === 'Home'
                ) {
                  e.preventDefault()
                  target = buttons[0]

                } else if (
                  e.key === 'End'
                ) {
                  e.preventDefault()

                  target =
                    buttons[
                      buttons.length - 1
                    ]
                }

                if (target) {
                  target.focus()
                }
              }
            )

            btn.addEventListener(
              'click',
              function () {
                var title =
                  btn.dataset.title || ''

                var text =
                  btn.dataset.text || ''

                live.textContent =
                  title + '. ' + text

                if (panel) {
                  panel.setAttribute(
                    'aria-label',
                    title + ': ' + text
                  )
                }
              }
            )
          })

          var container =
            demo.querySelector(
              '.hotspot-lung'
            )

          if (
            container &&
            buttons.length > 0
          ) {
            container.addEventListener(
              'focus',
              function () {
                var first =
                  buttons.find(
                    function (b) {
                      return !b.classList.contains(
                        'visited'
                      )
                    }
                  ) || buttons[0]

                first.focus()
              },
              true
            )
          }
        })
      }

      if (
        document.readyState === 'loading'
      ) {
        document.addEventListener(
          'DOMContentLoaded',
          initA11yHotspots
        )
      } else {
        initA11yHotspots()
      }
    })()
  </script>
</body>
</html>
