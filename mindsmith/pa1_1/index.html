<!doctype html>
<html lang="en">
<head>
  <base href="/mindsmith/pa1_1/">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Respiratory Patient Assessment &amp; Interviewing</title>

  <link rel="icon" href="assets/favicon.ico" sizes="any" type="image/x-icon"/>
  <link rel="icon" href="assets/favicon-32x32.png" sizes="32x32" type="image/png"/>
  <link rel="icon" href="assets/favicon-16x16.png" sizes="16x16" type="image/png"/>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="stylesheet" href="assets/fonts/fonts.css"/>

  <script src="fonts-list.js"></script>
  <script>
    function preloadFonts(fontsList) {
      const head = document.head || document.getElementsByTagName("head")[0];

      fontsList.forEach((url) => {
        const link = document.createElement("link");
        link.rel = "preload";
        link.href = url;
        link.as = "font";
        link.crossOrigin = "anonymous";

        const ext = url.split(".").pop().toLowerCase();
        switch (ext) {
          case "woff":
            link.type = "font/woff";
            break;
          case "woff2":
            link.type = "font/woff2";
            break;
          case "ttf":
            link.type = "font/ttf";
            break;
          case "otf":
            link.type = "font/otf";
            break;
          default:
            link.type = "font/ttf";
        }

        head.appendChild(link);
      });
    }

    if (typeof fontsList !== "undefined" && Array.isArray(fontsList)) {
      preloadFonts(fontsList);
    }
  </script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #content {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
    }
  
    /* ── 508 Accessibility: keyboard focus indicators ── */
    .hotspot-btn:focus-visible {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(244,184,96,0.35);
      z-index: 10;
    }
    .hotspot-btn:focus {
      outline: 3px solid var(--clinical-amber, #F4B860);
      outline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <link href="main.css" rel="stylesheet"/>
</head>
<body>
  <script src="lesson-data.js"></script>
  <script src="languages.js"></script>
  <script src="static-learner-strings.js"></script>

  <div id="root"></div>

  <script defer src="main.js"></script>

  <script>
  /* ── 508 Accessibility: keyboard navigation for hotspot activities ── */
  (function () {
    function initA11yHotspots() {
      document.querySelectorAll('.hotspot-demo').forEach(function (demo) {
        var buttons = Array.from(demo.querySelectorAll('.hotspot-btn'));
        var panel   = demo.querySelector('.hotspot-panel');

        /* aria-live region so screen readers hear the hotspot content */
        var live = demo.querySelector('[data-a11y-live]');
        if (!live) {
          live = document.createElement('div');
          live.setAttribute('aria-live', 'polite');
          live.setAttribute('aria-atomic', 'true');
          live.setAttribute('data-a11y-live', '1');
          live.className = 'sr-only';
          demo.appendChild(live);
        }

        buttons.forEach(function (btn, idx) {
          /* Arrow-key, Home, End navigation within the hotspot group */
          btn.addEventListener('keydown', function (e) {
            var target;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              target = buttons[(idx + 1) % buttons.length];
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              target = buttons[(idx - 1 + buttons.length) % buttons.length];
            } else if (e.key === 'Home') {
              e.preventDefault();
              target = buttons[0];
            } else if (e.key === 'End') {
              e.preventDefault();
              target = buttons[buttons.length - 1];
            }
            if (target) target.focus();
          });

          /* On activation, push content to aria-live region */
          btn.addEventListener('click', function () {
            var title = btn.dataset.title || '';
            var text  = btn.dataset.text  || '';
            live.textContent = title + '. ' + text;
            if (panel) panel.setAttribute('aria-label', title + ': ' + text);
          });
        });

        /* When focus enters the hotspot container, route to first unvisited button */
        var container = demo.querySelector('.hotspot-lung');
        if (container && buttons.length > 0) {
          container.addEventListener('focus', function () {
            var first = buttons.find(function (b) {
              return !b.classList.contains('visited');
            }) || buttons[0];
            first.focus();
          }, true);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initA11yHotspots);
    } else {
      initA11yHotspots();
    }
  })();
  </script>

</body>
</html>
