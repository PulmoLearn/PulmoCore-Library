  <link rel="stylesheet" href="assets/fonts/fonts.css"/>

  <script src="fonts-list.js"></script>
  <script>
    function preloadFonts(fontsList) {
      const head = document.head || document.getElementsByTagName("head")[0];

      fontsList.forEach((url) => {
        const link = document.createElement("link");
        link.rel = "preload";
        link.href = url;
        link.as = "font";
        link.crossOrigin = "anonymous";

        const ext = url.split(".").pop().toLowerCase();
        switch (ext) {
          case "woff":
            link.type = "font/woff";
            break;
          case "woff2":
            link.type = "font/woff2";
            break;
          case "ttf":
            link.type = "font/ttf";
            break;
          case "otf":
            link.type = "font/otf";
            break;
          default:
            link.type = "font/ttf";
        }

        head.appendChild(link);
      });
    }

    if (typeof fontsList !== "undefined" && Array.isArray(fontsList)) {
      preloadFonts(fontsList);
    }
  </script>

  <style>

    html {
